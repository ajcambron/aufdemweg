  directions: "Each person reads ONE card: Köln, Mainz, Rottweil or Basel. Then explain your city's Karneval to your group in German while the others complete the chart. Finally, choose together which city you'd most like to visit and write two reasons."
  a1: "Short answers in the chart are fine: Helau! Holzmasken. Um vier Uhr morgens."
  b1: "Explain one difference with aber or während: In Köln ist es laut, während es in Basel fast feierlich ist."
