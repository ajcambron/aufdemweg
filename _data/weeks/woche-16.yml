reading:
  a1:
    texts:
      - ["Jana", "Ich heiße Jana und ich wohne in Köln. Karneval ist hier die fünfte Jahreszeit! Dieses Jahr gehe ich als Biene. Mein Bruder trägt ein Piratenkostüm. Am Rosenmontag sehen wir den großen Umzug und sammeln Kamelle. Alle rufen: Kölle Alaaf!"]
      - ["David", "Ich heiße David. Bei uns in Delaware gibt es keinen Karneval, aber an Halloween verkleide ich mich gern. Letztes Jahr war ich ein Zombie. Meine Freundin trägt immer ein lustiges Kostüm. Ich möchte einmal nach Köln fahren und Karneval sehen."]
    questions:
      - ["What is Jana dressing up as?", "A bee"]
      - ["What is her brother wearing?", "A pirate costume"]
      - ["When does David dress up?", "At Halloween"]
      - ["What would David like to do someday?", "Go to Cologne and see Karneval"]
  b1:
    texts:
      - ["Frau Krämer", "Ich bin seit dreißig Jahren in einem Mainzer Fastnachtsverein. Für uns ist Fastnacht nicht nur Party, sondern auch Politik: In den Sitzungen stehen Redner in der Bütt und machen sich über Politiker lustig. Früher war das eine der wenigen Gelegenheiten, bei denen man die Mächtigen offen kritisieren durfte. Narrenfreiheit nennt man das."]
      - ["Felix", "In Basel ist die Fasnacht ganz anders als in Köln. Sie beginnt am Montag nach Aschermittwoch, genau um vier Uhr morgens, mit dem Morgestraich: In der ganzen Altstadt gehen die Lichter aus, und Tausende Menschen mit Masken und großen Laternen ziehen durch die dunklen Straßen und spielen Piccolo und Trommel. Es ist gar nicht laut und lustig, sondern fast feierlich. Ich bekomme jedes Mal Gänsehaut."]
    questions:
      - ["Was machen die Redner in der Bütt?", "Sie machen sich über Politiker lustig."]
      - ["Was bedeutet Narrenfreiheit?", "An Fastnacht darf man die Mächtigen offen kritisieren."]
      - ["Wann beginnt die Basler Fasnacht?", "Am Montag nach Aschermittwoch um vier Uhr morgens."]
      - ["Wie ist die Stimmung beim Morgestraich?", "Fast feierlich, nicht laut und lustig."]

