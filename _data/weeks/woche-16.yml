builder:
  - title: "Mein Kostüm (My costume)"
    rows:
      - ["Ich gehe als Pirat / als Prinzessin / als Clown.", "I'm going as a pirate / a princess / a clown."]
      - ["Ich verkleide mich als ...", "I'm dressing up as ..."]
      - ["Ich trage eine Maske / eine Perücke / einen Hut.", "I'm wearing a mask / a wig / a hat."]
      - ["Du trägst ... / Er, sie trägt ...", "You're wearing ... / He, she is wearing ..."]
      - ["das Kostüm / die Verkleidung", "costume / disguise"]
      - ["lustig, gruselig, bunt, verrückt", "funny, scary, colorful, crazy"]
  - title: "Karneval, Fasching, Fastnacht"
    rows:
      - ["Kölle Alaaf! (Köln) / Helau! (Mainz, Düsseldorf)", "Karneval cheers (Cologne / Mainz, Düsseldorf)"]
      - ["der Umzug / der Rosenmontagszug", "parade / Rose Monday parade"]
      - ["Kamelle (Bonbons), Kostüme, Musik", "candy thrown from the floats, costumes, music"]
      - ["am 11.11. um 11:11 Uhr", "November 11 at 11:11: the season opens"]
      - ["Weiberfastnacht: Frauen schneiden Krawatten ab.", "Women's Carnival Day: women cut off men's ties."]
      - ["Am Aschermittwoch ist alles vorbei.", "On Ash Wednesday it's all over."]

