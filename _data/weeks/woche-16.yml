extension:
  title: "Karneval: Spaß für alle?"
  intro: "Lies die zwei Meinungen und beantworte die Fragen."
  text: |
    Lukas, 17, Köln: Karneval ist das Schönste am ganzen Jahr. Alle feiern zusammen, egal wie alt man ist oder woher man kommt. An Karneval spricht man mit Fremden und singt mit ihnen. Wo gibt es das sonst?

    Aylin, 18, Düsseldorf: Ich mag die Kostüme und die Umzüge, aber manche Kostüme sind problematisch, zum Beispiel wenn sich Leute als Klischee einer anderen Kultur verkleiden. Außerdem trinken viele zu viel Alkohol, und die Stadt ist danach voller Müll. Karneval sollte respektvoller werden.
  questions:
    - ["Was gefällt Lukas am Karneval?", "Alle feiern zusammen; man spricht mit Fremden und singt mit ihnen."]
    - ["Welche Kostüme findet Aylin problematisch?", "Kostüme, die das Klischee einer anderen Kultur zeigen."]
    - ["Welche anderen Probleme nennt Aylin?", "Zu viel Alkohol und viel Müll."]
    - ["Was meinst du: Welche Kostüme sind okay, welche nicht?", "Open answer."]
  task: "Schreib einen Kommentar (5–6 Sätze) für die Schülerzeitung: Was macht ein gutes Karnevalskostüm aus? Beziehe dich auf beide Meinungen (Lukas meint ..., Aylin findet ...)."

buffer: "Paper-plate masks, described in German while students work (Meine Maske ist rot und gruselig.), or schunkeln practice: link arms and sway to a Karneval song."

page:
  modules:
    einstieg: "Karneval photos: Was trägt er? Was trägt sie?"
    input: "Sentence builder + narrow reading (Jana & David, Frau Krämer & Felix) + Achte auf die Form"
    kernaufgabe: "Karneval-Jigsaw: Köln, Mainz, Rottweil, Basel"
    landeskunde: "Die fünfte Jahreszeit"
    energizer: "Kamelle-Quiz"
    extension: "Karneval: Spaß für alle? (opinion commentary)"
    buffer: "Paper-plate masks, or schunkeln"
  einstieg: "Show 4–5 photos: a Cologne Rosenmontag float, costumed crowds, a carved Swabian wooden mask, Basel's lanterns in the dark. For each, ask *Was trägt er / sie?* Students answer in single words (*eine Maske, einen Hut*). Then ask *Wo ist das, glaubst du?* and let them guess."
  materials:
    - "Student packet, one per student"
    - "Photos for the Einstieg (Cologne parade, a Swabian-Alemannic wooden mask, Basel's Morgestraich)"
    - "Optional: paper plates and markers for masks"
  summary: "Karneval-Jigsaw. In groups of four, each student reads one card (Köln, Mainz, Rottweil or Basel) and explains that city's Karneval while the others fill in a comparison chart. Then the group picks the city they'd most like to visit and writes two reasons. B1/B2 explain a difference with *aber* or *während*."
  note:
    type: important
    text: "This class falls on **Karnevalssonntag**, the real Sunday before Rosenmontag (February 8, 2027). Costumes are welcome if your program allows it; even a hat or face paint sets the mood."
  grammar: |
    **Ich gehe als ...** *Als* (as) is followed by a plain noun, usually without an article: *Ich gehe **als** Pirat. Sie geht **als** Hexe.* Many role nouns have a female form in *-in*: *als Pirat / als Piratin*. B1/B2 add *sich verkleiden als*: *Ich verkleide mich als Clown.*

    **tragen changes its vowel** in the *du* and *er/sie* forms:

    | | tragen |
    | :--- | :--- |
    | ich | trage |
    | du | **trägst** |
    | er / sie | **trägt** |
    | wir / sie / Sie | tragen |

    Same pattern: *fahren → du fährst*, *schlafen → er schläft*. (Week 10's command *Fahr!* drops the umlaut again.)
  achtung: "**What students will do:** say *„Er tragt“* or *„Du tragst“*, dropping the umlaut. It doesn't block meaning, so restate it: *„Ja, er trägt eine Maske!“* The Achte-auf-die-Form items blank out the subject, so the verb ending is the only clue to who's wearing what. Also expect *„Ich gehe wie ein Pirat.“* *Wie* means \"like\"; *als* means \"as.\""
  b2: "**If a B2 asks:** *Karneval, Fasching, Fastnacht* and *Fasnet* are regional names for the same season. *Kamelle* is Cologne dialect for candy. *Während* (while) sends the verb to the end, like *weil*. The two opinions in the extension are invented, but the debate about stereotyped costumes is a real one in Germany."
  vocab_extra:
    - ["sich verkleiden", "to dress up"]
    - ["der Narr / die Närrin", "fool, jester (m / f)"]
    - ["die Bütt", "barrel-shaped podium for Karneval speeches"]
    - ["die Büttenrede", "satirical Karneval speech"]
    - ["schunkeln", "to link arms and sway to music"]
    - ["die Narrenfreiheit", "fool's license to mock anyone"]
