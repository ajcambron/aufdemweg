week: 21
date: 2027-03-14
date_label: "Sonntag, 14. März 2027"
theme: "Deutschland-Kunde"
cando:
  a1: "say where German-speaking cities are and what they're known for"
  b1b2: "compare regions of the German-speaking world, including how people speak"
grammar_focus: "Where things are: im Norden / im Süden / im Osten / im Westen, in der Mitte; am Rhein, an der Elbe; in der Nähe von."
ap:
  unit: "AP theme: Language and Culture (dialects, regional identity) / Global Contexts"
  mode: "Interpretive reading (jigsaw) + spoken cultural comparison"
  note: "The extension's 40-second comparison of regional vocabulary is a ready-made AP Q&A rehearsal: a product (a word) linked to a perspective (regional identity)."

builder:
  - title: "Wo liegt das? (Where is it?)"
    rows:
      - ["Hamburg liegt im Norden.", "Hamburg is in the north."]
      - ["München liegt im Süden, in Bayern.", "Munich is in the south, in Bavaria."]
      - ["Dresden liegt im Osten. Köln liegt im Westen.", "Dresden is in the east. Cologne is in the west."]
      - ["Frankfurt liegt in der Mitte von Deutschland.", "Frankfurt is in the middle of Germany."]
      - ["Köln liegt am Rhein. Hamburg liegt an der Elbe.", "Cologne is on the Rhine. Hamburg is on the Elbe."]
      - ["in der Nähe von Berlin / von den Alpen", "near Berlin / near the Alps"]
      - ["Die Hauptstadt von Österreich ist Wien.", "The capital of Austria is Vienna."]
  - title: "Länder und Regionen (Countries and regions)"
    rows:
      - ["Deutschland hat 16 Bundesländer.", "Germany has 16 states."]
      - ["das Bundesland / die Landeshauptstadt", "state / state capital"]
      - ["die Nordsee, die Ostsee, die Alpen", "the North Sea, the Baltic Sea, the Alps"]
      - ["der Rhein, die Elbe, die Donau", "the Rhine, the Elbe, the Danube"]
      - ["Moin! / Grüß Gott! / Servus! / Grüezi!", "Hello! (north / south / Bavaria and Austria / Switzerland)"]
      - ["das Brötchen / die Semmel / die Schrippe / das Weckle", "bread roll (standard / Bavaria and Austria / Berlin / Swabia)"]

vocab:
  complete:
    - ["Hamburg liegt im ___.", "Hamburg is in the north.", "Norden"]
    - ["Köln liegt am ___.", "Cologne is on the Rhine.", "Rhein"]
    - ["Deutschland hat 16 ___.", "Germany has 16 states.", "Bundesländer"]
    - ["Die Hauptstadt von Österreich ist ___.", "The capital of Austria is Vienna.", "Wien"]
    - ["In Bayern sagt man: Grüß ___!", "In Bavaria people say: Grüß Gott!", "Gott"]
    - ["München liegt in der Nähe ___ den Alpen.", "Munich is near the Alps.", "von"]
  match:
    - ["der Norden", "north"]
    - ["der Süden", "south"]
    - ["der Osten", "east"]
    - ["der Westen", "west"]
    - ["die Hauptstadt", "capital"]
    - ["der Fluss", "river"]
  match_order: [2, 4, 1, 6, 3, 5]
  translate:
    - ["Berlin ist die Hauptstadt von Deutschland.", "Berlin is the capital of Germany."]
    - ["Dresden liegt im Osten an der Elbe.", "Dresden is in the east, on the Elbe."]
    - ["Die Alpen sind im Süden.", "The Alps are in the south."]
    - ["Bern ist die Hauptstadt der Schweiz.", "Bern is the capital of Switzerland."]
    - ["In Hamburg sagt man Moin.", "In Hamburg people say Moin."]
    - ["Bayern ist das größte Bundesland.", "Bavaria is the largest state."]
    - ["Die Donau fließt durch Wien.", "The Danube flows through Vienna."]
    - ["Ich möchte an die Ostsee fahren.", "I'd like to go to the Baltic Sea."]
  letters: ["Bundesland", "Hauptstadt", "Norden", "Osten", "Alpen", "Nordsee", "Rhein", "Schweiz"]
  broken:
    - ["München liegt im Süden von Deutschland.", "Munich is in the south of Germany."]
    - ["Hamburg hat einen großen Hafen.", "Hamburg has a big port."]
    - ["Köln ist bekannt für den Dom.", "Cologne is known for its cathedral."]
    - ["In Wien gibt es viele Kaffeehäuser.", "Vienna has many coffeehouses."]
  suitable:
    - "___ liegt im Norden."
    - "___ liegt im Süden."
    - "Ich möchte ___ besuchen, weil ___."
    - "Die Hauptstadt von ___ ist ___."
    - "___ ist bekannt für ___."
    - "In ___ sagt man ___."

reading:
  a1:
    texts:
      - ["Jan", "Moin! Ich heiße Jan und ich wohne in Hamburg. Hamburg liegt im Norden, an der Elbe. Hamburg hat einen großen Hafen mit vielen Schiffen. Die Nordsee ist nicht weit. Hier regnet es oft, aber ich mag meine Stadt!"]
      - ["Vroni", "Servus! Ich heiße Veronika, aber alle sagen Vroni. Ich wohne in München. München liegt im Süden, in Bayern. In der Nähe sind die Alpen. Im Winter fahren wir Ski, und im Sommer wandern wir in den Bergen. Bei uns sagt man Semmel, nicht Brötchen!"]
    questions:
      - ["Where is Hamburg?", "In the north, on the Elbe"]
      - ["What does Hamburg have?", "A big port with many ships"]
      - ["What is near Munich?", "The Alps"]
      - ["What word does Vroni use for a bread roll?", "Semmel"]
  b1:
    texts:
      - ["Dr. Lorenz", "Ich bin Sprachwissenschaftlerin. Deutsch klingt nicht überall gleich. Im Norden sagt man „Moin“, im Süden „Grüß Gott“ oder „Servus“. Für ein einfaches Brötchen gibt es über zehn regionale Wörter. In der Schweiz spricht man im Alltag Schweizerdeutsch, das viele Deutsche kaum verstehen. Geschrieben wird aber überall Hochdeutsch. Dialekte sind ein Teil der regionalen Identität, und viele junge Leute sind wieder stolz darauf."]
      - ["Mehmet", "Ich wohne in Berlin, und hier ist alles gemischt: Menschen aus der ganzen Welt und aus allen Bundesländern. Berlin war bis 1990 in Ost und West geteilt. Mein Vater ist in Ost-Berlin geboren, meine Mutter in Istanbul. Ich sage manchmal „ick“ statt „ich“, wie echte Berliner. Für mich ist Berlin nicht typisch deutsch, sondern einfach Berlin."]
    questions:
      - ["Wie grüßt man im Norden und im Süden?", "Im Norden „Moin“, im Süden „Grüß Gott“ oder „Servus“."]
      - ["Was spricht man in der Schweiz im Alltag?", "Schweizerdeutsch."]
      - ["Wie war Berlin bis 1990?", "In Ost und West geteilt."]
      - ["Was sagt Mehmet manchmal statt „ich“?", "„Ick“, wie echte Berliner."]

