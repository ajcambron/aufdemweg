task:
  title: "Deutschland-Puzzle (region jigsaw)"
  format: "Group jigsaw, groups of four"
  directions: "Each person reads ONE region card: Norden, Süden, Osten or Westen. Explain your region to the group in German and point to it on the class map while the others fill in the chart. Then plan a one-week trip together: three stops in three different regions, with a reason for each stop."
  a1: "Short answers in the chart are fine: Hamburg. Die Elbe. Moin!"
  b1: "Give each stop a reason with weil, and compare two regions with während: Im Süden gibt es Berge, während der Norden flach ist."
  tables:
    - title: "Die vier Regionen"
      head: ["Norden", "Süden", "Osten", "Westen"]
      rows:
        - ["Städte: Hamburg, Bremen, Kiel. Wasser: die Nordsee, die Ostsee, die Elbe. Bekannt für: Häfen, Schiffe, Fischbrötchen, Leuchttürme. Gruß: Moin! Das Wetter ist oft windig und regnerisch.", "Städte: München, Stuttgart, Nürnberg. Landschaft: die Alpen, der Bodensee, der Schwarzwald. Bekannt für: Autos (Stuttgart), das Oktoberfest, Brezeln, Schlösser wie Neuschwanstein. Gruß: Grüß Gott! oder Servus!", "Städte: Berlin, Dresden, Leipzig. Wasser: die Elbe, die Spree. Bekannt für: Geschichte (die Berliner Mauer bis 1989), Musik (Bach in Leipzig), die Frauenkirche in Dresden. In Berlin sagt man ick statt ich.", "Städte: Köln, Düsseldorf, Bonn; Frankfurt in der Mitte. Wasser: der Rhein. Bekannt für: den Kölner Dom, Karneval, Weinberge am Rhein, Banken in Frankfurt. Gruß: Hallo! oder Tach!"]
    - title: "Vergleich (comparison chart)"
      head: ["", "Norden", "Süden", "Osten", "Westen"]
