        - ["3", "", ""]

output:
  a1: "Write a postcard from one German-speaking city without naming it: Ich bin in ___. Die Stadt liegt im ___. Hier gibt es ___. Man sagt ___. Read it to a partner; they guess the city."
  b1: "Write a short comparison (5–6 sentences) of two German-speaking regions or cities: location, landscape, what they're known for and how people greet each other. End with which one you'd rather visit and why. Your partner adds one fact you didn't mention."

landeskunde:
  title: "16 Länder, viele Identitäten"
  text: |
    Germany is a federal republic of 16 states (Bundesländer), and each one runs its own schools, police and cultural life. That's why school vacations, school types and even the number of years of high school differ from state to state (remember Week 6). Three of the states are just cities: Berlin, Hamburg and Bremen.

    Regional identity is strong. Many people feel Bavarian, Saxon or Hamburgian first and German second, and dialect tells others where you're from. German is also the main language of Austria and Liechtenstein, one of four national languages of Switzerland, and an official language in Luxembourg, in a small region of eastern Belgium and in South Tyrol in northern Italy.
  warum: "Germany only became one country in 1871 and was divided again from 1949 to 1990. How might that history explain why regions and states matter so much?"
  vergleich: "How strong is state identity in the US? Do you feel more Delawarean or more American? Which words or accents mark regions here (soda or pop)?"

exit:
  a1: "Ich kann sagen, wo deutsche Städte liegen und wofür sie bekannt sind."
  b1: "Ich kann Regionen vergleichen und über Dialekte sprechen."

energizer:
  title: "Stadt-Land-Fluss"
  text: "The classic German word game. Call out a letter; students write a city (Stadt), a country (Land) and a river (Fluss) starting with it as fast as they can (B: Bremen, Belgien, ...). The first to finish shouts Stopp! Unique answers score 10 points, shared ones 5. Add a food column if it's too easy."

extension:
  title: "Ein Ding, viele Wörter: das Brötchen"
  intro: "Lies den Text und beantworte die Fragen."
  text: "Wenn man in Deutschland beim Bäcker ein Brötchen kaufen will, muss man aufpassen. In Berlin heißt es Schrippe, in Bayern und Österreich Semmel, in Schwaben Weckle und im Saarland Weck. In Hamburg sagt man Rundstück. Wer mit dem „falschen“ Wort bestellt, bekommt trotzdem sein Brötchen, aber die Verkäuferin weiß sofort: Du bist nicht von hier. Sprachforscher sammeln solche Wörter auf Karten, zum Beispiel im „Atlas zur deutschen Alltagssprache“. Viele dieser Wörter werden seltener, weil große Bäckereiketten überall „Brötchen“ auf ihre Schilder schreiben."
  questions:
    - ["Wie heißt ein Brötchen in Berlin, in Bayern und in Hamburg?", "Schrippe, Semmel und Rundstück."]
    - ["Was passiert, wenn man das „falsche“ Wort benutzt?", "Man bekommt das Brötchen trotzdem, aber die Verkäuferin weiß, dass man nicht von hier ist."]
    - ["Was sammeln Sprachforscher im „Atlas zur deutschen Alltagssprache“?", "Regionale Wörter, auf Karten."]
    - ["Warum werden viele dieser Wörter seltener?", "Weil Bäckereiketten überall „Brötchen“ schreiben."]
  task: "Kulturvergleich, 40 Sekunden, mündlich: Welche Wörter sind in den USA regional verschieden (soda / pop, sneakers / tennis shoes ...)? Was sagen solche Wörter über Identität?"

buffer: "Name the 16 states on a blank outline map (print separately), or a second round of Stadt-Land-Fluss."

page:
  modules:
    einstieg: "Map of Germany: point, name, either/or questions"
    input: "Sentence builder + narrow reading (Jan & Vroni, Dr. Lorenz & Mehmet) + Achte auf die Form"
    kernaufgabe: "Deutschland-Puzzle: region jigsaw + trip plan"
    landeskunde: "16 Länder, viele Identitäten"
    energizer: "Stadt-Land-Fluss"
    extension: "Ein Ding, viele Wörter: das Brötchen + 40-second comparison"
    buffer: "Blank map of the 16 states, or more Stadt-Land-Fluss"
  einstieg: "Put a large map of Germany (with Austria and Switzerland) on the screen or wall. Point and name: *Das ist Berlin. Berlin liegt im Osten. Das ist München. München liegt im Süden.* Then ask either/or questions: *Liegt Hamburg im Norden oder im Süden?* Students answer with one word."
  materials:
    - "Student packet, one per student"
    - "A large map of Germany, Austria and Switzerland, projected or printed (needed for the Einstieg and the jigsaw)"
    - "Optional: blank outline maps of the 16 states for the buffer"
  summary: "Deutschland-Puzzle. In groups of four, each student reads one region card (Norden, Süden, Osten or Westen), explains it and points to it on the class map while the others fill in a comparison chart. Then the group plans a one-week trip with three stops in three regions and a reason for each. A1/A2 fill the chart with short answers; B1/B2 justify each stop with *weil* and compare regions with *während*."
  note:
    type: important
    text: "You need a **map of Germany, Austria and Switzerland** that everyone can see; the packet doesn't include one. Any wall map or projected map works."
  grammar: |
    **Where something is.** *Liegen* (to lie, to be located) plus a location:

    | Location | Example |
    | :--- | :--- |
    | im Norden / Süden / Osten / Westen | Hamburg liegt **im Norden**. |
    | in der Mitte | Frankfurt liegt **in der Mitte** von Deutschland. |
    | an + river or sea | Köln liegt **am** Rhein. Hamburg liegt **an der** Elbe. |
    | in der Nähe von | München liegt **in der Nähe von** den Alpen. |

    The compass words are all masculine, so it's *im* (= *in dem*) every time. Rivers have genders to learn: *der Rhein, der Main*, but *die Elbe, die Donau, die Spree*. That's why it's *am Rhein* but *an der Elbe*.
  achtung: "**What students will do:** say *„in Norden“* (dropping the *m*) or *„Hamburg ist in dem Norden.“* Both are understood; restate with *im*. The Achte-auf-die-Form items have students identify a city from a location description, so they must process *im Norden, an der Elbe, in der Nähe von* as meaning, not just recite the phrases."
  b2: "**If a B2 asks:** *in der Nähe der Alpen* (genitive) is the more formal version of *in der Nähe von den Alpen*. Swiss German (Schweizerdeutsch) is a group of dialects, not a separate language, but Germans often can't follow it. Austrian German has its own standard words (*Jänner* for January, *Paradeiser* for tomato)."
  vocab_extra:
    - ["der Dialekt", "dialect"]
    - ["Hochdeutsch", "standard German"]
    - ["der Hafen", "port, harbor"]
    - ["der Dom", "cathedral"]
    - ["liegen", "to be located"]
    - ["die Mauer", "wall (the Berlin Wall)"]
