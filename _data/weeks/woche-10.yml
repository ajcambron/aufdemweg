reading:
  a1:
    texts:
      - ["Mila", "Ich heiße Mila. Ich habe eine kleine Schwester. Am Abend vom 5. Dezember putzen wir unsere Stiefel und stellen sie vor die Tür. Am Morgen sind Nüsse, Mandarinen und ein Schokoladen-Nikolaus in den Stiefeln. Meine Mama sagt immer: Sei brav, dann kommt der Nikolaus!"]
      - ["Tim", "Ich heiße Tim und ich wohne in Wien. Bei uns kommt am 5. Dezember nicht nur der Nikolaus, sondern auch der Krampus. Der Krampus ist ein Monster mit Hörnern. Er ist laut und wild. Ich finde den Krampus ein bisschen gruselig, aber auch cool!"]
    questions:
      - ["When do Mila and her sister put their boots outside?", "On the evening of December 5"]
      - ["What is in the boots in the morning?", "Nuts, tangerines and a chocolate Nikolaus"]
      - ["Where does Tim live?", "In Vienna"]
      - ["What is the Krampus?", "A monster with horns that comes with Nikolaus"]
  b1:
    texts:
      - ["Frau Becker", "Ich bin Grundschullehrerin in Bonn. Am 6. Dezember kommt bei uns jedes Jahr der Nikolaus in die Klasse. Die Kinder sagen ein Gedicht auf oder singen ein Lied, und der Nikolaus liest aus seinem goldenen Buch vor, was jedes Kind gut gemacht hat. Früher hat er auch geschimpft, aber heute ist der Nikolaus nur noch freundlich. Strafen gibt es nicht mehr."]
      - ["Lukas", "In unserem Dorf in Oberbayern gibt es Anfang Dezember einen Krampuslauf. Junge Männer ziehen Fellkostüme und geschnitzte Holzmasken an und laufen mit großen Glocken durch die Straßen. Für Touristen ist das ein Spektakel, aber für uns ist es eine alte Tradition. Mein großer Bruder läuft dieses Jahr zum ersten Mal mit, und er hat ein Jahr lang an seiner Maske geschnitzt."]
    questions:
      - ["Was machen die Kinder, wenn der Nikolaus in die Klasse kommt?", "Sie sagen ein Gedicht auf oder singen ein Lied."]
      - ["Was steht im goldenen Buch?", "Was jedes Kind gut gemacht hat."]
      - ["Was tragen die Männer beim Krampuslauf?", "Fellkostüme, Holzmasken und große Glocken."]
      - ["Wie lange hat Lukas' Bruder an seiner Maske gearbeitet?", "Ein Jahr lang."]

