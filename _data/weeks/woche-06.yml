    rows:
      - ["Am Montag habe ich ...", "On Monday I have ..."]
      - ["In der ersten / zweiten Stunde habe ich ...", "First / second period I have ..."]
      - ["Die Schule beginnt um ... Uhr.", "School starts at ... o'clock."]
