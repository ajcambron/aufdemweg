reading:
  a1:
    texts:
      - ["Mia", "Ich heiße Mia und ich gehe auf die Newark High School. Die Schule beginnt um halb acht und ist um halb drei aus. Ich habe jeden Tag Mathe, Englisch und Bio. Mein Lieblingsfach ist Kunst. Die Mittagspause ist um elf Uhr. Das ist sehr früh!"]
      - ["Lukas", "Ich heiße Lukas und ich gehe auf ein Gymnasium in Köln. Die Schule beginnt um Viertel vor acht. Am Montag habe ich sechs Stunden: Deutsch, Mathe, Englisch, Bio, Geschichte und Sport. Um Viertel nach eins ist die Schule aus. Dann esse ich zu Hause."]
    questions:
      - ["When does Mia's school start?", "7:30 (halb acht)"]
      - ["What is Mia's favorite subject?", "Art"]
      - ["When is school out for Lukas on Monday?", "1:15 (Viertel nach eins)"]
      - ["Where does Lukas eat lunch?", "At home"]
  b1:
    texts:
      - ["Hannah", "Ich bin in der zehnten Klasse auf einem Gymnasium in Hamburg. Mein Stundenplan ist jeden Tag anders: Am Montag habe ich bis 13:15 Uhr Unterricht, aber am Donnerstag bis 16 Uhr, weil wir nachmittags Chemie und Physik haben. Unsere Noten gehen von 1 bis 6, und eine 1 ist die beste Note. Eine 5 in Mathe ist also wirklich schlecht!"]
      - ["Elias", "Ich gehe auf eine Realschule in der Nähe von Stuttgart. Nach der zehnten Klasse möchte ich eine Ausbildung als Mechatroniker machen. Viele meiner Freunde machen das auch. In der Schule finde ich Technik und Mathe am wichtigsten, weil ich sie später im Beruf brauche. Sport habe ich nur zweimal pro Woche, und eine Schulmannschaft wie in den USA gibt es bei uns nicht."]
    questions:
      - ["Warum hat Hannah am Donnerstag länger Schule?", "Weil sie nachmittags Chemie und Physik hat."]
      - ["Welche Note ist in Deutschland die beste?", "Die 1."]
      - ["Was möchte Elias nach der zehnten Klasse machen?", "Eine Ausbildung als Mechatroniker."]
      - ["Was gibt es an Elias' Schule nicht?", "Eine Schulmannschaft (wie in den USA)."]

