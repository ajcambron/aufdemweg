      - ["Ich finde Bio interessant / langweilig / schwer / leicht.", "I find biology interesting / boring / hard / easy."]
      - ["Mein Lieblingsfach ist ..., weil ... [B1/B2]", "My favorite subject is ..., because ..."]
      - ["die Pause / die Mittagspause / die Hausaufgaben", "break / lunch break / homework"]
  - title: "Fächer und Uhrzeit (Subjects and time)"
    rows:
