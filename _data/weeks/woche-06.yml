task:
  title: "Stundenplan-Vergleich (Compare schedules)"
  format: "Partner interview + comparison"
  directions: "Interview your partner about their real Monday schedule and fill in the grid. Ask: Was hast du in der ersten Stunde? Um wie viel Uhr beginnt die Schule? Wann ist die Schule aus? Then compare your partner's Monday with Lukas's Stundenplan and write three differences."
  a1: "Write the subject and time for each period. Use the questions as given."
  b1: "Also ask Wie findest du das Fach? Warum? Write the three differences as aber-sentences: Lukas hat ..., aber meine Partnerin hat ..."
  tables:
    - title: "Der Stundenplan von Lukas (Gymnasium, Köln)"
      head: ["Stunde", "Uhrzeit", "Mo", "Di", "Mi", "Do", "Fr"]
      rows:
        - ["1", "7:45–8:30", "Deutsch", "Mathe", "Englisch", "Bio", "Deutsch"]
        - ["2", "8:35–9:20", "Mathe", "Mathe", "Deutsch", "Bio", "Geschichte"]
        - ["3", "9:40–10:25", "Englisch", "Kunst", "Erdkunde", "Mathe", "Englisch"]
        - ["4", "10:30–11:15", "Bio", "Kunst", "Erdkunde", "Englisch", "Mathe"]
        - ["5", "11:40–12:25", "Geschichte", "Deutsch", "Sport", "Chemie", "Musik"]
        - ["6", "12:30–13:15", "Sport", "Religion", "Sport", "Chemie", "Musik"]
    - title: "Mein Partner / Meine Partnerin: Montag"
      head: ["Stunde", "Uhrzeit", "Fach", "Wie findet er/sie das Fach?"]
      blank: 7
    - title: "Drei Unterschiede (three differences)"
      head: ["Bei Lukas ...", "Bei meinem Partner / meiner Partnerin ..."]
      blank: 3

output:
  a1: "Write about your own Monday: Am Montag habe ich in der ersten Stunde ___. Die Schule beginnt um ___. Mein Lieblingsfach ist ___. Read it to a partner. For each sentence they say „Ich auch!“ or „Ich nicht!“"
  b1: "Write five sentences comparing your school with Lukas's or Hannah's. Start at least three of them with a time phrase (Am Montag ..., Um halb drei ..., Nach der Schule ...), so the verb comes second. Your partner reads them and circles the difference that surprises them most."

landeskunde:
  title: "Das deutsche Schulsystem"
  text: |
    After four years of Grundschule (ages 6–10), German students split up. The Gymnasium leads to the Abitur, the exam that opens the door to university. The Realschule ends after grade 10 and often leads to an Ausbildung, a paid apprenticeship. A Gesamtschule combines both paths under one roof. In most states, the elementary school recommends which school a child should attend.

    School often ends around 1:00 pm. There are usually no school sports teams; sports happen in local clubs (Vereine). Grades run from 1 (sehr gut) to 6 (ungenügend). And on the very first day of school, first graders carry a Schultüte, a big paper cone full of treats and supplies.
  warum: "Germany sorts students into different schools at about age 10. What does that say about how Germans connect school and careers? (Look at Elias's text.)"
  vergleich: "In the US, almost everyone goes to the same high school. Name one advantage and one disadvantage of each system."

exit:
  a1: "Ich kann meinen Stundenplan beschreiben und die Uhrzeit sagen."
  b1: "Ich kann das deutsche und das amerikanische Schulsystem vergleichen."

energizer:
  title: "Uhrzeit-Staffel (clock relay)"
  text: "Two teams line up facing the board. The instructor calls out a time in German (Es ist Viertel vor drei!). The first student from each team runs up and draws a clock showing that time. First correct clock wins the point; the next pair goes. Use plenty of halb times."

