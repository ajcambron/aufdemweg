  text: "Eine Schülerzeitung in Köln hat 200 Schülerinnen und Schüler gefragt: Wie kommst du zur Schule? Die meisten fahren mit dem Bus oder der Bahn. Viele kommen mit dem Fahrrad, auch im Winter. Nur wenige Eltern bringen ihre Kinder mit dem Auto, denn die Schule liegt mitten in der Stadt und es gibt kaum Parkplätze."
