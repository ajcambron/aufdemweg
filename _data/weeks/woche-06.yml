page:
  modules:
    einstieg: "Clock-face warm-up: either/or time questions"
    input: "Sentence builder + narrow reading (Mia & Lukas, Hannah & Elias) + Achte auf die Form"
    kernaufgabe: "Stundenplan-Vergleich: interview a partner, compare with Lukas"
    landeskunde: "Das deutsche Schulsystem"
    energizer: "Uhrzeit-Staffel (clock relay)"
    extension: "Wie kommst du zur Schule? (reading a chart)"
    buffer: "Second interview round, or Traum-Stundenplan"
  einstieg: "Draw three clocks on the board (8:00, 8:30, 7:45). Say each time in German, then ask either/or questions: *Ist das halb acht oder halb neun?* Students answer with one word. This front-loads the *halb* trap before they meet it in the reading."
  materials:
    - "Student packet, one per student"
    - "Whiteboard for the clock relay"
  summary: "Stundenplan-Vergleich. Students interview a partner about their real Monday schedule and fill in a grid, then compare it with Lukas's German schedule printed in the packet and write three differences. B1/B2 also ask how the partner likes each subject and write the differences as *aber*-sentences."
  note:
    type: note
    text: "Two things surprise US students and are worth a few minutes of discussion: German school often ends around 1:00, and there are no school sports teams. Let the reading texts surface them instead of announcing them up front."
  grammar: |
    **Telling time.** Full and quarter hours work like English: *acht Uhr*, *Viertel nach acht* (8:15), *Viertel vor neun* (8:45). The one that trips everyone up is **halb**: Germans count toward the next hour, so ***halb neun* is 8:30**, not 9:30. Timetables use the 24-hour clock: *13:15 Uhr* is read *dreizehn Uhr fünfzehn*.

    **Verb second after a time phrase.** The conjugated verb is always the second *element* of the sentence, not the second word. When a sentence opens with a time phrase, the subject moves behind the verb:

    | 1st element | Verb | Subject | Rest |
    | :--- | :--- | :--- | :--- |
    | Ich | habe | | am Montag Mathe. |
    | Am Montag | habe | ich | Mathe. |
    | In der ersten Stunde | habe | ich | Deutsch. |
    | Um halb acht | beginnt | die Schule. | |
  achtung: "**What students will do:** read *halb neun* as 9:30, and say *„Am Montag ich habe Mathe.“* The time mistake changes the meaning, which is why all five Achte-auf-die-Form items test *halb* and *Viertel*. The word-order mistake doesn't block meaning, so restate it: *„Ah, am Montag hast du Mathe!“*"
  b2: "**If a B2 asks:** *Stunde* is a class period (45 minutes in Germany) and *Uhr* is clock time, so *Um wie viel Uhr?* asks when and *Wie viele Stunden?* asks how many periods. Subjects take no article after *haben*: *Ich habe Mathe*. The extension's chart is invented example data, not a real survey."
  vocab_extra:
    - ["der Stundenplan", "class schedule"]
    - ["das Fach / das Lieblingsfach", "subject / favorite subject"]
    - ["die Stunde", "class period"]
    - ["die Note", "grade"]
    - ["das Gymnasium / die Realschule", "academic high school / middle-track secondary school"]
    - ["das Abitur", "university-entrance exam"]
    - ["die Ausbildung", "apprenticeship, vocational training"]
    - ["die Schultüte", "first-day-of-school cone of treats"]
