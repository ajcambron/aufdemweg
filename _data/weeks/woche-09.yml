task:
  title: "Drei Feste, ein Vergleich (Three festivals, one comparison)"
  format: "Group jigsaw, groups of three"
  directions: "Each person in your group reads ONE card: Karte 1 (Thanksgiving), Karte 2 (Erntedank) or Karte 3 (Martinstag). Read only your own card! Then explain your festival to your group in German while the others fill in the chart. Finally, decide together what all three festivals have in common and write one sentence."
  a1: "Short answers are fine: Am 11. November. Man isst Truthahn. Kinder singen."
  b1: "Explain your festival in full sentences and add one reason why people celebrate it."
  tables:
    - title: "Die drei Karten"
      head: ["Karte 1: Thanksgiving", "Karte 2: Erntedank", "Karte 3: Martinstag"]
      rows:
        - ["Wann? Am vierten Donnerstag im November. Wo? In den USA. Was macht man? Die Familie kommt zusammen und isst Truthahn, Kartoffelbrei und Kürbiskuchen. Viele sagen, wofür sie dankbar sind. Es gibt Football und Paraden.", "Wann? Meistens am ersten Sonntag im Oktober. Wo? In Deutschland, Österreich und der Schweiz. Was macht man? Man dankt für die Ernte. Die Kirche ist mit Obst, Gemüse und Brot geschmückt. Oft spendet man das Essen danach.", "Wann? Am 11. November. Wo? Vor allem in West- und Süddeutschland, Österreich und der Schweiz. Was macht man? Kinder gehen mit Laternen durch die Straßen und singen. Sankt Martin teilte seinen Mantel mit einem armen Mann. Man isst Martinsgans oder einen Weckmann."]
    - title: "Vergleich (comparison chart)"
      head: ["", "Thanksgiving", "Erntedank", "Martinstag"]
      rows:
        - ["Wann?", "", "", ""]
        - ["Wo?", "", "", ""]
        - ["Essen", "", "", ""]
        - ["Was macht man?", "", "", ""]
    - title: "Gemeinsamkeit (what they share)"
      head: ["Alle drei Feste ..."]
      blank: 1

output:
  a1: "Make a Dankeskarte (thank-you card): Ich bin dankbar für ___, für ___ und für ___. Read it to a partner. They answer with one thing they're thankful for too: Ich bin auch dankbar für ___."
  b1: "Write five sentences comparing two of the three festivals. Use sowohl ... als auch (both ... and), aber, and at least one weil-clause. Your partner reads it and adds one similarity you missed."

landeskunde:
  title: "Sankt Martin"
  text: |
    Martin was a Roman soldier in the 300s. The legend says that on a freezing night he met a beggar at a city gate, cut his own cloak in half with his sword and gave half to the man. Martin later became a bishop and a saint.

    On or around November 11, children in many German, Austrian and Swiss towns walk through the dark streets with paper lanterns, often made in kindergarten, singing Laternenlieder like „Ich geh mit meiner Laterne“. A rider dressed as Martin sometimes leads the procession, and there may be a bonfire (Martinsfeuer). Families eat roast goose (Martinsgans), and in the Rhineland children get a Weckmann. November 11 at 11:11 is also the official start of Karneval season (see Week 16).
  warum: "St. Martin's story is about sharing with a stranger, and the holiday is mostly for children. Why might a community want its children to grow up with this story?"
  vergleich: "Thanksgiving is about gratitude; St. Martin is about sharing. Are those the same value? Which one matters more to you?"

exit:
  a1: "Ich kann sagen, wofür ich dankbar bin."
  b1: "Ich kann Thanksgiving, Erntedank und Martinstag vergleichen."

energizer:
  title: "Laternen-Stille-Post (whisper telephone)"
  text: "Two lines. The instructor whispers a sentence to the first student in each line (Sankt Martin teilt seinen Mantel mit einem armen Mann.). It travels down the line in whispers, and the last student writes it on the board. The version closest to the original wins."

extension:
  title: "Die Legende von Sankt Martin"
  intro: "Lies die Legende. Sie steht im Präteritum, der Erzählzeit. Du musst die Formen verstehen, nicht benutzen."
  text: "Vor langer Zeit lebte ein junger Soldat namens Martin. An einem kalten Winterabend ritt er auf seinem Pferd zum Stadttor von Amiens. Dort saß ein armer Mann im Schnee. Er hatte fast keine Kleidung und fror sehr. Viele Menschen gingen an ihm vorbei, aber niemand half ihm. Martin hatte kein Geld und kein Essen bei sich, nur seinen warmen Mantel. Da nahm er sein Schwert und teilte den Mantel in zwei Hälften. Eine Hälfte gab er dem armen Mann. In der Nacht träumte Martin von Jesus, der den halben Mantel trug. Später wurde Martin Bischof von Tours."
  questions:
    - ["Wo traf Martin den armen Mann?", "Am Stadttor von Amiens."]
    - ["Warum fror der Mann?", "Er hatte fast keine Kleidung und saß im Schnee."]
    - ["Was machte Martin mit seinem Mantel?", "Er teilte ihn mit dem Schwert und gab eine Hälfte dem Mann."]
    - ["Was wurde Martin später?", "Bischof von Tours."]
  task: "Kulturvergleich, 40 Sekunden, mündlich: Welches Fest oder welche Geschichte in deiner Kultur hat eine ähnliche Botschaft wie Sankt Martin? Vergleiche."

