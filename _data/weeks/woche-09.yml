reading:
  a1:
    texts:
      - ["Emma", "Ich heiße Emma und ich wohne in Delaware. An Thanksgiving kommt meine ganze Familie zusammen. Wir essen Truthahn, Kartoffelbrei und Kürbiskuchen. Vor dem Essen sagt jeder: Ich bin dankbar für ... Ich bin dankbar für meine Familie und für meinen Hund Max."]
      - ["Felix", "Ich heiße Felix und ich wohne in Köln. Am 11. November ist Martinstag. Am Abend gehen die Kinder mit Laternen durch die Straßen und singen Lieder. Ein Mann reitet als Sankt Martin auf einem Pferd. Danach gibt es einen Weckmann. Das ist ein süßes Brot."]
    questions:
      - ["Who comes together at Emma's Thanksgiving?", "Her whole family"]
      - ["What is Emma thankful for?", "Her family and her dog Max"]
      - ["When is St. Martin's Day?", "November 11"]
      - ["What is a Weckmann?", "A sweet bread (shaped like a little man)"]
  b1:
    texts:
      - ["Leonie", "Bei uns im Dorf feiern wir Anfang Oktober Erntedank. Die Kirche ist dann mit Obst, Gemüse, Getreide und Brot geschmückt. Nach dem Gottesdienst bringen wir die Lebensmittel zur Tafel, einer Organisation, die Essen an arme Menschen verteilt. Ich finde das schön, weil man nicht nur dankbar ist, sondern auch etwas teilt."]
      - ["Jakob", "Ich war letztes Jahr als Austauschschüler in Ohio und habe dort zum ersten Mal Thanksgiving gefeiert. Es war wie Weihnachten ohne Geschenke: Alle Verwandten kamen, und es gab viel zu viel Essen! Am Nachmittag haben alle Football geschaut. Was mir gefallen hat: Vor dem Essen hat jeder gesagt, wofür er dankbar ist. Das machen wir in Deutschland an Erntedank nicht."]
    questions:
      - ["Womit ist die Kirche an Erntedank geschmückt?", "Mit Obst, Gemüse, Getreide und Brot."]
      - ["Was passiert danach mit den Lebensmitteln?", "Sie gehen zur Tafel, die Essen an arme Menschen verteilt."]
      - ["Womit vergleicht Jakob Thanksgiving?", "Mit Weihnachten ohne Geschenke."]
      - ["Was hat Jakob an Thanksgiving gefallen?", "Dass jeder vor dem Essen sagt, wofür er dankbar ist."]

