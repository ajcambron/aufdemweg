    landeskunde: "Sankt Martin"
    energizer: "Laternen-Stille-Post (whisper telephone)"
    extension: "Die Legende von Sankt Martin + 40-second cultural comparison"
    buffer: "Paper lanterns, or a gratitude chain"
  einstieg: "Show three pictures side by side: a Thanksgiving table, a church decorated for Erntedank, and a children's lantern procession. Ask *Was siehst du?* and *Wo ist das, in den USA oder in Deutschland?* The first two are familiar from Week 5 and real life; the lanterns are new."
  materials:
    - "Student packet, one per student"
    - "Three pictures for the Einstieg"
    - "Optional: paper, glue and markers for lanterns"
  summary: "Drei Feste, ein Vergleich. In groups of three, each student reads one card (Thanksgiving, Erntedank or Martinstag) and explains it to the others, who fill in a comparison chart. Then the group writes one sentence about what all three festivals share. A1/A2 give short answers; B1/B2 explain in full sentences and give a reason people celebrate."
  note:
    type: note
    text: "Week 5 introduced Erntedank, so this week builds on it rather than re-teaching it. November 29 is a no-school week, which is why the Thanksgiving comparison happens now."
  grammar: |
    **für + accusative.** After *für* (for), der-words change just as they do after *haben*:

    | | der-words | das-words | die-words, plural |
    | :--- | :--- | :--- | :--- |
    | Das ist ... | mein Hund | mein Zuhause | meine Familie |
    | Ich bin dankbar für ... | **meinen** Hund | mein Zuhause | meine Familie |

    **für vs. von.** *für* = for (the receiver); *von* = from (the giver). *Das Geschenk ist **für** meinen Opa* (Opa gets it). *Das Geschenk ist **von** meinem Opa* (Opa gave it). *Von* takes the dative (*meinem, meiner*); treat it as a chunk.
  achtung: "**What students will do:** mix up *für* and *von*, which flips who gave what. That's a meaning error, so the Achte-auf-die-Form items test exactly this. The *-en* ending on *meinen* is a form error that doesn't change meaning: restate it and move on. Also watch for overuse right after learning it: *„für meinen Familie“*. *Familie* is a die-word."
  b2: "**If a B2 asks:** *dankbar, dass ...* sends the verb to the end, like *weil* (*Ich bin dankbar, dass meine Oma gesund ist*). The extension's legend is in the Präteritum, the storytelling past; students only need to understand it. *Wofür?* = for what?"
  vocab_extra:
    - ["dankbar", "thankful"]
    - ["das Geschenk", "gift"]
    - ["der Mantel", "coat, cloak"]
    - ["der Umzug", "procession, parade"]
    - ["die Tafel", "food bank"]
    - ["der Gottesdienst", "church service"]
