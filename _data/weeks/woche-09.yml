theme: "Dankbarkeit & Traditionen"
cando:
  a1: "say what I'm thankful for and name harvest and St. Martin traditions"
  b1b2: "compare Thanksgiving, Erntedank and St. Martin's Day and explain what they share"
grammar_focus: "dankbar für + accusative (für meinen Hund, für meine Familie, für mein Zuhause). für = for (the receiver), von = from (the giver)."
ap:
  unit: "AP theme: Families and Communities (traditions)"
  mode: "Interpretive reading + interpersonal jigsaw + spoken cultural comparison"
  note: "The extension ends with a 40-second spoken cultural comparison, the same move the AP Project Q&A rewards."

builder:
  - title: "Ich bin dankbar für ... (I'm thankful for ...)"
    rows:
      - ["Ich bin dankbar für meine Familie / meine Freunde.", "I'm thankful for my family / my friends."]
      - ["Ich bin dankbar für meinen Hund / meinen Bruder.", "I'm thankful for my dog / my brother."]
      - ["Ich bin dankbar für mein Zuhause / mein Essen.", "I'm thankful for my home / my food."]
      - ["Danke für ...! / Vielen Dank für ...!", "Thanks for ...! / Thank you very much for ...!"]
      - ["Das Geschenk ist für dich. / Das Geschenk ist von mir.", "The gift is for you. / The gift is from me."]
      - ["Ich bin dankbar, dass ... [B1/B2: verb to the end]", "I'm thankful that ..."]
  - title: "Traditionen im Herbst (Fall traditions)"
    rows:
      - ["das Erntedankfest / der Erntedankaltar", "harvest festival / decorated church altar"]
      - ["Thanksgiving: Die Familie kommt zusammen.", "Thanksgiving: The family gets together."]
      - ["der Martinstag (am 11. November)", "St. Martin's Day (November 11)"]
      - ["die Laterne / der Laternenumzug", "lantern / lantern procession"]
      - ["die Martinsgans / der Weckmann", "St. Martin's goose / sweet bread man"]
      - ["teilen: Sankt Martin teilt seinen Mantel.", "to share: St. Martin shares his cloak."]

