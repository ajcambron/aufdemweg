reading:
  a1:
    texts:
      - ["Clara", "Ich heiße Clara und ich wohne in Nürnberg. Im Dezember gehe ich oft auf den Christkindlesmarkt. Dort gibt es Lebkuchen, Bratwürste und Kinderpunsch. Zu Weihnachten möchte ich ein neues Fahrrad. Ich will auch mit meiner Oma Plätzchen backen."]
      - ["Noah", "Ich heiße Noah. Ich wohne in Delaware, aber meine Mutter kommt aus Österreich. Wir feiern am 24. Dezember, wie in Österreich. Am Abend gibt es Geschenke vom Christkind. Ich wünsche mir dieses Jahr einen Hund, aber meine Eltern wollen keinen Hund!"]
    questions:
      - ["What would Clara like for Christmas?", "A new bike"]
      - ["What does Clara want to do with her grandma?", "Bake cookies"]
      - ["When does Noah's family celebrate?", "On the evening of December 24"]
      - ["Why might Noah not get his wish?", "His parents don't want a dog."]
  b1:
    texts:
      - ["Hanna", "Bei uns beginnt Weihnachten eigentlich schon am ersten Advent. Dann zünden wir die erste Kerze am Adventskranz an, und jeden Sonntag kommt eine Kerze dazu. Den Weihnachtsbaum schmücken wir erst am 24. Dezember am Vormittag. Am Abend gehen wir in die Kirche, danach essen wir Kartoffelsalat mit Würstchen. Das ist ganz einfach, aber es ist Tradition. Die Geschenke gibt es erst nach dem Essen."]
      - ["Paul", "In unserer Theater-AG spielen wir jedes Jahr vor Weihnachten ein kurzes Stück. Dieses Jahr wollen wir eine lustige Szene auf dem Weihnachtsmarkt spielen: Eine Familie will einen Baum kaufen, aber alle wollen einen anderen. Ich spiele den Verkäufer. Wir proben zweimal pro Woche, und ich muss meinen Text noch auswendig lernen."]
    questions:
      - ["Wann zündet Hannas Familie die erste Kerze an?", "Am ersten Advent."]
      - ["Was isst Hannas Familie an Heiligabend?", "Kartoffelsalat mit Würstchen."]
      - ["Worum geht es in Pauls Theaterstück?", "Eine Familie will einen Baum kaufen, aber alle wollen einen anderen."]
      - ["Was muss Paul noch machen?", "Seinen Text auswendig lernen."]

structured_input:
  ref:
    directions: "Was bedeutet der Satz? (What does it mean?)"
    items:
      - ["Ich will einen Hund.", "I want a dog.", ["I want a dog.", "I will get a dog."]]
      - ["Lena will morgen Ski fahren.", "Lena wants to ski tomorrow.", ["Lena wants to ski tomorrow.", "Lena will ski tomorrow."]]
      - ["Wir möchten Plätzchen backen.", "We'd like to bake cookies.", ["We'd like to bake cookies.", "We are baking cookies."]]
      - ["Willst du mitkommen?", "Do you want to come along?", ["Will you come along?", "Do you want to come along?"]]
      - ["Mein Bruder will kein Geschenk.", "My brother doesn't want a gift.", ["My brother won't give a gift.", "My brother doesn't want a gift."]]
  aff:
    directions: "Was möchtest du in den Ferien?"
    options: ["Ja!", "Nein!"]
    items:
      - "Ich möchte Schnee an Weihnachten."
      - "Ich will viele Geschenke."
      - "Ich möchte Plätzchen backen."
      - "Ich will jeden Tag lange schlafen."
      - "Ich möchte auf einen Weihnachtsmarkt gehen."

task:
  title: "Unser Weihnachts-Sketch (our Christmas skit)"
  format: "Group project: write and rehearse"
  directions: "In groups of four, write and rehearse a two-minute skit to perform at the Weihnachtsfeier next week: Eine Familie auf dem Weihnachtsmarkt. Everyone in the family wants something different (a different tree, a different snack, a different gift), and in the end they have to agree. Start from the skeleton below. Every person needs at least two lines, and every person says möchte or will at least once."
  a1: "Use the skeleton and add lines with Ich will ... / Ich möchte ... / Nein, ich will ... Short lines are fine."
  b1: "Add a twist (the money runs out, the tree falls over, Oma shows up) and resolve it. Use at least one weil-clause and one wenn-clause."
  tables:
    - title: "Rollen (roles)"
      head: ["Rolle", "Wer spielt?", "Was will diese Person?"]
      rows:
        - ["Mutter / Vater", "", ""]
        - ["Kind 1", "", ""]
        - ["Kind 2", "", ""]
        - ["Verkäufer / Verkäuferin", "", ""]
    - title: "Gerüst (skeleton): fill in lines 5–10"
      head: ["#", "Wer?", "Was sagt er / sie?"]
      rows:
        - ["1", "Verkäufer/in", "Guten Tag! Was möchten Sie?"]
        - ["2", "Mutter / Vater", "Wir möchten einen Weihnachtsbaum."]
        - ["3", "Kind 1", "Ich will einen großen Baum!"]
        - ["4", "Kind 2", "Nein! Ich will einen kleinen Baum!"]
        - ["5", "", ""]
        - ["6", "", ""]
        - ["7", "", ""]
        - ["8", "", ""]
        - ["9", "", ""]
        - ["10", "", ""]
        - ["Ende", "Alle", "Frohe Weihnachten!"]

output:
  a1: "Write your Wunschzettel: three things you'd like (Ich möchte ___. Ich wünsche mir ___.) and one thing you want to do over break (Ich will ___.). Read it to a partner. They guess which wish matters most to you."
  b1: "Write a Wunschzettel with a twist: three wishes that aren't things (Ich wünsche mir, dass ...: verb to the end), each with a weil-reason. Swap with a partner. They choose the wish they'd grant first and say why."

landeskunde:
  title: "Advent und Weihnachtsmarkt"
  text: |
    German Christmas starts four Sundays early. Families light one more candle on the Adventskranz each Sunday of Advent, and children open one door of the Adventskalender every day from December 1. From late November, almost every town square has a Weihnachtsmarkt: wooden booths, Lebkuchen, roasted almonds, Glühwein for adults and Kinderpunsch for kids. Famous markets include Nuremberg's Christkindlesmarkt and Dresden's Striezelmarkt, one of the oldest.

    The main celebration is Heiligabend, the evening of December 24. The tree is often decorated that day, many families go to church, and presents are opened that evening, not on the morning of the 25th. December 25 and 26 are both holidays (erster and zweiter Weihnachtsfeiertag), usually spent visiting relatives.
  warum: "Advent stretches Christmas over four weeks of waiting and small rituals. What does that say about how the season is meant to feel?"
  vergleich: "In the US, presents are usually opened on the morning of the 25th. Which do you prefer, Christmas Eve or Christmas morning? Why?"

