builder:
  - title: "Wünsche (Wishes)"
    rows:
      - ["Ich möchte ein neues Handy.", "I'd like a new phone."]
      - ["Ich wünsche mir einen Hund / eine Gitarre / ein Fahrrad.", "I'm wishing for a dog / a guitar / a bike."]
      - ["Ich will Plätzchen backen.", "I want to bake cookies."]
      - ["Willst du auf den Weihnachtsmarkt gehen?", "Do you want to go to the Christmas market?"]
      - ["Was möchtest du zu Weihnachten?", "What would you like for Christmas?"]
      - ["Wir wollen zusammen feiern.", "We want to celebrate together."]
      - ["der Wunschzettel", "wish list"]
  - title: "Weihnachten (Christmas)"
    rows:
      - ["der Adventskranz / der Adventskalender", "Advent wreath / Advent calendar"]
      - ["der Weihnachtsbaum / der Tannenbaum", "Christmas tree / fir tree"]
      - ["der Weihnachtsmarkt / die Plätzchen / der Lebkuchen", "Christmas market / cookies / gingerbread"]
      - ["Heiligabend (am 24. Dezember)", "Christmas Eve (December 24)"]
      - ["die Kerze / der Stern / das Geschenk", "candle / star / gift"]
      - ["Frohe Weihnachten! / Frohes Fest!", "Merry Christmas! / Happy holidays!"]

