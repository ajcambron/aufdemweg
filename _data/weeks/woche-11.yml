energizer:
  title: "Weihnachts-Bingo"
  text: "Students draw a 3×3 grid and fill it with Christmas words from the Sentence Builder. The instructor describes words in simple German (Das ist rund und hat vier Kerzen. → der Adventskranz). Three in a row: Bingo!"

extension:
  title: "Weihnachten ohne Stress?"
  intro: "Lies den Text und beantworte die Fragen."
  text: "Für viele Familien in Deutschland ist die Adventszeit nicht nur schön, sondern auch stressig. Die Geschenke kosten viel Geld, alle Verwandten wollen besucht werden, und in den Geschäften ist es voll. Deshalb machen manche Familien neue Regeln: Sie ziehen Namen, und jede Person kauft nur ein Geschenk für eine andere Person. Das nennt man Wichteln. Andere schenken Zeit statt Dinge, zum Beispiel einen gemeinsamen Ausflug. Wieder andere sagen, genau der Trubel gehört zu Weihnachten dazu."
  questions:
    - ["Warum ist die Adventszeit für viele stressig?", "Geschenke kosten viel Geld, man muss alle Verwandten besuchen, und die Geschäfte sind voll."]
    - ["Was ist Wichteln?", "Man zieht Namen, und jede Person kauft nur ein Geschenk für eine andere Person."]
    - ["Was bedeutet „Zeit statt Dinge schenken“?", "Man schenkt gemeinsame Erlebnisse, zum Beispiel einen Ausflug."]
    - ["Was sagen andere Leute?", "Der Trubel gehört zu Weihnachten dazu."]
  task: "Schreib 4–5 Sätze: Sollte deine Familie Wichteln machen? Begründe deine Meinung mit weil und deshalb."

buffer: "More skit rehearsal (top priority this week), or make Christmas cards for the party: Frohe Weihnachten, liebe / lieber ...!"

page:
  modules:
    einstieg: "Board Advent calendar: open a door, find a word"
    input: "Sentence builder + narrow reading (Clara & Noah, Hanna & Paul) + Achte auf die Form"
    kernaufgabe: "Unser Weihnachts-Sketch: write and rehearse for the party"
    landeskunde: "Advent und Weihnachtsmarkt"
    energizer: "Weihnachts-Bingo"
    extension: "Weihnachten ohne Stress? (opinion writing)"
    buffer: "More skit rehearsal, or Christmas cards"
  einstieg: "Draw a six-door Advent calendar on the board, each door hiding a picture word (*Kerze, Stern, Lebkuchen, Baum, Geschenk, Schnee*). Students call out a number; draw the picture behind that door and say the word twice. Then ask *Möchtest du das?* and let students answer *Ja, ich möchte ...* without pressure."
  materials:
    - "Student packet, one per student"
    - "Optional: simple props for the skits (scarves, a paper tree, a cash box)"
  summary: "Unser Weihnachts-Sketch. Groups of four write and rehearse a two-minute skit, *Eine Familie auf dem Weihnachtsmarkt*, in which everyone wants a different tree, snack or gift and the family has to agree. They perform it at the Weihnachtsfeier next week. Every student gets at least two lines with *möchte* or *will*. B1/B2 add a twist and resolve it with *weil* and *wenn*."
  note:
    type: important
    text: "The skits are performed at the **Weihnachtsfeier on December 20**, so rehearsal time beats every optional module this week. If time runs short, cut the energizer, extension and Landeskunde and give the groups that time. Each group should leave with a finished script and assigned roles."
  grammar: |
    **möchten and wollen + infinitive.** Both are modal verbs: they take a second verb, and that verb goes to the very end.

    | | möchten (would like) | wollen (want) |
    | :--- | :--- | :--- |
    | ich | möchte | **will** |
    | du | möchtest | **willst** |
    | er / sie | möchte | **will** |
    | wir / sie / Sie | möchten | wollen |

    > Ich **möchte** einen Baum **kaufen**. Wir **wollen** Plätzchen **backen**.

    *ich* and *er/sie* share a form with no *-t* (*er will*, not *er willt*). *Möchte* is the polite choice; *will* is blunter, which suits a skit where everyone argues.
  achtung: "**What students will do:** read ***Ich will*** as \"I will.\" It means \"I want.\" That changes the meaning, so the Achte-auf-die-Form items test it directly. The word-order slip (*„Ich will backen Plätzchen“*) doesn't block meaning; restate it. In the skits, fix only what an audience wouldn't understand."
  b2: "**If a B2 asks:** \"I will\" in the future sense is *ich werde* (Week 12). *Ich wünsche mir* (I wish for) is reflexive, and *Ich wünsche mir, dass ...* sends the verb to the end. Glühwein is mulled wine for adults; Kinderpunsch is the alcohol-free version children drink."
  vocab_extra:
    - ["der Wunschzettel", "wish list"]
    - ["der Sketch / die Szene", "skit / scene"]
    - ["proben", "to rehearse"]
    - ["auswendig lernen", "to memorize"]
    - ["der Verkäufer / die Verkäuferin", "salesperson (m / f)"]
    - ["Wichteln", "Secret Santa"]
