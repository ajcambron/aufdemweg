task:
  title: "Interview & Ausweis (build an ID card)"
  format: "Partner information gap"
  directions: "Work with a partner. Interview them with the question bank and fill in their blank ID card (Name, Alter, Geburtstag, Nationalität, Wohnort, Telefonnummer, E-Mail). Invent a phone number and email address; don't use your real ones."
  a1: "Use the question bank as it is printed."
  b1: "Add one question of your own. After the interview, write a five-sentence Steckbrief about your partner in the third person."
  tables:
    - title: "Ausweis: mein Partner / meine Partnerin"
      head: ["Frage", "Antwort"]
      rows:
        - ["Wie heißt du?", ""]
        - ["Wie alt bist du?", ""]
        - ["Wann hast du Geburtstag?", ""]
        - ["Woher kommst du?", ""]
        - ["Wo wohnst du?", ""]
        - ["Wie ist deine Telefonnummer?", ""]
        - ["Wie ist deine E-Mail-Adresse?", ""]
        - ["[eigene Frage / your own question: B1/B2]", ""]

output:
  a1: "Fill in your own ID card with the frame and read it aloud: Ich heiße ___. Ich bin ___ Jahre alt. Mein Geburtstag ist am ___. Ich komme aus ___. Your partner checks it against the card they filled in during the interview and says Stimmt! or Nein, ..."
  b1: "Write a five-sentence Steckbrief about your partner: Er / Sie heißt ___. Er / Sie kommt aus ___. Sein / Ihr Geburtstag ist am ___. ... Read it to the class; the class checks it against your partner's real answers."

landeskunde:
  title: "TT.MM.JJJJ: wie Deutsche Daten schreiben"
  text: |
    In German-speaking countries, dates are written day.month.year, so 4.10.2026 means October 4th, not April 10th! Watch for this on German documents, tickets and forms. Times use the 24-hour clock (15:30 Uhr), and decimals use a comma: 2,5 not 2.5.

    Every German must have a Personalausweis (national ID card) from age 16, so a teenager's first ID card is a small milestone, a bit like a first driver's license here. The card shows your name, date and place of birth, height and eye color, and it's used for everything from opening a bank account to traveling within Europe.
  warum: "Germany requires everyone over 16 to have a national ID card; the US has no national ID at all. What might each choice say about how citizens and the state relate to each other?"
  vergleich: "In the US, what does the job of a Personalausweis: a driver's license, a passport, a school ID? What's easier or harder about each system?"

exit:
  a1: "Ich kann Namen, Alter, Geburtstag und Herkunft nennen."
  b1: "Ich kann einen Steckbrief über eine andere Person schreiben."

energizer:
  title: "Geburtstagslinie (the silent birthday line-up)"
  text: "Without speaking any English, line up in order of birthday, January 1st to December 31st, using only German numbers, months and gestures. When you think you're in order, go down the line saying your birthdays in German to check: Ich habe am dritten März Geburtstag."

