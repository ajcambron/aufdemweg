  table:
    head: ["Name", "Land", "Sprache(n)"]
    rows:
      - ["Kofi", "", ""]
      - ["Yuki", "", ""]
      - ["Elif", "", ""]
      - ["Lena", "", ""]
  questions:
    - ["Ergänze die Tabelle.", "Kofi: Ghana, Englisch und Twi · Yuki: Japan, Japanisch · Elif: Türkei, Türkisch und Deutsch · Lena: Deutschland, Deutsch und Englisch"]
    - ["Wer spricht nur eine Sprache?", "Yuki."]
