builder:
  - title: "Geburtstag, Alter, Herkunft (Birthday, age, origin)"
    rows:
      - ["Mein Geburtstag ist am ersten / zweiten / dritten ... [Monat].", "My birthday is on the 1st / 2nd / 3rd of [month]."]
      - ["Wann hast du Geburtstag?", "When is your birthday?"]
      - ["Ich bin ... Jahre alt.", "I am ... years old."]
      - ["Ich komme aus [Land]. Ich bin [Nationalität].", "I come from [country]. I am [nationality]."]
      - ["aus den USA: Amerikaner / Amerikanerin", "from the USA: American (m / f)"]
      - ["aus Deutschland: Deutscher / Deutsche", "from Germany: German (m / f)"]
      - ["aus Irland: Ire / Irin · aus Italien: Italiener / Italienerin", "from Ireland: Irish (m / f) · from Italy: Italian (m / f)"]
      - ["Meine Telefonnummer ist ... / Meine E-Mail-Adresse ist ...", "My phone number is ... / My email address is ..."]
  - title: "Zahlen, Monate, Ordnungszahlen (Numbers, months, ordinals)"
    rows:
      - ["0 null · 1 eins · 2 zwei · 3 drei · 4 vier · 5 fünf · 6 sechs · 7 sieben · 8 acht · 9 neun · 10 zehn · 11 elf · 12 zwölf", "0–12"]
      - ["13 dreizehn · 20 zwanzig · 21 einundzwanzig · 30 dreißig · 31 einunddreißig", "13, 20, 21 (one-and-twenty), 30, 31"]
      - ["Januar, Februar, März, April, Mai, Juni", "January to June"]
      - ["Juli, August, September, Oktober, November, Dezember", "July to December"]
      - ["der erste, zweite, dritte, vierte, siebte, achte, zwanzigste", "the 1st, 2nd, 3rd, 4th, 7th, 8th, 20th"]
      - ["am ersten, am dritten, am zwanzigsten Mai", "on the 1st, 3rd, 20th of May"]

