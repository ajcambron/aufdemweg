buffer: "Zahlen-Bingo (0–100, with plenty of numbers like 21, 34, 57 that test ones-before-tens), or a second round of ID-card interviews with a new partner."

page:
  modules:
    einstieg: "Birthday calendar: Wann hast du Geburtstag?"
    input: "Sentence builder + narrow reading (Mia & Leo, Clara & David) + Achte auf die Form"
    kernaufgabe: "Interview & Ausweis: build a partner's ID card"
    landeskunde: "TT.MM.JJJJ: how Germans write dates"
    energizer: "Geburtstagslinie: the silent birthday line-up"
    extension: "Woher kommt ihr? (chart + mini survey)"
    buffer: "Zahlen-Bingo, or another ID-card round"
  einstieg: "Write the twelve months on the board. Say your own birthday slowly (*Ich habe am dritten März Geburtstag*) and mark it. Then ask either/or questions by month: *Hast du im Januar oder im Juli Geburtstag?* Students raise hands; tally each month in German. That tally sets up the birthday line-up later."
  materials:
    - "Student packet, one per student"
  summary: "Interview & Ausweis. Partners interview each other from a question bank and fill in a blank ID card for the other person: name, age, birthday, nationality, town, phone, email. B1/B2 add one question of their own and then write a five-sentence Steckbrief about their partner (*Sie heißt ... Sie ist ...*)."
  note:
    type: note
    text: "Tell students to **invent** a phone number and email address. The task works the same, and nobody hands their real contact details to a classmate."
  grammar: |
    **Ordinal numbers for dates.** Germans say "on the fourth of May," like English, but the ending changes:

    | Day | Rule | Examples |
    | :--- | :--- | :--- |
    | 1–19 | number + **-te** | vierte, fünfte, zehnte, neunzehnte |
    | 20 and up | number + **-ste** | zwanzigste, einundzwanzigste, dreißigste |
    | Irregular | memorize | **erste** (1.), **dritte** (3.), **siebte** (7.), **achte** (8.) |

    After *am* ("on the"), add **-n**: *Mein Geburtstag ist **am ersten** Mai. Ich habe **am dreiundzwanzigsten** Juni Geburtstag.* Written, it's a number with a period: *am 23. Juni.*

    **Nationalities** take no article and change for male/female: *Ich bin Amerikaner / Amerikanerin.* *Deutsch* is the odd one: *Er ist Deutscher, sie ist Deutsche.*
  achtung: "**What students will do:** two things. They'll say tens before ones, the English way, but German says the ones first: 21 is *einundzwanzig*, \"one-and-twenty.\" Expect this all year; three of the Achte-auf-die-Form items test it (*einundzwanzigsten*, *dreiundsiebzig*, *4.10.*), because here a slip changes the date. They'll also say *„Ich habe fünfzehn Jahre“* (Spanish and French speakers especially). Age uses *sein*: *Ich **bin** fünfzehn.*"
  b2: "**If a B2 asks:** *Ich werde siebzehn* means \"I'm turning seventeen\" (*werden* = to become; Week 12). The 4.10. format also explains German receipts and train tickets they'll see later in the year."
  vocab_extra:
    - ["der Ausweis / der Personalausweis", "ID card / national ID card"]
    - ["der Steckbrief", "profile, fact sheet"]
    - ["die Nationalität", "nationality"]
    - ["der Wohnort", "place of residence"]
