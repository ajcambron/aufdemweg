builder:
  - title: "Rückblick (Looking back)"
    rows:
      - ["Dieses Jahr habe ich viel gelernt.", "This year I learned a lot."]
      - ["Am besten hat mir ... gefallen.", "I liked ... best."]
      - ["Am schwierigsten war ...", "The hardest thing was ..."]
      - ["Jetzt kann ich ...", "Now I can ..."]
      - ["Ich bin stolz auf ...", "I'm proud of ..."]
      - ["Nächstes Jahr möchte ich ...", "Next year I'd like to ..."]
  - title: "Für die Abschlussfeier (For the closing ceremony)"
    rows:
      - ["Wir spielen einen Sketch. / Wir singen ein Lied.", "We're performing a skit. / We're singing a song."]
      - ["Wer spielt wen? Wer singt was?", "Who plays whom? Who sings what?"]
      - ["Sprich lauter! / Langsamer, bitte!", "Speak louder! / Slower, please!"]
      - ["Noch einmal von vorn!", "Once more from the top!"]
      - ["Herzlich willkommen, liebe Eltern und Gäste!", "A warm welcome, dear parents and guests!"]
      - ["Vielen Dank fürs Zuhören!", "Thank you for listening!"]

