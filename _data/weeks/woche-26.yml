reading:
  a1:
    texts:
      - ["Ella", "Ich heiße Ella. Im September konnte ich nur „Hallo“ und „Danke“ sagen. Jetzt kann ich mich vorstellen, über meine Familie sprechen und im Café bestellen! Am besten hat mir der Nikolaustag gefallen. Am schwierigsten waren die Artikel: der, die, das! Nächstes Jahr möchte ich wieder kommen."]
      - ["Sam", "Ich heiße Sam. Dieses Jahr habe ich viele neue Freunde gefunden. An Weihnachten haben wir einen Sketch gespielt. Das war lustig, aber ich war sehr nervös! Jetzt spreche ich mehr Deutsch mit meiner Oma. Sie ist sehr stolz auf mich."]
    questions:
      - ["What could Ella say in September?", "Only „Hallo“ and „Danke“"]
      - ["Name two things Ella can do now.", "Introduce herself, talk about her family, order in a café (any two)"]
      - ["What did Sam do at Christmas?", "Performed a skit"]
      - ["Who does Sam speak more German with now?", "Grandma (Oma)"]
  b1:
    texts:
      - ["Noor", "Am Anfang des Jahres habe ich gedacht, dass mein Deutsch schon ziemlich gut ist, weil wir zu Hause manchmal Deutsch sprechen. Aber ich habe gemerkt, dass ich zwar viel verstehe, aber beim Schreiben unsicher bin. Die Debatte über Handys in der Schule war für mich der Höhepunkt: Zum ersten Mal habe ich auf Deutsch richtig argumentiert. Nächstes Jahr möchte ich die AP-Prüfung machen."]
      - ["Frau Schneider", "Meine Tochter geht seit zwei Jahren in die Deutschschule. Am Anfang wollte sie am Sonntag lieber ausschlafen. Inzwischen freut sie sich auf den Unterricht, weil sie dort Freunde hat und weil der Unterricht nicht nur Grammatik ist. Für unsere Familie ist das wichtig: Ihre Großeltern in Österreich können jetzt richtig mit ihr sprechen."]
    questions:
      - ["Was hat Noor über ihr Deutsch gemerkt?", "Sie versteht viel, ist aber beim Schreiben unsicher."]
      - ["Was war Noors Höhepunkt?", "Die Debatte über Handys in der Schule."]
      - ["Warum freut sich Frau Schneiders Tochter jetzt auf den Unterricht?", "Sie hat dort Freunde, und der Unterricht ist nicht nur Grammatik."]
      - ["Warum ist das für die Familie wichtig?", "Die Großeltern in Österreich können jetzt richtig mit ihr sprechen."]

