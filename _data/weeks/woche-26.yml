task:
  title: "Unser Auftritt (our performance for the Abschlussfeier)"
  format: "Groups: plan, write, rehearse"
  directions: "Next week is the Abschlussfeier. In groups of four or five, prepare a two- to three-minute performance in German: a skit, a song, a poem or a short Was-wir-gelernt-haben show. Plan it with the chart, write your script or lyrics, rehearse it twice, and get feedback from another group with the checklist. Everyone speaks or sings at least two lines in German."
  a1: "Short, clear lines are best. Recycle phrases from any week of the year."
  b1: "Build in at least three of the year's grammar patterns (a Perfekt sentence, a weil-clause, a Konjunktiv II wish ...) and write the welcome or thank-you lines for the audience."
  tables:
    - title: "Planung (planning)"
      head: ["Frage", "Antwort"]
      rows:
        - ["Was machen wir? (Sketch, Lied, Gedicht, Show)", ""]
        - ["Titel", ""]
        - ["Wer macht was?", ""]
        - ["Was brauchen wir? (Requisiten, Musik)", ""]
        - ["Wie lang? (2–3 Minuten)", ""]
    - title: "Feedback-Checkliste (for the other group)"
      head: ["Kriterium", "Ja", "Fast", "Noch nicht"]
      rows:
        - ["Alle sprechen laut und deutlich.", "", "", ""]
        - ["Niemand liest nur vom Blatt.", "", "", ""]
        - ["Das Publikum versteht die Geschichte.", "", "", ""]
        - ["Alle sagen mindestens zwei Sätze auf Deutsch.", "", "", ""]
