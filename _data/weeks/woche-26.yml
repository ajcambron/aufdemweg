output:
  a1: "Write five sentences: Dieses Jahr habe ich ___ gelernt. Am besten hat mir ___ gefallen. Am schwierigsten war ___. Jetzt kann ich ___. Nächstes Jahr möchte ich ___. Read them to a partner. They answer with one sentence of their own."
  b1: "Write a letter (6–8 sentences, du-form) to a student who will join the class next year: what to expect, what was hardest, your best tip for learning German, and one piece of advice (Ich würde dir raten, ...). Your partner reads it and adds one more tip."

landeskunde:
  title: "Abitur, Abiball, Abistreich"
  text: |
    German high school ends differently from American high school. Gymnasium students finish with the Abitur, a series of final exams in four or five subjects spread over several weeks. The overall grade, from 1.0 (best) to 4.0, can decide whether you get into a competitive university program such as medicine. There are no caps and gowns. Instead, students celebrate at the Abiball, a formal dinner and dance with parents and teachers, often in a rented hall.

    In the last days of school, seniors play an Abistreich, a prank on the school: filling the halls with balloons, turning the schoolyard into a beach, or briefly locking the teachers out. Many schools also have a Mottowoche, a week when seniors dress up according to a different theme each day.
  warum: "Germany marks the end of school with a demanding exam, a prank and a formal ball, but no caps and gowns. What does that mix say about how Germans see school and growing up?"
  vergleich: "Compare the Abiball and Abistreich with US graduation, prom and senior pranks. Which German tradition would you most like to borrow?"

exit:
  a1: "Ich kann sagen, was ich dieses Jahr gelernt habe."
  b1: "Ich kann über meinen Lernfortschritt reflektieren und einen Auftritt präsentieren."

energizer:
  title: "Großes Jahres-Quiz (year-in-review game)"
  text: "Jeopardy-style on the board: categories are themes from the year (Essen, Feste, Stadt, Reisen, Musik), 100 to 500 points each. Teams pick a category and a value; the instructor reads a question in German (Wann ist Nikolaustag? Wie heißt die Hauptstadt von Österreich? Was ist Pfand?). Correct answers in German score the points."

extension:
  title: "Brief an mein zukünftiges Ich (a letter to my future self)"
  intro: "Lies das Beispiel. Dann schreib deinen eigenen Brief."
  text: |
    Liebe zukünftige Mia,

    heute ist der 25. April, und das Schuljahr ist fast vorbei. Ich habe dieses Jahr viel Deutsch gelernt: Ich kann jetzt über meine Hobbys sprechen, im Restaurant bestellen und sogar über Handys in der Schule diskutieren. Am schwierigsten war für mich die Wortstellung mit „weil“. Ich hoffe, dass du in fünf Jahren in Deutschland studierst oder arbeitest. Wenn nicht, ist das auch okay, aber bitte vergiss dein Deutsch nicht!

    Liebe Grüße, Mia (16)
  questions:
    - ["Was kann Mia jetzt auf Deutsch?", "Über Hobbys sprechen, im Restaurant bestellen und über Handys in der Schule diskutieren."]
    - ["Was war für Mia am schwierigsten?", "Die Wortstellung mit „weil“."]
    - ["Was hofft Mia für ihre Zukunft?", "Dass sie in fünf Jahren in Deutschland studiert oder arbeitet."]
    - ["Mia benutzt verschiedene Formen. Finde je ein Beispiel für Präsens, Perfekt und Imperativ.", "Präsens: Ich kann ... · Perfekt: Ich habe ... gelernt · Imperativ: vergiss"]
  task: "Schreib einen Brief an dein zukünftiges Ich (8–10 Sätze): Was kannst du jetzt? Was war schwer? Was wünschst du dir (Konjunktiv II)? Your instructor can collect the letters and hand them back next year."

buffer: "Revisit the Week 12 Vorsatz wall (Hast du deinen Vorsatz geschafft?), or more rehearsal time for the performances."

page:
  modules:
    einstieg: "The year in pictures: Was haben wir da gemacht?"
    input: "Sentence builder + narrow reading (Ella & Sam, Noor & Frau Schneider) + Jahres-Quiz"
    kernaufgabe: "Unser Auftritt: plan, write and rehearse for the Abschlussfeier"
    landeskunde: "Abitur, Abiball, Abistreich"
    energizer: "Großes Jahres-Quiz (Jeopardy)"
    extension: "Brief an mein zukünftiges Ich"
    buffer: "Vorsatz wall from Week 12, or more rehearsal"
  einstieg: "Show photos, or write a list on the board, of the year's themes in order: Willkommen, Familie, Nikolaus, Karneval, Ostern ... For each, ask *Was haben wir da gemacht?* and accept single words. End with *Was hat dir am besten gefallen?* and a quick hand vote."
  materials:
    - "Student packet, one per student"
    - "Photos or a list of the year's themes for the Einstieg"
    - "Board space for the quiz"
    - "Optional: props for the performances"
  summary: "Unser Auftritt. In groups of four or five, students plan, write and rehearse a two- to three-minute performance for next week's Abschlussfeier: a skit, a song, a poem or a what-we-learned show. They rehearse twice and give each other feedback with a checklist, and everyone speaks or sings at least two lines in German. A1/A2 recycle phrases from any week; B1/B2 build in at least three of the year's grammar patterns plus welcome or thank-you lines."
  note:
    type: important
    text: "Last packet day. The Abschlussfeier is **May 2**, so groups should leave today with a finished script and assigned roles. If time runs short, cut the quiz and the extension first; rehearsal comes first."
  grammar: |
    **No new grammar: the year in six patterns.** A quick reference if a student asks *why* during rehearsal:

    | Pattern | Example | Weeks |
    | :--- | :--- | :--- |
    | Verb second | *Am Montag **habe** ich Mathe.* | 6, 20 |
    | Verb at the end | *..., weil ich Deutsch **lerne**.* | 1, 5, 20 |
    | Modal + infinitive | *Ich **möchte** nach Wien **fahren**.* | 11, 14 |
    | Perfekt | *Ich **bin** nach Berlin **gefahren**.* | 19 |
    | Wo? vs. Wohin? | ***im** Glascontainer* vs. ***in den** Glascontainer* | 4, 13, 22, 23 |
    | Konjunktiv II | *Ich **hätte** gern ... Ich **würde** gern ...* | 22 |

    The Jahres-Quiz in the packet takes one item from each of the year's big meaning traps: first-noun order, *halb*, *muss nicht*, the Perfekt, *werden*, wish vs. fact, and *gefallen*.
  achtung: "**What students will do:** read their lines straight off the page in rehearsal. Coach that, not grammar: the audience needs eye contact and volume more than perfect endings. Correct only what would confuse the audience. If someone freezes, agree on a group fallback (*Noch einmal, bitte!*) and restart the scene."
  b2: "**If a B2 asks about next steps:** the AP German exam includes a spoken presentation and a source-based essay. The Week 20 and Week 23 extensions are scaled versions of that essay. Mia's letter mixes several verb forms on purpose; it's a good model for students who want to show range."
  vocab_extra:
    - ["die Abschlussfeier", "closing ceremony"]
    - ["der Auftritt", "performance"]
    - ["das Publikum", "audience"]
    - ["die Requisiten (Pl.)", "props"]
    - ["das Abitur", "university-entrance exam"]
    - ["der Abiball", "graduation ball"]
