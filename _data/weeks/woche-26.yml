theme: "Rückblick"
cando:
  a1: "say what I learned this year and perform a short piece in German"
  b1b2: "reflect on my progress and present a polished performance"
grammar_focus: "No new grammar. The year in six patterns: verb second, verb at the end (weil, dass, wenn), modal + infinitive, Perfekt, Wo? vs. Wohin?, Konjunktiv II."
