week: 18
date: 2027-02-21
date_label: "Sonntag, 21. Februar 2027"
theme: "Stadt & Wegbeschreibung"
cando:
  a1: "ask for directions and give simple ones"
  b1b2: "give detailed directions and describe a route on a map"
grammar_focus: "Formal commands: verb + Sie (Gehen Sie geradeaus! Nehmen Sie die zweite Straße links!). Sie gehen = statement; Gehen Sie! = command."
ap:
  unit: "AP theme: Contemporary Life (cities, transportation) / Global Contexts (sustainability)"
  mode: "Interpersonal information gap (formal register) + source-based writing"
  note: "The extension asks for a short argument that uses two sources with attribution, building toward the AP Argumentative Essay."

builder:
  - title: "Wo ist ...? (Where is ...?)"
    rows:
      - ["Entschuldigung, wo ist der Bahnhof / die Post / das Kino?", "Excuse me, where is the train station / post office / movie theater?"]
      - ["Wie komme ich zum Rathaus / zur Bäckerei?", "How do I get to city hall / the bakery?"]
      - ["Ist das weit? Nein, nur fünf Minuten zu Fuß.", "Is it far? No, only five minutes on foot."]
      - ["neben / gegenüber von / zwischen / hinter", "next to / across from / between / behind"]
      - ["an der Ecke / an der Ampel / an der Kreuzung", "at the corner / at the traffic light / at the intersection"]
      - ["Vielen Dank! Gern geschehen.", "Thanks a lot! You're welcome."]
  - title: "Wegbeschreibung (Directions)"
    rows:
      - ["Gehen Sie geradeaus.", "Go straight ahead."]
      - ["Biegen Sie links / rechts ab.", "Turn left / right."]
      - ["Nehmen Sie die erste / zweite Straße links.", "Take the first / second street on the left."]
      - ["Gehen Sie über die Brücke / über den Marktplatz.", "Cross the bridge / the market square."]
      - ["Dann sehen Sie das Kino auf der rechten Seite.", "Then you'll see the movie theater on the right."]
      - ["Geh geradeaus! (du) / Gehen Sie geradeaus! (Sie)", "Go straight! (informal / formal)"]
      - ["der Bahnhof, das Rathaus, die Post, die Bank, die Apotheke, der Supermarkt", "station, city hall, post office, bank, pharmacy, supermarket"]

