energizer:
  title: "Blinder Roboter (blind robot)"
  text: "In pairs, one student closes their eyes and becomes the robot. The partner guides them to a target in the room with commands only: Geh drei Schritte geradeaus! Stopp! Dreh dich nach links! Switch after one target. (These are Week 10's du-commands; clear the floor first.)"

extension:
  title: "Die Stadt der Zukunft: autofrei?"
  intro: "Lies die zwei Texte und beantworte die Fragen."
  text: |
    Text 1: Einige deutsche Städte wollen ihre Innenstädte autofrei machen. In Freiburg gibt es den Stadtteil Vauban, in dem viele Familien ohne eigenes Auto leben. Die Kinder spielen auf der Straße, und es ist ruhiger und sauberer. Befürworter sagen: Weniger Autos bedeuten mehr Platz für Menschen, Bäume und Fahrräder.

    Text 2: Geschäftsleute in vielen Innenstädten sind skeptisch. Sie sagen: Wenn Kunden nicht mehr mit dem Auto in die Stadt fahren können, kaufen sie lieber im Internet oder im Einkaufszentrum am Stadtrand. Auch für ältere Menschen und Familien mit kleinen Kindern ist ein Leben ohne Auto nicht immer einfach.
  questions:
    - ["Was ist besonders am Stadtteil Vauban?", "Viele Familien leben dort ohne eigenes Auto."]
    - ["Welche Vorteile nennen die Befürworter?", "Mehr Platz für Menschen, Bäume und Fahrräder; es ist ruhiger und sauberer."]
    - ["Warum sind Geschäftsleute skeptisch?", "Kunden kaufen dann lieber im Internet oder im Einkaufszentrum."]
    - ["Für wen ist ein Leben ohne Auto schwierig?", "Für ältere Menschen und Familien mit kleinen Kindern."]
  task: "Sollte deine Stadt eine autofreie Zone haben? Schreib 5–6 Sätze und benutze beide Texte (Laut Text 1 ... / Text 2 zeigt, dass ...)."

buffer: "Students draw a map of their own neighborhood and write three directions on it, or a second information-gap round where partners invent new places for the blank blocks."

page:
  modules:
    einstieg: "Real German Altstadt map: name it, trace a route"
    input: "Sentence builder + narrow reading (Sofia & Max, Herr Yilmaz & Clara) + Achte auf die Form"
    kernaufgabe: "Stadtplan-Infolücke: fill in your map from directions"
    landeskunde: "Altstadt, Fußgängerzone, Sonntagsruhe"
    energizer: "Blinder Roboter (blind robot)"
    extension: "Die Stadt der Zukunft: autofrei? (two-source paragraph)"
    buffer: "Neighborhood maps, or invented places"
  einstieg: "Project or print a simple map of a German Altstadt (Heidelberg or Nuremberg works well). Point and name: *Das ist der Marktplatz. Das ist das Rathaus. Hier ist die Kirche.* Ask either/or questions: *Ist der Bahnhof links oder rechts?* Then trace a route with your finger while saying *Gehen Sie geradeaus ... dann links ...* and have students say where you ended up."
  materials:
    - "Student packet, one per student"
    - "A real German town map for the Einstieg"
    - "Open floor space for the blind-robot energizer"
  summary: "Stadtplan-Infolücke. Both partners have a map of the same town, each missing different places. They take turns asking *Wie komme ich zum Kino?*, give directions from the star, and write each place on their own map, using words only, no pointing. A1/A2 use *neben, gegenüber* and simple steps; B1/B2 give full multi-step directions with street names."
  note:
    type: note
    text: "Partners must fold the page so each sees only their own map. Early finishers check each other's maps, then try longer B1/B2 routes."
  grammar: |
    **The formal command: verb + Sie.** Put the verb first and *Sie* right after it:

    | Statement | Command |
    | :--- | :--- |
    | Sie gehen geradeaus. | **Gehen Sie** geradeaus! |
    | Sie nehmen die erste Straße. | **Nehmen Sie** die erste Straße! |
    | Sie biegen links ab. | **Biegen Sie** links **ab**! |

    Separable verbs split: *abbiegen → Biegen Sie links ab.* The one irregular: *sein → Seien Sie vorsichtig!*

    Compare Week 10's *du*-command: *Geh geradeaus!* (to a friend) versus *Gehen Sie geradeaus!* (to a stranger). Asking a stranger for directions is a *Sie* situation.

    **Getting there:** *zum* for der/das places (*zum Bahnhof, zum Kino*), *zur* for die places (*zur Post, zur Bank*).
  achtung: "**What students will do:** mix *du* and *Sie* in the same directions (*„Geh geradeaus, dann biegen Sie links ab“*). Point it out once, since register matters with strangers, then let them keep going. They'll also drop the separable prefix (*„Biegen Sie links“*); restate it with *ab*. The Achte-auf-die-Form items check the direction words themselves, which is what makes or breaks the map task."
  b2: "**If a B2 asks:** *zum* = *zu dem*, *zur* = *zu der* (dative after *zu*). *Gegenüber von* takes the dative (*gegenüber vom Bahnhof*). Each German state sets its own Sunday-closing rules, so the details vary. The map town is invented; Freiburg's Vauban district is real."
  vocab_extra:
    - ["die Altstadt", "old town"]
    - ["die Fußgängerzone", "pedestrian zone"]
    - ["die Haltestelle", "stop (bus, tram)"]
    - ["die Straßenbahn / die U-Bahn", "streetcar / subway"]
    - ["der Stadtplan", "city map"]
    - ["autofrei", "car-free"]
