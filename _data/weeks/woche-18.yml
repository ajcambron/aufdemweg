reading:
  a1:
    texts:
      - ["Sofia", "Ich heiße Sofia und ich wohne in Heidelberg. Meine Stadt ist nicht groß, aber sehr schön. Es gibt eine alte Brücke, ein Schloss und eine lange Fußgängerzone. Dort sind viele Geschäfte und Cafés. Mein Lieblingsort ist der Marktplatz. Er ist neben der Kirche."]
      - ["Max", "Ich heiße Max. Ich wohne in einem Dorf in der Nähe von Bremen. Bei uns gibt es eine Bäckerei, eine Kirche und eine Bushaltestelle. Mehr nicht! Zur Schule fahre ich mit dem Bus, zwanzig Minuten. Am Wochenende fahre ich manchmal nach Bremen. Da gibt es ein Kino."]
    questions:
      - ["Name two things Heidelberg has.", "An old bridge, a castle, a long pedestrian zone (any two)"]
      - ["Where is Sofia's favorite place?", "The market square, next to the church"]
      - ["What does Max's village have?", "A bakery, a church and a bus stop"]
      - ["Why does Max go to Bremen on weekends?", "There's a movie theater there."]
  b1:
    texts:
      - ["Herr Yilmaz", "Ich bin Stadtführer in Nürnberg. Viele amerikanische Touristen sind überrascht, wie viel man in deutschen Städten zu Fuß machen kann. Die Altstadt ist klein, die Wege sind kurz, und es gibt Fußgängerzonen ohne Autos. Was sie auch überrascht: Am Sonntag sind fast alle Geschäfte geschlossen. Dann sind die Straßen ruhig, und die Leute gehen spazieren oder sitzen im Café."]
      - ["Clara", "Ich bin vor einem Jahr von Wien nach Dallas gezogen. In Wien bin ich überall mit der U-Bahn oder der Straßenbahn hingefahren, und mit fünfzehn war ich schon ziemlich selbstständig. In Dallas brauche ich für fast alles ein Auto, und meine Eltern müssen mich fahren. Dafür sind die Häuser größer, und ich habe zum ersten Mal einen Garten."]
    questions:
      - ["Was überrascht amerikanische Touristen in Nürnberg?", "Wie viel man zu Fuß machen kann, und dass am Sonntag fast alle Geschäfte geschlossen sind."]
      - ["Was machen die Leute am Sonntag?", "Sie gehen spazieren oder sitzen im Café."]
      - ["Wie ist Clara in Wien gefahren?", "Mit der U-Bahn oder der Straßenbahn."]
      - ["Was ist für Clara in Dallas besser?", "Die Häuser sind größer, und sie hat einen Garten."]

