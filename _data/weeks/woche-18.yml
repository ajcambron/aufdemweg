task:
  title: "Stadtplan-Infolücke (map information gap)"
  format: "Partner information gap"
  directions: "Partner A and Partner B each have a map of the same town, but each map is missing some places. Fold the page so you see only your own map! Take turns asking: Entschuldigung, wie komme ich zum Kino? Your partner gives directions from the star (★), and you write the place on your map. Use words only, no pointing. When both maps are complete, compare them."
  a1: "Ask Wo ist ...? and answer with neben, gegenüber von or an der Ecke. Simple directions are fine: Gehen Sie geradeaus. Dann links."
  b1: "Give full directions from the star in at least three steps, with street names and an ordinal: Gehen Sie die Lindenallee geradeaus, nehmen Sie die zweite Straße rechts ..."
  maps:
    - title: "Partner A: Stadtplan"
      blocks:
        - ["Bahnhof", "?", "Bäckerei", "?"]
        - ["?", "Marktplatz / Rathaus", "?", "Post"]
        - ["Schule", "?", "Bank", "?"]
      hstreets: ["Hauptstraße", "Goethestraße", "Schillerstraße  ★ Sie sind hier: Ecke Lindenallee"]
      vstreets: ["Kirchgasse", "Lindenallee", "Mozartweg"]
    - title: "Partner B: Stadtplan"
      blocks:
        - ["?", "Hotel", "?", "Kino"]
        - ["Apotheke", "Marktplatz / Rathaus", "Café", "?"]
        - ["?", "Supermarkt", "?", "Park"]
      hstreets: ["Hauptstraße", "Goethestraße", "Schillerstraße  ★ Sie sind hier: Ecke Lindenallee"]
      vstreets: ["Kirchgasse", "Lindenallee", "Mozartweg"]

output:
  a1: "Write directions from DSB Hall (or your school) to a place nearby: Gehen Sie ___. Biegen Sie ___ ab. ___ ist auf der rechten Seite. Your partner follows them on a quick sketch and guesses the destination."
  b1: "Write an email to a German exchange student arriving next week (du-form!): how to get from the train station to your house step by step, plus one tip about your town (Am Sonntag ..., Der beste Ort für ...). Your partner reads it and asks one clarifying question."

landeskunde:
  title: "Altstadt, Fußgängerzone, Sonntagsruhe"
  text: |
    Most German towns grew around an old center, the Altstadt, with a market square (Marktplatz), a town hall (Rathaus) and a church. Many have turned their main shopping streets into car-free pedestrian zones (Fußgängerzonen). Errands are often done on foot, by bike or by tram, and a 15-year-old can usually get around a city alone by public transportation.

    On Sundays, nearly all shops close by law (Ladenschluss). Exceptions include gas stations, shops in train stations and airports, and in many places bakeries for a few hours in the morning. Sunday is meant as a day of rest (Sonntagsruhe), and noisy chores like mowing the lawn or drilling can earn you an annoyed visit from the neighbors.
  warum: "Why might Germans protect Sunday from shopping, even though it costs stores money? What does Sonntagsruhe say about how they value time?"
  vergleich: "Could you get around your town without a car at 15? How would that change a teenager's life?"

exit:
