page:
  modules:
    einstieg: "Picture talk: Wer ist das? Woher kommt er / sie?"
    input: "Sentence builder + narrow reading (Ben & Sofia, Jonas & Emily) + Achte auf die Form"
    kernaufgabe: "Klassen-Bingo: Findet jemanden, der ..."
    landeskunde: "Du oder Sie? Wie man sich in Deutschland begrüßt"
    energizer: "Namensspiel: the name chain"
    extension: "Steckbrief eines Austauschschülers + 40-second self-introduction"
    buffer: "Extra interview rounds, or name-tag design in German"
  einstieg: "Introduce yourself slowly with gestures and a few photos or objects: *Ich heiße ... Ich komme aus ... Ich wohne in ... Mein Hobby ist ...* Then ask either/or questions about yourself: *Komme ich aus Delaware oder aus Deutschland?* Students answer with one word. Teach *Wie bitte?* and *Noch einmal, bitte* before anyone has to speak."
  materials:
    - "Student packet, one per student"
    - "Name tags or index cards (optional)"
  summary: "Klassen-Bingo. Students mingle and ask each other questions from the question bank; when someone answers yes, their name goes in the box. Each name can be used only twice, which pushes everyone to talk to more people. B1/B2 ask one follow-up and write down an extra detail."
  note:
    type: important
    text: "This week doubles as **informal placement.** While students mingle, note who answers fluently, who needs the question read aloud, who produces *weil*-clauses without being asked, and who goes quiet and seems to translate in their head. Those notes set your pairings for Weeks 2–5."
  grammar: |
    **A1/A2: no new grammar.** Students use two verbs as fixed phrases: *ich heiße / du heißt* and *ich bin / du bist*. Don't conjugate them on the board; the sentence builder already has every form they need.

    **B1/B2: *weil* sends the verb to the end.**

    > Ich lerne Deutsch, **weil** meine Familie aus Deutschland **kommt**.
    > Ich lerne Deutsch, **weil** ich nach Deutschland reisen **möchte**.

    In a *weil*-clause, the conjugated verb (the one that changes for *ich / du / er*) moves to the very end. With a helper verb like *möchte*, the helper goes last and the infinitive sits just before it.

    **Du oder Sie:** *du* is for friends, family and classmates; *Sie* is for adults you don't know, teachers and officials. In this class, everyone uses *du*.
  achtung: "**What students will do:** keep English word order after *weil*, so you hear *„weil ich möchte reisen nach Deutschland.“* The meaning comes through, so in conversation restate it correctly and move on: *„Ah, weil du nach Deutschland reisen möchtest!“* The Achte-auf-die-Form items work on the A1 side: the subject is blanked out, so the verb ending (*heiße, heißt, kommst*) is the only clue to who's talking."
  b2: "**If a B2 asks:** *denn* also means \"because\" but keeps normal word order (*..., denn ich möchte reisen*). *Sich interessieren für* is reflexive: *Ich interessiere mich für Musik.*"
  vocab_extra:
    - ["der Austauschschüler / die Austauschschülerin", "exchange student (m / f)"]
    - ["der Steckbrief", "profile, fact sheet"]
    - ["duzen / siezen", "to use du / to use Sie"]
