builder:
  - title: "Sich vorstellen (Introducing yourself)"
    rows:
      - ["Ich heiße ...", "My name is ..."]
      - ["Ich bin ... Jahre alt.", "I am ... years old."]
      - ["Ich komme aus ...", "I come from ..."]
      - ["Ich wohne in ...", "I live in ..."]
      - ["Ich spreche Englisch / ein bisschen Deutsch.", "I speak English / a little German."]
      - ["Mein Hobby ist ... / Ich interessiere mich für ... [B1/B2]", "My hobby is ... / I'm interested in ..."]
      - ["Ich lerne Deutsch, weil ... [B1/B2: verb to the end]", "I'm learning German because ..."]
      - ["... meine Familie aus Deutschland kommt. / ... es mir Spaß macht.", "... my family comes from Germany. / ... it's fun for me."]
      - ["... ich nach Deutschland reisen möchte.", "... I want to travel to Germany."]
  - title: "Begrüßung (Greetings)"
    rows:
      - ["Hallo! / Guten Tag!", "Hi! / Good day!"]
      - ["Wie heißt du? (informal) / Wie heißen Sie? (formal)", "What's your name?"]
      - ["Wie geht's? / Wie geht es Ihnen?", "How are you? (informal / formal)"]
      - ["Es geht mir gut / nicht so gut / so lala.", "I'm doing well / not so well / so-so."]
      - ["Freut mich! / Schön, dich kennenzulernen!", "Nice to meet you!"]
      - ["Wie bitte? / Noch einmal, bitte.", "Pardon? / Once more, please."]

