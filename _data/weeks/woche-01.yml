  directions: "Stand up and ask classmates the questions in German. When someone answers yes to a box, write their name in it. You may use each name only twice, so talk to as many people as you can."
  a1: "Use the question bank as it is printed."
  b1: "Ask one follow-up question in German after each yes and write one extra detail in the last column."
