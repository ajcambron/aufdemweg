output:
  a1: "Fill in the frame about yourself, then read it aloud to a partner: Ich heiße ___. Ich bin ___ Jahre alt. Ich komme aus ___. Ich spreche ___. Mein Hobby ist ___. After each sentence your partner says Ich auch! or Ich nicht!"
  b1: "Interview your partner, then introduce them to the group in the third person with at least one weil-clause: Das ist ___. Er / Sie kommt aus ___ und interessiert sich für ___, weil ... Your partner listens and corrects any wrong facts."

landeskunde:
  title: "Du oder Sie? Wie man sich in Deutschland begrüßt"
  text: |
    German has two words for "you": du (informal: friends, family, other students) and Sie (formal: adults you don't know, teachers, officials). Switching from Sie to du is a small event; usually the older person or the one with more status offers it (Wollen wir uns duzen?). In this class we use du.

    Greetings change by region too: Guten Tag is standard, but you'll hear Grüß Gott in Bavaria and Austria, Grüezi in Switzerland and Moin (sometimes Moin moin) in the north. Germans also shake hands more than Americans do, often with everyone in a group, both when they arrive and when they leave.
  warum: "Why might a language keep two words for 'you'? What does the du/Sie choice say about how Germans think about closeness and respect?"
  vergleich: "English has only one 'you.' How do Americans show formality instead (first names, Mr./Ms., sir/ma'am)?"

exit:
  a1: "Ich kann mich auf Deutsch vorstellen (Name, Alter, Herkunft)."
  b1: "Ich kann über meinen Hintergrund und meine Interessen sprechen."

energizer:
  title: "Namensspiel (the name chain)"
  text: "Sit in a circle. The first student says: Ich heiße ... und ich mag ... The next student repeats the first student's line, then adds their own. Keep going around the circle; by the end, the last student has to remember everyone's name and what they like."

extension:
  title: "Steckbrief eines Austauschschülers"
  intro: "Lies den Steckbrief von Paul, einem Austauschschüler aus Hamburg, und beantworte die Fragen."
  text: "Steckbrief: Paul Hoffmann, 17 Jahre alt, aus Hamburg. Paul geht auf ein Gymnasium in Hamburg und macht nächstes Jahr ein Austauschjahr in den USA. Er interessiert sich für Sport, besonders Handball, und für Technik. Er spricht Deutsch und Englisch und lernt jetzt ein bisschen Spanisch. Seine Familie besteht aus vier Personen: seine Eltern, seine kleine Schwester und er."
  questions:
    - ["Woher kommt Paul, und wie alt ist er?", "Aus Hamburg; er ist 17 Jahre alt."]
    - ["Was macht Paul nächstes Jahr?", "Ein Austauschjahr in den USA."]
    - ["Wofür interessiert sich Paul?", "Für Sport, besonders Handball, und für Technik."]
    - ["Wie viele Personen sind in Pauls Familie?", "Vier."]
