reading:
  a1:
    texts:
      - ["Leon", "Ich heiße Leon. Heute trage ich eine Jeans, ein graues T-Shirt und meine Lieblingsschuhe. Sie sind weiß und sehr bequem. Ich trage fast immer Schwarz oder Grau. Bunte Kleidung gefällt mir nicht so."]
      - ["Hannah", "Ich heiße Hannah. Ich liebe Farben! Heute trage ich einen gelben Pullover und eine grüne Hose. Meine Oma sagt, das passt nicht zusammen. Ich finde, es sieht toll aus. Am Wochenende kaufe ich gern Kleidung im Secondhandladen. Das ist billig und gut für die Umwelt."]
    questions:
      - ["Which colors does Leon almost always wear?", "Black or gray"]
      - ["What does Leon like about his favorite shoes?", "They're comfortable (and white)."]
      - ["What does Hannah's grandma think of her outfit?", "That the colors don't go together."]
      - ["Why does Hannah shop at the secondhand store?", "It's cheap and good for the environment."]
  b1:
    texts:
      - ["Valentina", "Ich studiere Modedesign in Düsseldorf. Für mich ist Kleidung eine Sprache: Was man trägt, sagt etwas über einen. In Deutschland sind die Leute im Alltag oft eher praktisch angezogen. Eine gute Jacke ist wichtiger als ein schickes Outfit. Aber junge Leute experimentieren mehr, besonders in Großstädten wie Berlin."]
      - ["Max", "An meiner Schule in München gibt es keine Schuluniform, wie an fast allen deutschen Schulen. Manche Eltern wollen eine, weil dann niemand wegen seiner Kleidung gemobbt wird. Ich bin dagegen. Ich finde, man soll selbst entscheiden dürfen, was man trägt. Außerdem kostet eine Uniform auch Geld."]
    questions:
      - ["Was ist Kleidung für Valentina?", "Eine Sprache: Was man trägt, sagt etwas über einen."]
      - ["Wie sind viele Deutsche im Alltag angezogen?", "Eher praktisch."]
      - ["Warum wollen manche Eltern eine Schuluniform?", "Damit niemand wegen seiner Kleidung gemobbt wird."]
      - ["Warum ist Max gegen eine Schuluniform?", "Man soll selbst entscheiden dürfen, was man trägt, und eine Uniform kostet auch Geld."]

