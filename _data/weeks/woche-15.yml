task:
  title: "Ein Outfit für drei Anlässe (an outfit for three occasions)"
  format: "Partner role play: customer and salesperson"
  directions: "Partner A is the customer with 100 euros and needs clothes for three occasions: a winter hike (Winterwanderung), a birthday party (Geburtstagsparty) and a job interview (Vorstellungsgespräch). Partner B is the salesperson with the catalog. The customer asks for items (Haben Sie einen Mantel?), asks about color, size and price, and buys at least one item for each occasion. The salesperson fills in the receipt. Then switch roles; the new customer has 80 euros."
  a1: "Use Haben Sie ...? Was kostet ...? Ich nehme ihn / sie / es. Describe items with ist-sentences: Der Mantel ist schwarz."
  b1: "Describe what you want with adjective endings (Ich suche einen warmen Mantel, eine schwarze Hose, ein weißes Hemd) and say why each item fits the occasion."
  tables:
    - title: "Katalog"
      head: ["Artikel", "Farben", "Preis"]
      rows:
        - ["der Wintermantel", "schwarz, grau, rot", "59 €"]
        - ["die Regenjacke", "gelb, blau", "35 €"]
        - ["der Pullover", "grün, weiß, grau", "25 €"]
        - ["die Jeans", "blau, schwarz", "30 €"]
        - ["das Hemd", "weiß, hellblau", "20 €"]
        - ["das Kleid", "rot, schwarz", "45 €"]
        - ["die Schuhe (Paar)", "braun, schwarz", "40 €"]
        - ["die Wanderstiefel (Paar)", "braun", "50 €"]
        - ["die Mütze", "bunt, grau", "10 €"]
        - ["der Schal", "rot, grün", "12 €"]
    - title: "Kassenbon (receipt)"
      head: ["Anlass", "Artikel", "Farbe", "Größe", "Preis"]
      rows:
        - ["Winterwanderung", "", "", "", ""]
        - ["Geburtstagsparty", "", "", "", ""]
        - ["Vorstellungsgespräch", "", "", "", ""]
        - ["Summe", "", "", "", ""]

output:
  a1: "Describe a classmate's outfit without saying the name: Er / Sie trägt eine Jeans. Die Jeans ist blau. Er / Sie trägt ... Your partner guesses who it is."
  b1: "Write a short fashion-blog post (5–6 sentences): what you like to wear, your favorite piece and why, where you shop, and one opinion (Schuluniform? Secondhand? Marken?). Use at least four adjectives with endings. Your partner comments like a blog reader: one compliment and one question."

landeskunde:
  title: "Tracht: Dirndl und Lederhose"
  text: |
    In Bavaria and Austria, traditional clothing (Tracht) isn't a costume. Women wear the Dirndl, a fitted dress with a blouse and apron; men wear Lederhosen, leather shorts or knee breeches. People wear them to weddings, church festivals and folk festivals like Munich's Oktoberfest, and some simply on Sundays. A good Tracht is expensive and often handed down. Small details carry messages: by custom, an apron bow tied on the wearer's left means single, on the right means taken.

    In the last twenty years Tracht has become popular again with young people, which some see as pride in regional identity and others as a marketing trend. Other regions have their own Trachten, like the Black Forest's Bollenhut, a straw hat with big red pompoms.
  warum: "Why might young people in Bavaria choose to wear their grandparents' kind of clothing? What does Tracht say about regional identity?"
  vergleich: "Is there clothing in the US that shows where someone is from or what group they belong to? Compare it with Tracht."

