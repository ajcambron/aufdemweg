extension:
  title: "Fast Fashion: Wer zahlt den Preis?"
  intro: "Lies den Text und die Tabelle (Beispielrechnung). Dann beantworte die Fragen."
  text: "Ein T-Shirt für fünf Euro: Wie ist das möglich? Viele Kleidungsstücke werden in Ländern mit sehr niedrigen Löhnen produziert, und die Herstellung verbraucht viel Wasser. Für ein einziges Baumwoll-T-Shirt braucht man oft mehrere tausend Liter. Gleichzeitig kaufen viele Menschen heute viel mehr Kleidung als früher und tragen sie seltener. In Deutschland gibt es deshalb immer mehr Secondhandläden, Kleidertauschpartys und Reparatur-Cafés."
  table:
    head: ["Wohin gehen die 5 € für ein T-Shirt? (Beispiel)", "Euro"]
    rows:
      - ["Geschäft und Gewinn", "2,95 €"]
      - ["Material (Baumwolle, Farbe)", "1,25 €"]
      - ["Transport", "0,40 €"]
      - ["Fabrik", "0,35 €"]
      - ["Lohn der Näherin", "0,05 €"]
  questions:
    - ["Warum sind manche T-Shirts so billig?", "Sie werden in Ländern mit sehr niedrigen Löhnen produziert."]
    - ["Wie viel bekommt die Näherin in diesem Beispiel?", "5 Cent (0,05 €)."]
    - ["Was ist das Problem mit dem Wasser?", "Für ein T-Shirt braucht man mehrere tausend Liter Wasser."]
    - ["Welche Alternativen gibt es in Deutschland?", "Secondhandläden, Kleidertauschpartys und Reparatur-Cafés."]
  task: "Schreib 5–6 Sätze: Würdest du mehr für ein T-Shirt bezahlen, wenn die Näherin mehr Geld bekommt? Benutze eine Zahl aus der Tabelle."

buffer: "A paper clothing swap (students trade drawn items: Ich gebe dir meinen Schal für deine Mütze.), or a second shopping round with a new budget."

page:
  modules:
    einstieg: "TPR: Steh auf, wenn du Blau trägst!"
    input: "Sentence builder + narrow reading (Leon & Hannah, Valentina & Max) + Achte auf die Form"
    kernaufgabe: "Ein Outfit für drei Anlässe: shopping on a budget"
    landeskunde: "Tracht: Dirndl und Lederhose"
    energizer: "Modenschau (fashion show)"
    extension: "Fast Fashion: Wer zahlt den Preis? (text + cost chart)"
    buffer: "Paper clothing swap, or a second shopping round"
  einstieg: "Run a quick TPR round: *Steh auf, wenn du Blau trägst! Heb die Hand, wenn du Turnschuhe trägst!* Point at items as you name them. Then point to three pieces of clothing in the room and ask either/or questions: *Ist das ein Pullover oder eine Jacke?*"
  materials:
    - "Student packet, one per student"
    - "Optional: a few real clothing items or catalog pictures"
  summary: "Ein Outfit für drei Anlässe. Partner A is a customer with a budget who needs clothes for a winter hike, a birthday party and a job interview; Partner B is the salesperson with the catalog. The customer asks about items, colors, sizes and prices and buys something for each occasion, and the salesperson fills in the receipt. Then they switch. A1/A2 describe with *Der Mantel ist schwarz*; B1/B2 use adjective endings (*einen warmen Mantel*) and explain why each item fits."
  note:
    type: note
    text: "A1/A2 students don't need adjective endings this week; the program says so. *Der Pullover ist blau* and *Er gefällt mir* count as full success. Only B1/B2 work with *ein blauer Pullover*."
  grammar: |
    **A1/A2: things are er, sie, es too.** A pronoun for an object follows the noun's gender. There's no all-purpose "it":

    > **Der** Pullover ist schön. **Er** gefällt mir. · **Die** Jacke ist teuer. **Sie** kostet 60 Euro. · **Das** Kleid ist kurz. **Es** ist zu klein.

    After *nehmen* (I'll take it), the masculine one changes: *Ich nehme **ihn*** (the sweater), *sie* (the jacket), *es* (the dress).

    **B1/B2: adjective endings after *ein*.** The ending shows the gender that *ein* can't:

    | | der-words | das-words | die-words |
    | :--- | :--- | :--- | :--- |
    | Subject | ein blau**er** Pullover | ein schwarz**es** T-Shirt | eine rot**e** Jacke |
    | Object (*Ich suche ...*) | einen blau**en** Pullover | ein schwarz**es** T-Shirt | eine rot**e** Jacke |

    After *ist* there's no ending at all: *Der Pullover ist blau.*
  achtung: "**What students will do:** call everything *es*: *„Der Mantel? Es ist zu groß.“* With two items on the table, that's a meaning problem, so the Achte-auf-die-Form items make students match *er / sie / es* to the right item. B1/B2 will get adjective endings wrong constantly, and that's expected: these endings are among the last things learners acquire. Restate, don't drill, and don't grade them."
  b2: "**If a B2 asks:** after *der / die / das* the endings are simpler (*der blaue Pullover, die rote Jacke, das schwarze T-Shirt*, all *-e*). *Gefallen* takes the dative: *Er gefällt **mir***. *Die Jeans* is singular in German (*Die Jeans ist zu lang*). The catalog prices and the T-shirt cost breakdown are invented examples."
  vocab_extra:
    - ["die Kleidung", "clothes"]
    - ["bequem", "comfortable"]
    - ["die Umkleidekabine", "fitting room"]
    - ["die Tracht", "traditional regional clothing"]
    - ["das Dirndl / die Lederhose", "dirndl / lederhosen"]
    - ["der Secondhandladen", "secondhand store"]
