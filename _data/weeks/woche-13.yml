    - ["Wir fahren mit ___ Familie Ski.", "We go skiing with the family.", "der"]
    - ["Ich laufe gern ___.", "I like to ice-skate.", "Schlittschuh"]
    - ["Die Kinder bauen einen ___.", "The kids are building a snowman.", "Schneemann"]
