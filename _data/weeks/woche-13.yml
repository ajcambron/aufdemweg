week: 13
date: 2027-01-17
date_label: "Sonntag, 17. Januar 2027"
theme: "Wetter & Winter"
cando:
  a1: "describe winter weather and say what I do in winter"
  b1b2: "plan a winter trip from a forecast and justify my choices"
grammar_focus: "Dative after mit, bei, in, auf: mit dem Zug, mit der Familie, in den Bergen, auf dem Eis. der/das → dem, die → der, plural → den."
ap:
  unit: "AP theme: Global Contexts (climate) / Contemporary Life (leisure)"
  mode: "Interpersonal information gap + interpretive listening"
  note: "The extension uses two-pass listening (listen first, take notes second), the CED's strategy for fast authentic audio."

builder:
  - title: "Winterwetter (Winter weather)"
    rows:
      - ["Es schneit. / Es ist eiskalt. / Es friert.", "It's snowing. / It's freezing cold. / It's below freezing."]
      - ["Es sind minus fünf Grad.", "It's minus five degrees (Celsius)."]
      - ["der Schnee / das Eis / der Wind / die Sonne", "snow / ice / wind / sun"]
      - ["Die Straßen sind glatt.", "The roads are icy."]
      - ["Morgen wird es sonnig.", "Tomorrow it'll be sunny."]
      - ["bei schönem Wetter / bei Schnee", "in nice weather / when it snows"]
  - title: "Was machst du im Winter? (What do you do in winter?)"
    rows:
      - ["Ich fahre Ski / Schlitten / Snowboard.", "I ski / go sledding / snowboard."]
      - ["Ich laufe Schlittschuh.", "I ice-skate."]
      - ["Ich baue einen Schneemann.", "I build a snowman."]
      - ["mit dem Zug / mit dem Bus / mit der Bahn / mit dem Auto", "by train / by bus / by rail / by car"]
      - ["mit meinem Bruder / mit meiner Familie / mit meinen Freunden", "with my brother / my family / my friends"]
      - ["in den Bergen / auf dem Eis / im Schnee", "in the mountains / on the ice / in the snow"]

