task:
  title: "Lückentext + Klassen-Playlist (song cloze + class playlist)"
  format: "Listening cloze, then class survey"
  directions: "Teil 1 (10 min): Listen to the folk song „Die Gedanken sind frei“ and fill in the missing words from the word bank. Teil 2 (20 min): Interview at least four classmates: Was hörst du gern? Was ist dein Lieblingslied? Warum gefällt es dir? Write their answers in the chart. Then, in groups of four, agree on a five-song Klassen-Playlist and write one sentence per song saying why it belongs on the list."
  a1: "Teil 2: Ask the three questions as printed. Answer with Mir gefällt ..., weil es ... ist."
  b1: "Teil 2: Ask a follow-up about the lyrics (Worum geht es im Text?) and write your playlist reasons with gefallen and a weil-clause."
  key: "Lückentext: frei · erraten · vorbei · Schatten · wissen · erschießen · Blei"
  intro_html: |
    <p class="level">Teil 1: „Die Gedanken sind frei“ (Volkslied, um 1800)</p>
    <div class="word-bank">Blei &nbsp;&bull;&nbsp; erraten &nbsp;&bull;&nbsp; erschießen &nbsp;&bull;&nbsp; frei &nbsp;&bull;&nbsp; Schatten &nbsp;&bull;&nbsp; vorbei &nbsp;&bull;&nbsp; wissen</div>
    <div class="ws-note" style="line-height: 2;">Die Gedanken sind <span class="blank"></span>,<br>wer kann sie <span class="blank"></span>?<br>Sie fliehen <span class="blank"></span><br>wie nächtliche <span class="blank"></span>.<br>Kein Mensch kann sie <span class="blank"></span>,<br>kein Jäger <span class="blank"></span><br>mit Pulver und <span class="blank"></span>:<br>Die Gedanken sind frei!</div>
    <p class="ws-directions">erraten = to guess · fliehen = to flee · der Schatten = shadow · der Jäger = hunter · Pulver und Blei = gunpowder and lead</p>
  tables:
