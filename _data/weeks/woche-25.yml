        - ["3", "", ""]
        - ["4", "", ""]
        - ["5", "", ""]

output:
  a1: "Write a short music profile: Ich höre gern ___. Mein Lieblingslied ist ___. Es gefällt mir, weil ___. ___ gefällt mir nicht. Read it to a partner. They answer each sentence with Mir auch! or Mir nicht!"
  b1: "Register switch: your partner writes a three-line text to a friend in Jugendsprache (Digga, das Konzert war mega krass ...). You rewrite it as an email to a teacher (Sehr geehrte Frau ..., das Konzert war ...). Then switch roles. Compare: what changed besides the words?"

landeskunde:
  title: "Die Gedanken sind frei"
  text: |
    „Die Gedanken sind frei“ (Thoughts are free) is a German folk song from around 1800. Its message is simple: no one can read or lock up your thoughts. That made it dangerous. It was banned at times in the 1800s, and in the 1900s it became a song of quiet resistance. In 1942, Sophie Scholl of the anti-Nazi student group Die Weiße Rose is said to have played it on her flute outside the prison where her father was held for criticizing Hitler.

    Today German pop culture is as varied as American: Deutschrap tops the charts, Schlager (catchy, sentimental pop) fills arenas with fans of all ages, and festivals like Rock am Ring draw tens of thousands of people every summer.
  warum: "Why might a song about free thoughts matter so much in a country that lived under two dictatorships in the 20th century?"
  vergleich: "Which American songs have carried a political message or been sung at protests? Compare one with „Die Gedanken sind frei“."

exit:
  a1: "Ich kann sagen, welche Musik mir gefällt und warum."
  b1: "Ich kann über Jugendkultur sprechen und zwischen Jugendsprache und Standard wechseln."

energizer:
  title: "Musik-Quiz (name that tune)"
  text: "Play 10-second clips of German songs from different eras (Kraftwerk, Nena, a current Deutschrap hit, a Schlager classic). Teams guess the genre or the decade and say it in German: Das ist Rock aus den Achtzigern! Bonus point for naming the artist."

extension:
  title: "Ist Jugendsprache schlecht für die Sprache?"
  intro: "Lies die zwei Meinungen und beantworte die Fragen."
  text: |
    Meinung 1, ein Deutschlehrer: Jugendliche benutzen immer mehr englische Wörter: chillen, cringe, lost. Ich habe Angst, dass die deutsche Sprache dadurch ärmer wird. In der Schule sollten wir mehr Wert auf gutes Deutsch legen.

    Meinung 2, eine Sprachwissenschaftlerin: Sprache hat sich schon immer verändert. Auch die Eltern von heute hatten früher ihre eigene Jugendsprache. Die meisten Jugendlichen können sehr gut zwischen Jugendsprache und Standardsprache wechseln. Das ist keine Schwäche, sondern eine Kompetenz.
  questions:
    - ["Welche englischen Wörter nennt der Deutschlehrer?", "chillen, cringe, lost."]
    - ["Wovor hat der Deutschlehrer Angst?", "Dass die deutsche Sprache ärmer wird."]
    - ["Was sagt die Sprachwissenschaftlerin über die Eltern von heute?", "Sie hatten früher auch ihre eigene Jugendsprache."]
    - ["Warum ist der Wechsel für sie eine Kompetenz?", "Jugendliche können je nach Situation passend sprechen."]
  task: "Schreib 6–8 Sätze: Wem stimmst du zu? Beziehe dich auf beide Meinungen (Der Deutschlehrer meint ..., aber die Sprachwissenschaftlerin ...) und gib ein Beispiel aus dem Englischen."

buffer: "Play a few seconds of each song on the class playlist, or start planning the music piece for the Abschlussfeier."

page:
  modules:
    einstieg: "Two clips: Gefällt dir das?"
    input: "Sentence builder + narrow reading (Lea & Tobias, Herr Braun & Jule) + Achte auf die Form"
    kernaufgabe: "Lückentext (Die Gedanken sind frei) + Klassen-Playlist"
    landeskunde: "Die Gedanken sind frei"
    energizer: "Musik-Quiz (name that tune)"
    extension: "Ist Jugendsprache schlecht für die Sprache? (opinion writing)"
    buffer: "Play the class playlist, or plan the Abschlussfeier music"
  einstieg: "Play two short clips: a German song students won't know and something from their own playlists. After each, ask *Gefällt dir das? Ja oder nein?* and model *Mir gefällt das!* / *Mir gefällt das nicht.* with thumbs up or down. Then ask *Ist das Rock oder Rap?* Students answer with one word."
  materials:
    - "Student packet, one per student"
    - "A recording of „Die Gedanken sind frei“ (many free recordings exist online)"
    - "A speaker, plus short clips for the Einstieg and the music quiz"
  summary: "Lückentext + Klassen-Playlist. First the class listens to the folk song *Die Gedanken sind frei* and fills in the missing words from a word bank. Then students interview at least four classmates about their music, and groups of four agree on a five-song class playlist with one reason per song. A1/A2 use the printed questions and *Mir gefällt ..., weil ...*; B1/B2 ask about the lyrics and write reasons with *gefallen* and *weil*."
  note:
    type: important
    text: "**Song lyrics are copyrighted**, so the packet uses *Die Gedanken sind frei*, a folk song in the public domain. If you'd like students to work with a current song, project the lyrics from a licensed lyrics site during class rather than printing them."
  grammar: |
    **gefallen works backwards.** In English, the person likes the thing. In German, the thing *pleases* the person: the thing is the subject, and the person is in the dative.

    > **Das Lied** gefällt **mir**. (The song pleases me = I like the song.)
    > **Die Lieder** gefallen **mir**. (plural thing → plural verb)

    | Person | Dative |
    | :--- | :--- |
    | ich | **mir** |
    | du | **dir** |
    | er / sie | **ihm** / **ihr** |
    | wir | **uns** |
    | ihr | **euch** |
    | sie / Sie | **ihnen** / **Ihnen** |

    The dative can come first without changing who likes what: *Mir gefällt das Lied* = *Das Lied gefällt mir*.

    **Other ways to say it:** *Ich höre gern Rap* (I like listening to rap), *Ich mag die Band* (I like the band).
  achtung: "**What students will do:** say *„Ich gefalle das Lied“*, which means \"I please the song.\" The meaning flips, which is why the Achte-auf-die-Form items make students decide who likes whom when the dative comes first (*Dem Lehrer gefällt die Band*). In conversation, restate gently (*„Ah, das Lied gefällt dir!“*) or let them use *Ich mag ...*, which works the English way."
  b2: "**If a B2 asks:** other \"backwards\" verbs work the same way: *schmecken* (*Das schmeckt mir*), *fehlen* (*Du fehlst mir* = I miss you), *passen* (*Die Jacke passt mir*). Register is the real skill this week: slang is fine among friends and wrong in a presentation. The *Jugendwort des Jahres* is real; the two opinions in the extension are invented."
  vocab_extra:
    - ["das Volkslied", "folk song"]
    - ["der Künstler / die Künstlerin", "artist (m / f)"]
    - ["die Jugendsprache", "youth slang"]
    - ["das Referat", "class presentation"]
    - ["die Gedanken (Pl.)", "thoughts"]
    - ["der Schlager", "German sentimental pop song"]
