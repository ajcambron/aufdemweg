week: 25
date: 2027-04-18
date_label: "Sonntag, 18. April 2027"
theme: "Deutsche Musik & Popkultur"
cando:
  a1: "say what music I like and why"
  b1b2: "discuss youth culture and switch between slang and standard German"
grammar_focus: "gefallen works backwards: Das Lied gefällt mir = I like the song (the song is the subject!). mir, dir, ihm, ihr, uns."
ap:
  unit: "AP theme: Art and Creativity (music) / Language and Culture (register, youth language)"
  mode: "Interpretive listening + register switching"
  note: "Rewriting a slang message as a formal email practices register control (AP skill 2.A), which the AP rubrics score under Language Control."

builder:
  - title: "Musik (Music)"
    rows:
      - ["Ich höre gern Pop / Rap / Rock / Klassik / Schlager.", "I like listening to pop / rap / rock / classical / Schlager."]
      - ["Mein Lieblingslied ist ... / Meine Lieblingsband ist ...", "My favorite song is ... / My favorite band is ..."]
      - ["Das Lied gefällt mir (nicht).", "I (don't) like the song."]
      - ["Gefällt dir die Musik?", "Do you like the music?"]
      - ["Der Text ist traurig / lustig / politisch.", "The lyrics are sad / funny / political."]
      - ["Ich spiele Klavier / Gitarre / Schlagzeug.", "I play piano / guitar / drums."]
      - ["Ich gehe gern auf Konzerte / Festivals.", "I like going to concerts / festivals."]
  - title: "Jugendsprache und Standard (Youth slang and standard German) [B1/B2]"
    rows:
      - ["Das ist krass! = Das ist unglaublich.", "That's crazy! (good or bad)"]
      - ["Das ist mega! = Das ist super.", "That's awesome!"]
      - ["chillen = sich entspannen", "to chill = to relax"]
      - ["Digga / Alter (nur unter Freunden!)", "dude, bro (only among friends!)"]
      - ["Ich hab keinen Bock. = Ich habe keine Lust.", "I don't feel like it."]
      - ["mir, dir, ihm, ihr, uns, euch, ihnen / Ihnen", "to me, you, him, her, us, you all, them / you (formal)"]

