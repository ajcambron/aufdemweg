reading:
  a1:
    texts:
      - ["Lea", "Ich heiße Lea. Ich höre jeden Tag Musik, beim Lernen und im Bus. Ich höre gern Pop und ein bisschen Rap. Meine Lieblingsband kommt aus Berlin. Die Lieder sind auf Deutsch, und die Texte gefallen mir sehr. Im Sommer gehe ich auf mein erstes Festival!"]
      - ["Tobias", "Ich heiße Tobias. Ich spiele Schlagzeug in einer Band. Wir sind vier Freunde, und wir proben jeden Freitag in der Garage. Meine Eltern finden das zu laut! Wir spielen Rock und schreiben eigene Lieder auf Englisch und auf Deutsch."]
    questions:
      - ["When does Lea listen to music?", "Every day, while studying and on the bus"]
      - ["Where is Lea's favorite band from?", "Berlin"]
      - ["What does Tobias play?", "Drums"]
      - ["What do Tobias's parents think?", "It's too loud."]
  b1:
    texts:
      - ["Herr Braun", "Ich bin Musiklehrer. Deutsche Musik hat eine lange Geschichte, von Bach und Beethoven bis zur elektronischen Musik. In den 1970er-Jahren hat die Band Kraftwerk aus Düsseldorf mit Synthesizern experimentiert und damit die Popmusik auf der ganzen Welt beeinflusst. In den 80ern kam die Neue Deutsche Welle, zum Beispiel Nena mit „99 Luftballons“, ein Hit sogar in den USA. Heute singen wieder viele junge Künstler auf Deutsch, besonders im Deutschrap."]
      - ["Jule", "Jedes Jahr wählen Jugendliche in Deutschland das „Jugendwort des Jahres“. Viele Erwachsene verstehen diese Wörter nicht, und das ist auch ein bisschen der Sinn: Jugendsprache zeigt, dass man zu einer Gruppe gehört. Ich spreche mit meinen Freunden ganz anders als mit meinen Lehrern. Mit Freunden sage ich „Digga, das war krass“, aber in einem Referat würde ich das nie sagen."]
    questions:
      - ["Womit hat die Band Kraftwerk experimentiert?", "Mit Synthesizern."]
      - ["Welcher deutsche Hit war sogar in den USA bekannt?", "„99 Luftballons“ von Nena."]
      - ["Was ist das „Jugendwort des Jahres“?", "Ein Wort, das Jugendliche in Deutschland jedes Jahr wählen."]
      - ["Warum spricht Jule mit Freunden anders als mit Lehrern?", "Jugendsprache zeigt, dass man zu einer Gruppe gehört; in einem Referat passt sie nicht."]

