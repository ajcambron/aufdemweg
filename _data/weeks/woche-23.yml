task:
  title: "Müll-Sortier-Wettbewerb (trash-sorting challenge)"
  format: "Small groups: sort, compare, decide"
  directions: "In groups of three, sort the 12 items into the German disposal system below: write each item in the right column. Then compare with another group (Wohin gehört der Joghurtbecher?). Where you disagree, decide together. Finally, write one recommendation for DSB Hall: Wir sollten ..."
  a1: "Say and write: Die Zeitung gehört in die Blaue Tonne. Use the bin names as printed."
  b1: "Justify the tricky items (Der Pizzakarton gehört ins Altpapier, weil er sauber ist.) and compare with home: Bei uns gehört der Joghurtbecher in ..., in Deutschland aber in ..."
  key: "Gelbe Tonne: Joghurtbecher, Milchkarton · Blaue Tonne: Zeitung, Pizzakarton (sauber) · Biotonne: Bananenschale, Teebeutel, Eierschalen · Glascontainer: Glasflasche (Saft) · Restmüll: kaputter Teller, alte Zahnbürste · Pfand: Coladose, Plastikflasche. Rules vary a little by town."
  tables:
    - title: "Die 12 Sachen (the 12 items)"
      head: ["Sache", "Sache", "Sache"]
      rows:
        - ["die Glasflasche (Saft)", "der Joghurtbecher", "die Zeitung"]
        - ["die Bananenschale", "die Coladose (Pfand)", "der Pizzakarton (sauber)"]
        - ["die Plastikflasche (Pfand)", "der Teebeutel", "der Milchkarton"]
        - ["der kaputte Teller", "die Eierschalen", "die alte Zahnbürste"]
    - title: "Wohin gehört das? (Where does it go?)"
      head: ["Gelbe Tonne (Verpackung)", "Blaue Tonne (Papier)", "Biotonne", "Glascontainer", "Restmüll", "Pfand: zurück in den Supermarkt"]
      blank: 3
    - title: "Unsere Empfehlung für DSB Hall (our recommendation)"
      head: ["Wir sollten ..."]
      blank: 2

output:
  a1: "Write three sentences about what your family does for the environment and one thing you'll start doing: Wir trennen ___. Ich fahre ___. Ich werde ___. Read them to a partner. They say Gute Idee! or Das mache ich auch!"
  b1: "Write an opinion paragraph (6–8 sentences): Sollte es in den USA überall ein Pfandsystem wie in Deutschland geben? Include a claim, two reasons, one counterargument and a conclusion, with at least one fact from the readings. Your partner marks your claim and your fact and gives one counterargument you didn't consider."

landeskunde:
  title: "Ordnung im Müll: Pfand und Mülltrennung"
  text: |
    Germans sort their trash into five or six streams: paper (blue bin), packaging (yellow bin or yellow bag), compost (the Biotonne), general trash (Restmüll), and glass, which goes into neighborhood containers sorted by color: white, green and brown. Bins are emptied on a fixed schedule, and sorting badly can earn you a note from the landlord or the neighbors.

    Then there's Pfand. Since 2003, almost every single-use plastic bottle and can carries a 25-cent deposit. Supermarkets have machines (Pfandautomaten) that take the empties and print a receipt you exchange for cash. Return rates are extremely high, and collecting bottles is so normal that many people leave their empties next to public trash cans for others to collect.
  warum: "Sorting trash takes time and attention. Why would a whole country accept that effort? What does it say about German attitudes toward order and the environment?"
  vergleich: "Delaware had a bottle deposit until 2010, and about ten US states still have one. Why might some states keep it while others drop it?"

exit:
  a1: "Ich kann sagen, wohin der Müll gehört."
  b1: "Ich kann Recycling-Systeme vergleichen und meine Meinung schriftlich begründen."

energizer:
  title: "Müll-Staffel (trash relay)"
  text: "Put six bin labels on the board. Teams get word or picture cards of trash items. One runner at a time grabs a card, says Der Teebeutel gehört in die Biotonne! and tapes it under the right bin. The team with the most correct items wins."

extension:
  title: "Pfand für Delaware? (AP-Training)"
  intro: "Lies die zwei Quellen und die Tabelle. Dann schreib einen argumentativen Text."
  text: |
    Quelle 1 (Umweltorganisation): Ein Pfandsystem reduziert den Müll in der Natur deutlich. In Ländern mit Pfand kommen fast alle Flaschen und Dosen zurück, und das Material kann sauber recycelt werden.

    Quelle 2 (Handelsverband): Ein Pfandsystem ist teuer. Geschäfte brauchen Automaten und Platz, und die Kunden müssen die Flaschen zurückbringen. Moderne Recyclinganlagen können auch ohne Pfand viel Material sortieren.

    Quelle 3: siehe Tabelle (gerundete Beispielwerte).
  table:
    head: ["Quelle 3: Wie viele Getränkeverpackungen kommen zurück?", "ca."]
    rows:
      - ["mit Pfandsystem", "98 %"]
      - ["ohne Pfandsystem", "35 %"]
  questions:
    - ["Was ist laut Quelle 1 der Vorteil von Pfand?", "Weniger Müll in der Natur; fast alle Flaschen und Dosen kommen zurück und werden sauber recycelt."]
    - ["Was kritisiert Quelle 2?", "Pfand ist teuer: Geschäfte brauchen Automaten und Platz, und Kunden müssen die Flaschen zurückbringen."]
    - ["Was zeigt die Tabelle?", "Mit Pfand kommen viel mehr Verpackungen zurück (ca. 98 % gegenüber ca. 35 %)."]
    - ["Welche Quelle findest du am überzeugendsten? Warum?", "Open answer."]
  task: "Schreib einen argumentativen Text (8–10 Sätze): Sollte Delaware wieder ein Pfandsystem einführen? Benutze alle drei Quellen, nenne sie jedes Mal (Laut Quelle 2 ...) und ordne deinen Text nach Argumenten, nicht nach Quellen."

buffer: "Upcycling pitch: groups design a new product from one piece of trash and pitch it in three sentences, or a second sorting round with items students suggest."

page:
  modules:
    einstieg: "Trash-bag reveal: Was ist das? Wohin gehört das?"
    input: "Sentence builder + narrow reading (Paul & Maya, Herr Koch & Svenja) + Achte auf die Form"
    kernaufgabe: "Müll-Sortier-Wettbewerb: sort, compare, recommend"
    landeskunde: "Ordnung im Müll: Pfand und Mülltrennung"
    energizer: "Müll-Staffel (trash relay)"
    extension: "Pfand für Delaware? (three-source essay)"
    buffer: "Upcycling pitch, or another sorting round"
  einstieg: "Bring a bag of clean trash: a bottle, a can, a yogurt cup, a newspaper, a banana peel (or pictures of them). Pull items out one at a time: *Was ist das? Eine Dose!* Then ask *Wohin gehört das, glaubst du?* Let students guess and don't correct yet; the Kernaufgabe will settle it."
  materials:
    - "Student packet, one per student"
    - "A bag of clean trash items, or pictures, for the Einstieg"
    - "Optional: six bin labels for the board (energizer)"
  summary: "Müll-Sortier-Wettbewerb. In groups of three, students sort twelve everyday items into the German disposal system, then compare with another group and settle disagreements in German (*Wohin gehört der Joghurtbecher?*). Each group ends with one recommendation for DSB Hall. A1/A2 write *Die Zeitung gehört in die Blaue Tonne*; B1/B2 justify the tricky items with *weil* and compare with their home system."
  note:
    type: note
    text: "The answer key follows the most common German rules, but details vary by town: some cities use a yellow bag instead of a yellow bin, and some don't accept tea bags in the compost. If a student knows a different local rule, that's a good discussion, not an error."
  grammar: |
    **Wohin? takes the accusative.** Several weeks this year used *Wo?* + dative (where something *is*). When something *moves* somewhere, the same prepositions take the accusative:

    | | der-words | das-words | die-words |
    | :--- | :--- | :--- | :--- |
    | Wo? (is there) | **im** Glascontainer | **im** Altpapier | **in der** Tonne |
    | Wohin? (goes there) | **in den** Glascontainer | **ins** Altpapier | **in die** Tonne |

    *ins* = *in das*. The masculine and feminine forms show the switch most clearly: *im → in den*, *in der → in die*.

    **gehören in** (to belong in) is a *Wohin?* verb: *Die Flasche **gehört in den** Glascontainer.*

    **B1/B2 opinions:** *Man sollte ...* (one should), *Wir müssen ...* (we must), plus Week 20's connectors.
  achtung: "**What students will do:** mix up *Wo?* and *Wohin?*: *„Die Flasche gehört im Glascontainer.“* The meaning is clear in context, so restate it. The Achte-auf-die-Form items train the distinction underneath: does the sentence say where something *is* or where it's *going*? That's exactly the difference between *dem* and *den*."
  b2: "**If a B2 asks:** the prepositions that switch (*in, an, auf, über, unter, vor, hinter, neben, zwischen*) are called *Wechselpräpositionen*: dative for location, accusative for direction. Germany's 25-cent single-use deposit dates from 2003; Delaware repealed its bottle bill in 2010. Quelle 3's numbers are rounded examples."
  vocab_extra:
    - ["die Mülltrennung", "trash sorting"]
    - ["der Pfandautomat", "bottle-return machine"]
    - ["die Verpackung", "packaging"]
    - ["recyceln", "to recycle"]
    - ["der Unverpackt-Laden", "zero-waste store"]
    - ["die Nachhaltigkeit", "sustainability"]
