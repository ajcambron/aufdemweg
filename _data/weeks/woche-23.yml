reading:
  a1:
    texts:
      - ["Paul", "Ich heiße Paul und ich wohne in Freiburg. Bei uns zu Hause haben wir vier Mülltonnen: eine für Papier, eine für Plastik, eine für Bio und eine für Restmüll. Glasflaschen bringen wir zum Glascontainer. Ich finde das ein bisschen kompliziert, aber es ist gut für die Umwelt."]
      - ["Maya", "Ich heiße Maya und ich wohne in Delaware. Bei uns gibt es nur zwei Tonnen: Müll und Recycling. Papier, Plastik und Dosen kommen zusammen in die Recyclingtonne. Meine Familie kauft viel Wasser in Plastikflaschen. Vielleicht kaufe ich jetzt eine Trinkflasche."]
    questions:
      - ["How many trash bins does Paul's family have?", "Four: paper, plastic, compost and general trash"]
      - ["What does Paul think about sorting trash?", "A bit complicated, but good for the environment"]
      - ["How many bins does Maya's family have?", "Two: trash and recycling"]
      - ["What might Maya buy now?", "A reusable water bottle"]
  b1:
    texts:
      - ["Herr Koch", "Ich bin Umweltberater. In Deutschland gibt es seit 2003 ein Pfandsystem. Auf fast jede Einwegflasche aus Plastik und jede Dose zahlt man 25 Cent Pfand. Wenn man die Flasche im Supermarkt in den Pfandautomaten steckt, bekommt man das Geld zurück. Das funktioniert sehr gut: Fast alle Pfandflaschen kommen zurück. Deshalb sieht man kaum Dosen und Flaschen auf der Straße."]
      - ["Svenja", "Ich finde Mülltrennung wichtig, aber sie löst das Problem nicht. Auch in Deutschland produzieren wir sehr viel Verpackungsmüll, und ein großer Teil vom Plastik wird verbrannt statt recycelt. Besser wäre es, weniger zu kaufen. Ich gehe deshalb oft in einen Unverpackt-Laden. Dort bringe ich meine eigenen Gläser und Dosen mit."]
    questions:
      - ["Wie viel Pfand zahlt man auf eine Einwegflasche oder eine Dose?", "25 Cent."]
      - ["Wie bekommt man das Geld zurück?", "Man steckt die Flasche im Supermarkt in den Pfandautomaten."]
      - ["Warum löst Mülltrennung das Problem laut Svenja nicht?", "Es gibt sehr viel Verpackungsmüll, und viel Plastik wird verbrannt statt recycelt."]
      - ["Was macht Svenja im Unverpackt-Laden?", "Sie bringt ihre eigenen Gläser und Dosen mit."]

