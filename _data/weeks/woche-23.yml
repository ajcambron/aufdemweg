    rows:
      - ["Die Flasche gehört in den Glascontainer.", "The bottle goes in the glass container."]
      - ["Der Joghurtbecher gehört in die Gelbe Tonne.", "The yogurt cup goes in the yellow bin (packaging)."]
      - ["Die Zeitung gehört ins Altpapier, in die Blaue Tonne.", "The newspaper goes in paper recycling, the blue bin."]
      - ["Die Bananenschale gehört in die Biotonne.", "The banana peel goes in the compost bin."]
      - ["Das gehört in den Restmüll.", "That goes in the general trash."]
      - ["Die Plastikflasche bringe ich zurück: Pfand!", "I take the plastic bottle back: deposit!"]
  - title: "Umwelt (Environment)"
    rows:
      - ["der Müll / den Müll trennen", "trash / to sort the trash"]
      - ["die Umwelt schützen", "to protect the environment"]
      - ["Energie / Wasser sparen", "to save energy / water"]
      - ["mit dem Fahrrad fahren statt mit dem Auto", "to bike instead of drive"]
      - ["Plastik vermeiden / wiederverwenden", "to avoid plastic / to reuse"]
      - ["Man sollte ... / Wir müssen ... [B1/B2]", "One should ... / We must ..."]

