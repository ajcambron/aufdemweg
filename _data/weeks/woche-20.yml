task:
  title: "Handyregeln für DSB Hall (phone rules: a mini debate)"
  format: "Four corners + structured group debate"
  directions: "Step 1: Read the argument cards and mark each one pro (for phones in school) or contra. Step 2: Go to a corner of the room: sehr dafür, eher dafür, eher dagegen or sehr dagegen. Step 3: In mixed groups of four (two pro, two contra), each person gives one argument, and the next speaker must respond to it before adding their own (Das stimmt, aber ...). Step 4: Your group writes three phone rules that everyone can accept."
  a1: "Sort the cards, pick your corner, and read one card aloud as your argument: Ich bin dafür. Mit dem Handy kann man ..."
  b1: "Give your argument with Meiner Meinung nach or Ich finde, dass ..., respond to the previous speaker first, and use at least one connector (außerdem, deshalb, trotzdem)."
  tables:
    - title: "Argumentkarten (argument cards): pro oder contra?"
      head: ["Argument", "pro / contra"]
      rows:
        - ["Mit dem Handy kann man schnell etwas recherchieren.", ""]
        - ["Handys lenken im Unterricht ab.", ""]
        - ["Im Notfall kann man die Eltern anrufen.", ""]
        - ["In der Pause reden die Schüler nicht mehr miteinander.", ""]
        - ["Man lernt, verantwortungsvoll mit Medien umzugehen.", ""]
        - ["Manche Schüler werden online gemobbt, auch in der Schule.", ""]
        - ["Vokabel-Apps helfen beim Lernen.", ""]
        - ["Ohne Handy kann man sich besser konzentrieren.", ""]
    - title: "Unsere drei Handyregeln (our three phone rules)"
      head: ["#", "Regel"]
      rows:
        - ["1", ""]
        - ["2", ""]
        - ["3", ""]

output:
  a1: "Write three opinion sentences about media: Ich finde, dass ___ ___ ist. Meiner Meinung nach ist ___. Ich bin dafür / dagegen. Read them to a partner. They answer Ich auch! or Da bin ich anderer Meinung!"
  b1: "Write a short argument (6–8 sentences): Sollten Handys in der Schule verboten sein? Include a clear claim, two reasons with examples, one counterargument (Einerseits ..., andererseits ...), and a conclusion with deshalb. Your partner underlines your claim, numbers your reasons, circles your connectors and says which reason convinced them most."

landeskunde:
  title: "Datenschutz: Privatsphäre ist wichtig"
  text: |
    Germans tend to be more careful with personal data than many Americans. Privacy (Datenschutz) is a strong legal and cultural value, shaped partly by history: both the Nazi regime and East Germany's secret police, the Stasi, kept files on millions of people. When Google Street View came to Germany in 2010, hundreds of thousands of households asked to have their homes blurred, and the service barely expanded there for over a decade.

    It shows up in daily life: many Germans still prefer cash, use nicknames online and don't post photos of their children. Schools need parents' permission before publishing photos of students. And the EU's privacy law (DSGVO, known in English as GDPR) strictly limits what companies may collect.
  warum: "How might a country's history shape how it thinks about privacy today? What does Datenschutz say about German values?"
  vergleich: "Do you think about privacy when you post online? Compare your habits with the German attitude."

