week: 20
date: 2027-03-07
date_label: "Sonntag, 7. März 2027"
theme: "Medien & Technologie"
cando:
  a1: "say which devices and apps I use and give a simple opinion"
  b1b2: "state and justify an opinion and respond to a counterargument in a short debate"
grammar_focus: "Ich finde, dass ... sends the verb to the end (dass Handys nützlich sind). Meiner Meinung nach + verb second (Meiner Meinung nach sind Handys nützlich)."
ap:
  unit: "AP theme: Science and Technology (media, privacy)"
  mode: "Presentational argument (debate) + three-source argumentative writing"
  note: "The extension is a scaled AP Argumentative Essay: three sources including data, a clear position, every source cited, and organization by claim rather than by source."

builder:
  - title: "Meine Medien (My media)"
    rows:
      - ["Ich habe ein Handy / einen Laptop / ein Tablet.", "I have a phone / a laptop / a tablet."]
      - ["Ich bin ... Stunden pro Tag am Handy.", "I'm on my phone ... hours a day."]
      - ["Ich chatte / streame / poste / zocke.", "I chat / stream / post / game."]
      - ["Ich benutze oft YouTube / WhatsApp / TikTok.", "I often use YouTube / WhatsApp / TikTok."]
      - ["Ohne mein Handy kann ich nicht leben.", "I can't live without my phone."]
      - ["Das ist praktisch / nützlich / gefährlich / Zeitverschwendung.", "That's practical / useful / dangerous / a waste of time."]
  - title: "Meine Meinung (My opinion)"
    rows:
      - ["Ich finde, dass Handys nützlich sind.", "I think that phones are useful."]
      - ["Meiner Meinung nach sind Handys in der Schule ein Problem.", "In my opinion, phones in school are a problem."]
      - ["Ich bin dafür. / Ich bin dagegen.", "I'm for it. / I'm against it."]
      - ["Das stimmt, aber ... / Da bin ich anderer Meinung.", "That's true, but ... / I disagree."]
      - ["Einerseits ..., andererseits ... [B1/B2]", "On the one hand ..., on the other hand ..."]
      - ["erstens, außerdem, deshalb, trotzdem [B1/B2]", "first, besides, therefore, nevertheless"]

vocab:
  complete:
    - ["Ich finde, dass Handys nützlich ___.", "I think that phones are useful.", "sind"]
    - ["Meiner Meinung ___ sind Handys ein Problem.", "In my opinion phones are a problem.", "nach"]
    - ["Ich bin ___. Handys sollen verboten sein.", "I'm for it. Phones should be banned.", "dafür"]
    - ["Ich ___ jeden Tag zwei Stunden am Handy.", "I'm on my phone two hours every day.", "bin"]
    - ["Das ___, aber ...", "That's true, but ...", "stimmt"]
    - ["Soziale Medien sind oft ___.", "Social media are often a waste of time.", "Zeitverschwendung"]
  match:
    - ["die Meinung", "opinion"]
    - ["nützlich", "useful"]
    - ["ablenken", "to distract"]
    - ["verbieten", "to ban"]
    - ["der Bildschirm", "screen"]
    - ["erlaubt", "allowed"]
  match_order: [3, 5, 1, 6, 2, 4]
  translate:
    - ["Ich finde, dass Handys praktisch sind.", "I think that phones are practical."]
    - ["Meiner Meinung nach ist TikTok Zeitverschwendung.", "In my opinion TikTok is a waste of time."]
    - ["Ich bin dagegen.", "I'm against it."]
    - ["Handys lenken im Unterricht ab.", "Phones are distracting in class."]
    - ["In der Pause sind Handys erlaubt.", "Phones are allowed at break."]
    - ["Da bin ich anderer Meinung.", "I disagree."]
    - ["Ich chatte jeden Abend mit meinen Freunden.", "I chat with my friends every evening."]
    - ["Deshalb sollte man Handys verbieten.", "That's why phones should be banned."]
  letters: ["Handy", "Meinung", "Bildschirm", "nützlich", "verbieten", "erlaubt", "Laptop", "Internet"]
  broken:
    - ["Ich finde, dass Handys nützlich sind.", "I think that phones are useful."]
    - ["Meiner Meinung nach lenken Handys ab.", "In my opinion phones are distracting."]
    - ["Ich bin dafür, weil es praktisch ist.", "I'm for it because it's practical."]
    - ["Da bin ich anderer Meinung.", "I disagree."]
  suitable:
    - "Ich bin ___ Stunden pro Tag am Handy."
    - "Ich finde, dass ___."
    - "Meiner Meinung nach ist ___."
    - "Ich bin dafür, weil ___."
    - "Ich bin dagegen, weil ___."
    - "Ohne ___ kann ich nicht leben."

reading:
  a1:
    texts:
      - ["Paula", "Ich heiße Paula. Ich bin jeden Tag drei Stunden am Handy. Ich chatte mit meinen Freunden und schaue Videos. Meine Eltern finden, dass das zu viel ist. Ich finde, dass mein Handy wichtig ist. Ohne mein Handy weiß ich nicht, was meine Freunde machen!"]
      - ["Finn", "Ich heiße Finn. Ich habe kein Smartphone, nur ein altes Handy zum Telefonieren. Meine Freunde finden das komisch. Aber ich finde, dass ich so mehr Zeit habe: Ich lese viel und spiele Gitarre. Meiner Meinung nach brauchen Jugendliche kein Smartphone."]
    questions:
      - ["How long is Paula on her phone each day?", "Three hours"]
      - ["What do Paula's parents think?", "That it's too much."]
      - ["What kind of phone does Finn have?", "An old phone, just for calls"]
      - ["What does Finn do with his extra time?", "He reads and plays guitar."]
  b1:
    texts:
      - ["Frau Neumann", "An unserer Schule sind Handys seit diesem Schuljahr im Unterricht verboten. Die Schülerinnen und Schüler müssen sie morgens in eine Box legen und bekommen sie erst nach der letzten Stunde zurück. Am Anfang gab es viel Protest. Inzwischen sagen viele Lehrkräfte, dass die Klassen ruhiger sind und die Schüler sich in der Pause wieder mehr unterhalten."]
      - ["Yusuf", "Ich bin Schülersprecher und verstehe das Problem, aber ein komplettes Verbot finde ich falsch. Wir benutzen das Handy auch zum Lernen: für Vokabel-Apps, zum Recherchieren oder für den Stundenplan. Außerdem müssen wir lernen, selbst mit Medien umzugehen. Das lernt man nicht, wenn das Handy den ganzen Tag in einer Box liegt. Meiner Meinung nach sollten Schüler und Lehrer die Regeln zusammen machen."]
    questions:
      - ["Was müssen die Schüler morgens machen?", "Ihre Handys in eine Box legen."]
      - ["Was sagen viele Lehrkräfte inzwischen?", "Die Klassen sind ruhiger, und die Schüler unterhalten sich in der Pause mehr."]
      - ["Wofür benutzt Yusuf das Handy beim Lernen?", "Für Vokabel-Apps, zum Recherchieren und für den Stundenplan."]
      - ["Was schlägt Yusuf vor?", "Schüler und Lehrer sollten die Regeln zusammen machen."]

