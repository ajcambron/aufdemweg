extension:
  title: "Drei Quellen, ein Text (AP-Training)"
  intro: "Lies die drei Quellen. Dann schreib einen argumentativen Text und benutze alle drei."
  text: |
    Quelle 1 (Zeitungsartikel): In mehreren europäischen Ländern sind Handys an Schulen inzwischen stark eingeschränkt. Befürworter berichten von weniger Ablenkung im Unterricht und mehr Gesprächen in den Pausen.

    Quelle 2 (Interview mit einer Medienpädagogin): „Ein Verbot löst das Problem nicht. Jugendliche müssen lernen, mit dem Handy umzugehen, und dafür brauchen sie Übung, auch in der Schule.“

    Quelle 3 (Tabelle, Beispieldaten): Wie viele Stunden am Tag sind Jugendliche am Handy? Siehe Tabelle.
  table:
    head: ["Quelle 3: Stunden pro Tag am Handy", "Jugendliche"]
    rows:
      - ["0–2 Stunden", "18 %"]
      - ["2–4 Stunden", "41 %"]
      - ["mehr als 4 Stunden", "41 %"]
  questions:
    - ["Was berichten Befürworter eines Verbots (Quelle 1)?", "Weniger Ablenkung im Unterricht und mehr Gespräche in den Pausen."]
    - ["Warum ist die Medienpädagogin gegen ein Verbot (Quelle 2)?", "Jugendliche müssen den Umgang mit dem Handy üben, auch in der Schule."]
    - ["Wie viele Jugendliche sind mehr als vier Stunden am Tag am Handy (Quelle 3)?", "41 %."]
    - ["Welche Quelle passt am besten zu deiner Meinung? Warum?", "Open answer."]
  task: "Schreib einen argumentativen Text (8–10 Sätze): Sollten Handys an Schulen verboten werden? Nimm klar Stellung, benutze alle drei Quellen und nenne sie jedes Mal (Laut Quelle 1 ...), und erkläre, wie jede Quelle dein Argument stützt. Ordne den Text nach Argumenten, nicht nach Quellen."

buffer: "A second debate round on a new question (Sollte TikTok erst ab 16 erlaubt sein?), or a class vote on the best group's phone rules."

page:
  modules:
    einstieg: "Silent screen-time poll"
    input: "Sentence builder + narrow reading (Paula & Finn, Frau Neumann & Yusuf) + Achte auf die Form"
    kernaufgabe: "Handyregeln für DSB Hall: four corners + mini debate"
    landeskunde: "Datenschutz: Privatsphäre ist wichtig"
    energizer: "Schnell-Meinung (opinion speed round)"
    extension: "Drei Quellen, ein Text (AP-style essay)"
    buffer: "Second debate topic, or a vote on the rules"
  einstieg: "Ask students to check their phone's screen-time number without saying it. Run a silent hands-up poll: *Wer ist weniger als zwei Stunden am Tag am Handy? Zwei bis vier? Mehr als vier?* Write the tallies on the board in German. Then ask *Ist das zu viel?* and collect *ja / nein*. Those tallies set up the debate."
  materials:
    - "Student packet, one per student"
    - "Four signs for the corners of the room: sehr dafür / eher dafür / eher dagegen / sehr dagegen"
  summary: "Handyregeln für DSB Hall. Students sort eight argument cards into pro and contra, choose a corner of the room to show where they stand, then debate in mixed groups of four where each speaker must respond to the previous one before adding a new argument. Each group ends by writing three phone rules everyone can accept. A1/A2 read an argument card aloud as their contribution; B1/B2 use *Meiner Meinung nach* and *Ich finde, dass ...*, respond with *Das stimmt, aber ...* and add a connector."
  note:
    type: important
    text: "This is the program's B1/B2 debate week. The extension is a full AP-style source-based essay (three sources, one argument); if you have strong B2 students, it's the most valuable optional module of the year to run."
  grammar: |
    **Two ways to give an opinion, two word orders.**

    *Ich finde, dass ...* sends the verb to the end, like *weil* in Week 1:

    > Ich finde, **dass** Handys nützlich **sind**.

    *Meiner Meinung nach* counts as the first element, so the verb comes right after it (Week 6's verb-second rule):

    > **Meiner Meinung nach sind** Handys nützlich.

    **Taking sides:** *Ich bin dafür* (for it), *Ich bin dagegen* (against it). With a clause: *Ich bin dafür, dass Handys erlaubt sind.*

    **Connectors (B1/B2):** *erstens* (first), *außerdem* (besides), *deshalb* (that's why), *trotzdem* (nevertheless), *einerseits ... andererseits* (on the one hand ... on the other). *Deshalb* and *trotzdem* take the verb right after them: *Deshalb **sind** Handys ...*
  achtung: "**What students will do:** two word-order slips, *„Ich finde, dass Handys sind nützlich“* and *„Meiner Meinung nach Handys sind nützlich.“* In a debate, meaning comes first: restate instead of interrupting. The bigger meaning trap is negation inside an opinion: *Ich bin dagegen, dass man Handys verbietet* is actually *pro* phones. The Achte-auf-die-Form items are built around exactly that kind of sentence."
  b2: "**If a B2 asks:** *Ich denke / Ich glaube / Ich meine, dass ...* all work like *Ich finde, dass ...*. *Sollte* (should) is the Konjunktiv II of *sollen* (Week 14). For the essay: organize by argument, not by source, and name the source every time you use it. Quelle 3's numbers are invented."
  vocab_extra:
    - ["das Argument / das Gegenargument", "argument / counterargument"]
    - ["dafür / dagegen", "for it / against it"]
    - ["der Datenschutz", "data privacy"]
    - ["sich konzentrieren", "to concentrate"]
    - ["zocken (Umgangssprache)", "to game (slang)"]
    - ["die Quelle", "source"]
