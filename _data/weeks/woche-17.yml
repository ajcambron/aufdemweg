task:
  title: "Wer passt zusammen? (Who would be friends?)"
  format: "Partner information gap"
  directions: "Partner A has profiles of Tim and Sophie; Partner B has profiles of Lukas and Emma. Fold the page so you see only your own profiles! Ask each other questions (Wie alt ist ...? Was macht er / sie gern? Wie ist er / sie? Was isst er / sie gern?) and complete the chart for all four people. Then compare them and decide which two would be the best friends. Write two reasons with comparatives."
  a1: "Ask Wie alt ist Tim? Was macht Sophie gern? Write short answers, then one comparison: Lukas ist älter als Sophie."
  b1: "Write two comparisons for your chosen pair and one for a pair that wouldn't work: Tim ist lauter als Lukas, deshalb ..."
  tables:
    - title: "Partner A: Profile"
      head: ["Name", "Alter", "Hobbys", "Charakter", "Lieblingsessen"]
      rows:
        - ["Tim", "16", "Fußball, Videospiele", "lustig, laut, ungeduldig", "Pizza"]
        - ["Sophie", "15", "Lesen, Zeichnen", "ruhig, ehrlich, schüchtern", "Sushi"]
    - title: "Partner B: Profile"
      head: ["Name", "Alter", "Hobbys", "Charakter", "Lieblingsessen"]
      rows:
        - ["Lukas", "17", "Lesen, Schach", "ruhig, ehrlich, hilfsbereit", "Sushi"]
        - ["Emma", "16", "Fußball, Musik", "lustig, sportlich, ungeduldig", "Burger"]
    - title: "Alle vier (fill in together)"
      head: ["", "Tim", "Sophie", "Lukas", "Emma"]
      rows:
        - ["Alter", "", "", "", ""]
        - ["Hobbys", "", "", "", ""]
        - ["Charakter", "", "", "", ""]
        - ["Lieblingsessen", "", "", "", ""]
    - title: "Unsere Wahl"
      head: ["Wer passt zusammen?", "Warum? (zwei Gründe)"]
      blank: 2

output:
  a1: "Describe your best friend, or a favorite character from a book or show, in four sentences: name, age, looks, character. Add one comparison: Er / Sie ist ___er als ich. Read it to a partner. They ask one question: Ist er / sie ...?"
  b1: "Write a short Freundschafts-Ratgeber (friendship guide, 5–6 sentences): what makes a good friend, with at least three comparatives and one superlative (am wichtigsten). Your partner ranks your three most important qualities from 1 to 3 and explains their top choice."

landeskunde:
  title: "Freund oder Bekannter? Valentinstag in Deutschland"
  text: |
    Valentine's Day in Germany is mostly for couples: flowers (especially red roses), chocolates, a dinner out. Students don't usually exchange valentines with the whole class, and there's no tradition of cards for every friend.

    The bigger difference is in the word Freund itself. Germans distinguish between a Bekannter (an acquaintance) and a Freund (a real friend), and they use Freund sparingly. Mein Freund or meine Freundin usually means my boyfriend or my girlfriend; for a friend, people say ein Freund von mir or ein guter Freund. Friendships can take longer to form, but they're often expected to last for life.
  warum: "Why might a language keep two very different words for 'friend' and 'acquaintance'? What does that say about how friendship is valued?"
  vergleich: "In English, we call a lot of people 'friends.' Who in your life would be a Freund, and who a Bekannter?"

exit:
  a1: "Ich kann einen Freund oder eine Freundin beschreiben."
  b1: "Ich kann zwei Personen vergleichen und sagen, was ein guter Freund ist."

energizer:
  title: "Wer ist größer? (silent line-up)"
  text: "Call out a category and have students line up silently: by height, by birthday, by number of siblings, by how far they live from DSB Hall. Then check out loud down the line: Ana ist größer als Ben. Ben wohnt näher als Carla."

extension:
  title: "Freundschaft online"
  intro: "Lies den Text und die Tabelle (Beispieldaten). Dann beantworte die Fragen."
  text: "Kann man online echte Freunde finden? Eine Umfrage unter Jugendlichen zeigt: Viele haben Freunde, die sie nur online kennen, zum Beispiel aus Spielen oder sozialen Netzwerken. Die meisten finden Freundschaften offline aber wichtiger. Online ist es einfacher, Kontakt zu haben, aber schwieriger, jemandem wirklich zu vertrauen. Fast alle sagen: Ein echter Freund ist jemand, der da ist, wenn es einem schlecht geht."
  table:
    head: ["Aussage", "Prozent"]
    rows:
      - ["Ich habe mindestens einen Freund, den ich nur online kenne.", "41 %"]
      - ["Offline-Freundschaften sind mir wichtiger.", "78 %"]
      - ["Online kann man leichter über Probleme sprechen.", "35 %"]
      - ["Ich vertraue Online-Freunden genauso wie Offline-Freunden.", "22 %"]
  questions:
    - ["Wie viele Jugendliche haben einen Freund, den sie nur online kennen?", "41 %."]
    - ["Was ist für die meisten wichtiger?", "Offline-Freundschaften (78 %)."]
    - ["Was ist online leichter, was ist schwieriger?", "Kontakt haben ist leichter; jemandem vertrauen ist schwieriger."]
    - ["Was ist laut Text ein echter Freund?", "Jemand, der da ist, wenn es einem schlecht geht."]
  task: "Sind Online-Freunde echte Freunde? Schreib 5–6 Sätze mit mindestens zwei Komparativen (leichter, wichtiger ...) und einer Zahl aus der Tabelle."

buffer: "Compliment cards: each student writes one card for a classmate using a comparison (Mit dir ist alles lustiger! Du bist so hilfsbereit wie ...), or a second matching round with profiles students invent."

page:
  modules:
    einstieg: "Two famous faces: Wer ist älter? Wer ist größer?"
    input: "Sentence builder + narrow reading (Mia & Ben, Lara & Jonas) + Achte auf die Form"
    kernaufgabe: "Wer passt zusammen? Trade profiles, match friends"
    landeskunde: "Freund oder Bekannter? Valentinstag in Deutschland"
    energizer: "Wer ist größer? (silent line-up)"
    extension: "Freundschaft online (text + data)"
    buffer: "Compliment cards, or invented profiles"
  einstieg: "Show photos of two well-known people your students will recognize (athletes, musicians, cartoon characters). Ask either/or questions: *Wer ist älter? Wer ist größer? Wer ist lustiger?* Students answer with a name. Then model the full sentence: *Ja, sie ist älter als er.*"
  materials:
    - "Student packet, one per student"
    - "Two photos of familiar people for the Einstieg"
  summary: "Wer passt zusammen? Partner A has profiles of two teenagers and Partner B has two others. They ask each other questions until a four-person chart is complete, then compare the four and decide which two would make the best friends, with two reasons. A1/A2 write short answers and one comparison; B1/B2 compare with *als* and *so ... wie* and explain why another pair wouldn't work."
  note:
    type: note
    text: "Class falls on Valentine's Day itself. The packet is about friendship, not romance, so nobody has to talk about crushes. If students ask: *mein Freund / meine Freundin* usually means boyfriend / girlfriend, which is covered in the Landeskunde."
  grammar: |
    **Comparatives: -er + als.** Add *-er* to the adjective and compare with *als* (than):

    > Tim ist **größer als** Jonas. Meine Schwester ist **älter als** ich.

    Short adjectives with *a, o, u* usually add an umlaut: *alt → älter, groß → größer, jung → jünger*. The irregulars to memorize:

    | | comparative | superlative (B1/B2) |
    | :--- | :--- | :--- |
    | gut | **besser** | am besten |
    | gern | **lieber** | am liebsten |
    | viel | **mehr** | am meisten |
    | hoch | **höher** | am höchsten |

    **Equal:** *so ... wie* (as ... as): *Lea ist **so alt wie** Anna.*
  achtung: "**What students will do:** say *„mehr groß“* (the English \"more\" pattern), or *„größer wie“* instead of *größer als*. Plenty of native speakers say *größer wie* too, but it isn't standard. Restate: *„Ja, größer als Ben.“* The Achte-auf-die-Form items ask the opposite question (*Wer ist jünger?* after *Anna ist älter als Lea*), so students must process the comparison instead of just spotting a name."
  b2: "**If a B2 asks:** a superlative before a noun takes adjective endings (*der beste Freund, die beste Freundin*). *Lieber* is the comparative of *gern*: *Ich spiele lieber Tennis* = I'd rather play tennis. *Mehr* never takes an ending. The profiles and survey numbers are invented."
  vocab_extra:
    - ["die Freundschaft", "friendship"]
    - ["der / die Bekannte", "acquaintance"]
    - ["der feste Freund / die feste Freundin", "boyfriend / girlfriend"]
    - ["vertrauen", "to trust"]
    - ["sich verstehen", "to get along"]
    - ["hilfsbereit", "helpful"]
