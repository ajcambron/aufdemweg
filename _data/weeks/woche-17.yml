reading:
  a1:
    texts:
      - ["Mia", "Ich heiße Mia. Meine beste Freundin heißt Zoe. Sie ist ein Jahr älter als ich und auch größer. Zoe ist sehr lustig und ehrlich. Ich bin schüchterner als sie. Wir verstehen uns super, weil wir beide gern zeichnen."]
      - ["Ben", "Ich heiße Ben. Mein bester Freund ist Elias. Er ist so alt wie ich, fünfzehn. Elias spielt besser Fußball als ich, aber ich bin schneller! Er ist manchmal ungeduldig, aber er hilft mir immer."]
    questions:
      - ["Who is older, Mia or Zoe?", "Zoe"]
      - ["Who is shyer, Mia or Zoe?", "Mia"]
      - ["What does Elias do better than Ben?", "He plays soccer better."]
      - ["What does Ben say about Elias's character?", "He's sometimes impatient, but he always helps."]
  b1:
    texts:
      - ["Lara", "Im Deutschen gibt es einen wichtigen Unterschied zwischen einem Freund und einem Bekannten. Ein Bekannter ist jemand, den man kennt, zum Beispiel aus der Schule oder aus dem Verein. Ein Freund ist viel mehr: jemand, dem man vertraut und mit dem man über alles reden kann. Viele Deutsche haben deshalb nur wenige, aber sehr enge Freunde. Und Vorsicht: Wenn ich sage „mein Freund“, denken alle, dass ich einen festen Freund habe!"]
      - ["Jonas", "Als ich Austauschschüler in Pennsylvania war, war ich zuerst überrascht. Alle waren total freundlich und haben sofort gesagt: „We should hang out!“ Aber oft ist dann nichts passiert. In Deutschland dauert es länger, bis man Freunde findet. Dafür sind die Freundschaften oft tiefer. Inzwischen habe ich aber auch in Amerika zwei echte Freunde gefunden."]
    questions:
      - ["Was ist der Unterschied zwischen einem Freund und einem Bekannten?", "Einen Bekannten kennt man nur; einem Freund vertraut man, und man kann mit ihm über alles reden."]
      - ["Warum ist „mein Freund“ manchmal missverständlich?", "Alle denken, man meint den festen Freund."]
      - ["Was hat Jonas in Pennsylvania überrascht?", "Alle waren sofort freundlich, aber oft ist danach nichts passiert."]
      - ["Wie sind Freundschaften in Deutschland laut Jonas?", "Es dauert länger, aber sie sind oft tiefer."]

