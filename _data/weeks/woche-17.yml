week: 17
date: 2027-02-14
date_label: "Sonntag, 14. Februar 2027: Valentinstag"
theme: "Valentinstag & Freundschaft"
cando:
  a1: "describe a friend's looks and character"
  b1b2: "compare two people and explain what makes a good friend"
grammar_focus: "Comparatives: adjective + -er + als (Tim ist größer als Jonas). Learn these: gut → besser, gern → lieber, viel → mehr. Equal: so groß wie."
ap:
  unit: "AP theme: Families and Communities (friendship) / Language and Culture"
  mode: "Interpersonal information gap + interpretive data reading"
  note: "The Landeskunde is a language-and-culture point: one word (Freund vs. Bekannter) carries a whole cultural perspective."

builder:
  - title: "Wie ist er? Wie ist sie? (What is he / she like?)"
    rows:
      - ["Mein bester Freund / Meine beste Freundin heißt ...", "My best friend (m / f) is named ..."]
      - ["Er / Sie ist nett, lustig, ehrlich, hilfsbereit.", "He / She is nice, funny, honest, helpful."]
      - ["Er / Sie ist manchmal ungeduldig / schüchtern / laut.", "He / She is sometimes impatient / shy / loud."]
      - ["Er / Sie hat braune Haare und blaue Augen.", "He / She has brown hair and blue eyes."]
      - ["Wir verstehen uns gut.", "We get along well."]
      - ["Ein guter Freund ist ... [B1/B2]", "A good friend is ..."]
  - title: "Vergleichen (Comparing)"
    rows:
      - ["groß → größer / alt → älter / jung → jünger", "tall → taller / old → older / young → younger"]
      - ["Tim ist größer als Jonas.", "Tim is taller than Jonas."]
      - ["Lea ist so alt wie Anna.", "Lea is as old as Anna."]
      - ["gut → besser / gern → lieber / viel → mehr", "good → better / gladly → rather / much → more"]
      - ["Ich spiele lieber Fußball als Tennis.", "I'd rather play soccer than tennis."]
      - ["am besten / am liebsten [B1/B2]", "best / most of all"]

