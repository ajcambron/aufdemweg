    - ["Lea ist so alt ___ Anna.", "Lea is as old as Anna.", "wie"]
    - ["Mein bester Freund ist sehr ___.", "My best friend is very honest.", "ehrlich"]
    - ["Wir verstehen ___ gut.", "We get along well.", "uns"]
