reading:
  a1:
    texts:
      - ["Sara", "Ich heiße Sara. An Silvester bin ich immer bei meiner Freundin. Um Mitternacht sehen wir das Feuerwerk. Mein Vorsatz für das neue Jahr: Ich werde mehr Sport machen. Ich werde dreimal pro Woche joggen. Mein Bruder sagt, das schaffe ich nie!"]
      - ["Ali", "Ich heiße Ali. Ich mache keine großen Vorsätze. Ich werde nur zwei Sachen ändern: Ich werde weniger am Handy sein, nur eine Stunde pro Tag. Und ich werde jeden Tag zehn Minuten Deutsch üben, mit einer App."]
    questions:
      - ["Where is Sara on New Year's Eve?", "At her friend's house"]
      - ["What is Sara's resolution?", "More sports: jogging three times a week"]
      - ["How much time will Ali spend on his phone?", "Only one hour a day"]
      - ["How will Ali practice German?", "Ten minutes a day with an app"]
  b1:
    texts:
      - ["Julia", "Jedes Jahr am 1. Januar schreibe ich meine Vorsätze in ein Heft, und jedes Jahr im Februar habe ich sie vergessen. Dieses Jahr mache ich es anders: Ich werde nur einen Vorsatz haben, und ich werde ihn ganz konkret formulieren. Statt „Ich werde mehr lesen“ schreibe ich: „Ich werde jeden Abend vor dem Schlafen zwanzig Minuten lesen.“ Meine Freundin wird mich jeden Sonntag fragen, ob ich es geschafft habe."]
      - ["Herr Wagner", "Ich bin Sportlehrer. Im Januar sind die Fitnessstudios voll, im März sind sie wieder leer. Das sehe ich jedes Jahr. Mein Tipp: Wählt etwas, das euch Spaß macht, und macht es mit anderen zusammen. Wer allein joggt, hört schneller auf. Wer in einem Verein oder mit Freunden trainiert, bleibt dabei."]
    questions:
      - ["Was ist Julias Problem mit Vorsätzen?", "Im Februar hat sie sie schon vergessen."]
      - ["Was macht Julia dieses Jahr anders?", "Nur ein Vorsatz, ganz konkret formuliert; ihre Freundin fragt jeden Sonntag nach."]
      - ["Was sieht Herr Wagner jedes Jahr?", "Im Januar sind die Fitnessstudios voll, im März wieder leer."]
      - ["Was ist sein Tipp?", "Etwas wählen, das Spaß macht, und es mit anderen zusammen machen."]

