week: 12
date: 2027-01-10
date_label: "Sonntag, 10. Januar 2027"
theme: "Neujahr & Gute Vorsätze"
cando:
  a1: "say what I will do in the new year"
  b1b2: "state a resolution, explain why it matters and judge how realistic it is"
grammar_focus: "Future with werden + infinitive at the end: Ich werde mehr Sport machen. ich werde, du wirst, er/sie wird."
ap:
  unit: "AP theme: Contemporary Life (personal goals) / Families and Communities (celebrations)"
  mode: "Interpersonal speaking + short persuasive writing"
  note: "The extension reads survey data and ends with a short persuasive reply, an early step toward the AP Argumentative Essay."

builder:
  - title: "Gute Vorsätze (Resolutions)"
    rows:
      - ["Ich werde mehr Sport machen.", "I will do more sports."]
      - ["Ich werde weniger am Handy sein.", "I will spend less time on my phone."]
      - ["Ich werde gesünder essen.", "I will eat healthier."]
      - ["Ich werde jeden Tag Deutsch üben.", "I will practice German every day."]
      - ["Ich werde früher ins Bett gehen.", "I will go to bed earlier."]
      - ["Mein Vorsatz ist: ...", "My resolution is: ..."]
      - ["Das ist realistisch / unrealistisch, weil ... [B1/B2]", "That's realistic / unrealistic, because ..."]
  - title: "Silvester und Neujahr (New Year's Eve and New Year)"
    rows:
      - ["Silvester (31. Dezember) / Neujahr (1. Januar)", "New Year's Eve / New Year's Day"]
      - ["das Feuerwerk / um Mitternacht", "fireworks / at midnight"]
      - ["Guten Rutsch! / Frohes neues Jahr!", "Happy New Year! (before / after midnight)"]
      - ["der Glücksbringer: das Schwein, das Kleeblatt, der Schornsteinfeger", "good-luck charm: pig, four-leaf clover, chimney sweep"]
      - ["ich werde / du wirst / er, sie wird", "I will / you will / he, she will"]
      - ["wir werden / ihr werdet / sie werden", "we will / you all will / they will"]

