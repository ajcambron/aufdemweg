task:
  title: "Vorsatz-Partner (accountability partners)"
  format: "Partner interview + contract"
  directions: "Interview your partner about three possible resolutions. For each one ask: Was wirst du machen? Wie oft? Ist das realistisch? Then pick together the ONE resolution with the best chance and make it concrete: what, how often, when. Write it in the contract, both sign it, and set a check-in date (Ich werde dich am ... fragen)."
  a1: "Ask Was wirst du machen? and answer with Ich werde ... Rate each idea from 1 (unrealistisch) to 5 (realistisch)."
  b1: "Push your partner to be concrete: Wie genau? Wann? Was machst du, wenn ...? Write the contract in full sentences in the third person (Sie wird jeden Abend ...)."
  tables:
    - title: "Interview"
      head: ["Vorsatz", "Wie oft?", "Realistisch? (1–5)"]
      blank: 3
    - title: "Vertrag (contract)"
      head: ["Mein Partner / Meine Partnerin wird ...", "Wie oft?", "Wir prüfen am ..."]
      blank: 1
    - head: ["Unterschrift", "Unterschrift"]
      blank: 1

output:
  a1: "Write three resolutions for yourself and one for a family member: Ich werde ___. Meine Mutter wird ___. Read them to a partner. For each one, they say Das ist realistisch! or Das ist unrealistisch!"
  b1: "Write a short paragraph (5–6 sentences): your resolution, why it matters to you, what could get in the way, and what you'll do then (Wenn ..., werde ich ...). Your partner reads it and gives one piece of advice: Du solltest ..."

landeskunde:
  title: "Silvester"
  text: |
    Germans call New Year's Eve Silvester, after the saint whose feast day is December 31. Before midnight, people wish each other einen guten Rutsch (a good slide into the new year); after midnight it's Frohes neues Jahr! At midnight the sky over German cities explodes: private fireworks go on sale for only the last few days of the year, and many people set them off right in the street.

    Other customs: Dinner for One, a 1963 British comedy sketch that is barely known in Britain, has aired on German TV on New Year's Eve for decades. People give each other small good-luck charms (Glücksbringer): marzipan pigs, four-leaf clovers, chimney sweeps, ladybugs. And many families used to melt bits of lead over a candle and read the future in the shapes (Bleigießen); since the EU restricted lead, they use wax or tin instead.
  warum: "Pigs, clovers and chimney sweeps all stand for luck. Why might a culture put so much energy into luck at the start of the year?"
  vergleich: "How does your family mark New Year's? Compare one of your customs with a German one."

exit:
  a1: "Ich kann sagen, was ich im neuen Jahr machen werde."
  b1: "Ich kann einen Vorsatz erklären und sagen, ob er realistisch ist."

energizer:
  title: "Wahrsager (fortune teller)"
  text: "Each student writes one funny prediction for a classmate on a slip of paper with werden (Du wirst einen Hund kaufen. Du wirst nach Berlin fliegen.). Fold the slips, mix them in a hat, draw and read them aloud. The class guesses who wrote each one."

extension:
  title: "Warum Vorsätze scheitern"
  intro: "Lies den Text und die Tabelle (Beispieldaten). Dann beantworte die Fragen."
  text: "Eine Umfrage unter 500 Jugendlichen zeigt: Fast die Hälfte hat einen Vorsatz für das neue Jahr, aber nur wenige halten ihn bis zum Sommer durch. Die häufigsten Gründe für das Scheitern sind keine Zeit, keine Motivation und zu große Ziele. Experten raten deshalb zu kleinen, konkreten Zielen und zu einem Partner, der einen unterstützt."
  table:
    head: ["Grund für das Scheitern", "Prozent"]
    rows:
      - ["keine Zeit", "38 %"]
      - ["keine Motivation", "31 %"]
      - ["das Ziel war zu groß", "22 %"]
      - ["anderer Grund", "9 %"]
  questions:
    - ["Wie viele Jugendliche haben einen Vorsatz?", "Fast die Hälfte."]
    - ["Was ist der häufigste Grund für das Scheitern?", "Keine Zeit (38 %)."]
    - ["Was raten Experten?", "Kleine, konkrete Ziele und einen Partner, der unterstützt."]
    - ["Passt euer Vertrag aus der Kernaufgabe zu diesem Rat? Warum (nicht)?", "Open answer."]
  task: "Eine Freundin schreibt dir: „Ich mache nie wieder Vorsätze, das bringt nichts!“ Antworte ihr in 4–5 Sätzen. Benutze eine Zahl aus der Tabelle."

buffer: "A second fortune-teller round, or a class Vorsatz wall: each student posts their contract sentence on a poster to revisit in Week 26."

page:
  modules:
    einstieg: "Fireworks photo + Wirst du ...? questions"
    input: "Sentence builder + narrow reading (Sara & Ali, Julia & Herr Wagner) + Achte auf die Form"
    kernaufgabe: "Vorsatz-Partner: interview, choose, sign a contract"
    landeskunde: "Silvester"
    energizer: "Wahrsager (fortune teller)"
    extension: "Warum Vorsätze scheitern (data + persuasive reply)"
    buffer: "Fortune-teller round two, or a Vorsatz wall"
  einstieg: "Show a photo of New Year's fireworks over a German city (the Brandenburg Gate in Berlin is the classic). Say *An Silvester gibt es um Mitternacht ein Feuerwerk.* Then model three resolutions about yourself with gestures: *Ich werde mehr joggen. Ich werde weniger Kaffee trinken.* Ask *Und du? Wirst du mehr Sport machen?* Students answer *ja* or *nein*."
  materials:
    - "Student packet, one per student"
    - "A fireworks photo for the Einstieg"
    - "Optional: a poster for the Vorsatz wall (revisit in Week 26)"
  summary: "Vorsatz-Partner. Partners interview each other about three possible resolutions and rate how realistic each one is. Then they choose one, make it concrete (what, how often, when), write it into a contract they both sign and set a check-in date. A1/A2 use *Ich werde ...* and a 1–5 rating; B1/B2 push for specifics and write the contract in the third person."
  note:
    type: note
    text: "This is the first class after a three-week break. Expect rust: give the Einstieg a few extra minutes and recycle Week 11's *möchte* and *will* before introducing *werden*."
  grammar: |
    **Future with werden.** *werden* plus an infinitive at the very end:

    | | werden |
    | :--- | :--- |
    | ich | werde |
    | du | **wirst** |
    | er / sie / es | **wird** |
    | wir / sie / Sie | werden |
    | ihr | werdet |

    > Ich **werde** mehr Sport **machen**. Du **wirst** weniger am Handy **sein**.

    German uses the plain present for the future far more than English (*Morgen spiele ich Fußball*). *Werden* adds intention or prediction, which is why it fits resolutions.
  achtung: "**What students will do:** right after Week 11, mix up *will* (want) and *werde* (will). Write both on the board side by side. They'll also slip on word order (*„Ich werde machen mehr Sport“*); restate it and move on. The Achte-auf-die-Form items contain no time words like *morgen* or *nächstes Jahr*, so students have to notice *werden* itself to know it's the future."
  b2: "**If a B2 asks:** *werden* on its own means \"to become\" (*Ich werde Ärztin* = I'm going to be a doctor; see Week 24). *Wirst* and *wird* are the only irregular forms. The extension's survey numbers are invented."
  vocab_extra:
    - ["der Vorsatz", "resolution"]
    - ["Silvester", "New Year's Eve"]
    - ["der Glücksbringer", "good-luck charm"]
    - ["schaffen", "to manage, to pull off"]
    - ["üben", "to practice"]
    - ["scheitern", "to fail"]
