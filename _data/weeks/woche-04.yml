reading:
  a1:
    texts:
      - ["Ryan", "Ich wohne in einem Haus in Newark. In meinem Haus gibt es sechs Zimmer: ein Wohnzimmer, eine Küche, drei Schlafzimmer und ein Badezimmer. Mein Lieblingszimmer ist mein Zimmer. Mein Bett ist neben dem Fenster, und mein Schreibtisch ist neben der Tür."]
      - ["Grace", "Ich wohne in einer Wohnung. In meiner Wohnung gibt es vier Zimmer: ein Wohnzimmer, eine Küche, ein Schlafzimmer und ein Badezimmer. Mein Lieblingszimmer ist die Küche, weil meine Familie dort oft zusammen isst."]
    questions:
      - ["How many rooms are in Ryan's house?", "Six"]
      - ["Where is Ryan's bed?", "Next to the window"]
      - ["What kind of home does Grace live in?", "An apartment"]
      - ["Why is the kitchen Grace's favorite room?", "Her family often eats there together."]
  b1:
    texts:
      - ["Tyler", "Ich wohne in einem Haus am Stadtrand von Newark, mit einem Garten hinter dem Haus. In meinem Zimmer gibt es ein Bett, einen Schreibtisch und ein Regal voller Bücher. Mein Lieblingsplatz ist aber nicht mein Zimmer, sondern der Garten: Dort kann ich mich gut entspannen und in Ruhe Musik hören."]
      - ["Nora", "Ich wohne in einer Wohnung im dritten Stock. Meine Wohnung ist kleiner als das Haus meiner besten Freundin, aber ich mag sie trotzdem sehr gern, weil mein Zimmer einen tollen Blick auf die Stadt hat. Über meinem Schreibtisch hängen viele Poster von meinen Lieblingsbands."]
    questions:
