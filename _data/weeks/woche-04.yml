extension:
  title: "Welche Wohnung passt?"
  intro: "Lies die zwei Wohnungsanzeigen. Achtung: Im Deutschen ist 1.276 € = eintausendzweihundertsechsundsiebzig Euro (Punkt bei Tausendern)."
  text: "Wohnung A liegt mitten im Stadtzentrum, mit guten Einkaufsmöglichkeiten und einer Straßenbahn direkt vor dem Haus. Wohnung B liegt ruhig in einem Villenviertel am Stadtrand, mit einem kleinen Garten. Beide Wohnungen haben einen Balkon und eine offene Küche."
  table:
    head: ["", "Wohnung A", "Wohnung B"]
    rows:
      - ["Zimmer", "2", "5"]
      - ["Größe", "58 m²", "145 m²"]
      - ["Lage", "Stadtzentrum", "Stadtrand, ruhig"]
      - ["Kaltmiete pro Monat", "476 €", "1.276 €"]
  questions:
    - ["Welche Wohnung ist größer, und wie viel größer?", "Wohnung B, 87 m² größer (145 m² statt 58 m²)."]
    - ["Welche Wohnung passt besser für eine Familie mit zwei Kindern? Warum?", "Wohnung B: mehr Zimmer, mehr Platz, ruhig, mit Garten."]
    - ["Welche Wohnung passt besser für eine Studentin, die allein wohnt? Warum?", "Wohnung A: billiger, klein genug, im Zentrum mit Straßenbahn."]
    - ["Welche Wohnung würdest du wählen? Warum?", "Open answer."]
  task: "Schreib eine kurze E-Mail an den Vermieter von Wohnung A oder B (Sie-Form!): Stell dich vor, sag, warum die Wohnung passt, und frag nach zwei Informationen (Nebenkosten? Haustiere?). Beginn mit Sehr geehrte Damen und Herren, und ende mit Mit freundlichen Grüßen."

