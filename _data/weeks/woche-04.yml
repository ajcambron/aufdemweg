page:
  modules:
    einstieg: "Picture of a room: Was ist das? Wo ist das?"
    input: "Sentence builder + narrow reading (Ryan & Grace, Tyler & Nora) + Achte auf die Form"
    kernaufgabe: "Zimmerbeschreibung: describe a room plan, partner fills the grid"
    landeskunde: "Wohnung statt Haus: Wohnen in Deutschland"
    energizer: "Möbel-Memory / Kim's game"
    extension: "Welche Wohnung passt? (ads + formal email)"
    buffer: "Dream-room quick draw, or invented room plans"
  einstieg: "Project or sketch a simple bedroom. Point and name: *Das ist das Bett. Das ist die Lampe.* Then place things with your hands as you speak: *Die Lampe ist über dem Bett. Der Teppich ist unter dem Tisch.* Ask either/or questions: *Ist die Katze auf dem Bett oder unter dem Bett?* Students answer with one or two words."
  materials:
    - "Student packet, one per student (the room plans are in it)"
    - "A picture or quick sketch of a bedroom for the Einstieg"
  summary: "Zimmerbeschreibung. Each partner has a room plan the other can't see. Partner A describes Zimmer A in German, and Partner B fills in an empty grid from what they hear; then they compare and switch. A1/A2 place 4–5 items; B1/B2 place every item using at least two different prepositions."
  note:
    type: note
    text: "The room plans are printed in the packet, so there's nothing extra to bring. Partners fold the page so each sees only their own plan."
  grammar: |
    **Prepositions of place, as chunks.** A1/A2 learn the phrases whole: *auf dem Tisch, unter dem Bett, im Zimmer.* B1/B2 get the pattern behind them.

    When the question is ***Wo?*** (where is it?), the article after the preposition changes:

    | | der-words | das-words | die-words |
    | :--- | :--- | :--- | :--- |
    | Normal | der Tisch | das Bett | die Küche |
    | After a place preposition | auf **dem** Tisch | unter **dem** Bett | in **der** Küche |

    Two contractions show up constantly: ***im*** = in dem (*im Wohnzimmer*), ***am*** = an dem (*am Fenster*).

    The prepositions this week: *in* (in), *auf* (on top of), *unter* (under), *über* (above), *neben* (next to), *an* (at, on a wall), *vor* (in front of), *hinter* (behind), *zwischen* (between).
  achtung: "**What students will do:** keep the dictionary article (*„auf der Tisch“*) or skip it. In the drawing task, the partner still knows where the table goes, so treat it as success. What does matter is the preposition itself: *auf* vs. *unter* puts the cat in a different place. That's what the Achte-auf-die-Form items check."
  b2: "**If a B2 asks:** *Ich lege das Buch auf **den** Tisch* (accusative) describes movement toward a place (*Wohin?*). That's Week 23's slice, not this one. *Liegen, stehen, hängen* describe where things are: lying flat, standing upright, hanging."
  vocab_extra:
    - ["die Wohnung", "apartment"]
    - ["die Miete / die Kaltmiete", "rent / rent without utilities"]
    - ["die Nebenkosten", "utilities, building costs"]
    - ["die Kaution", "security deposit"]
    - ["der Altbau / der Neubau", "older building / new building"]
