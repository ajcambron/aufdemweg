task:
  title: "Zimmerbeschreibung (draw what you hear)"
  format: "Partner information gap, listening"
  directions: "Fold the page so each partner sees only their own room plan. Partner A describes Zimmer A in German; Partner B writes each item in the Runde 1 grid, using only what they hear. Then compare with the plan and switch: Partner B describes Zimmer B, and Partner A fills in the Runde 2 grid."
  a1: "Name and place 4–5 items: Das Bett ist hinten links. Die Lampe ist neben dem Bett."
  b1: "Place every item, and use at least two different prepositions (neben, vor, hinter, zwischen), not just the grid words links and rechts."
  tables:
