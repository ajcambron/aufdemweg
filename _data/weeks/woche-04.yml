      - ["Was gibt es in Tylers Zimmer?", "Ein Bett, einen Schreibtisch und ein Regal voller Bücher."]
      - ["Wie vergleicht Nora ihre Wohnung mit dem Haus ihrer Freundin?", "Ihre Wohnung ist kleiner, aber sie mag sie wegen des tollen Blicks auf die Stadt."]
      - ["Was hängt über Noras Schreibtisch?", "Viele Poster von ihren Lieblingsbands."]

