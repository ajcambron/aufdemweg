week: 4
date: 2026-10-18
date_label: "Sonntag, 18. Oktober 2026"
theme: "Zuhause & Zimmer"
cando:
  a1: "name rooms and furniture and describe where things are"
  b1b2: "compare my home with a partner's home"
grammar_focus: "Where is it? Place prepositions as chunks: auf dem Tisch, unter dem Bett, neben dem Fenster, im Zimmer, in der Küche. B1/B2: der/das → dem, die → der."
ap:
  unit: "AP theme: Contemporary Life (housing) / Families and Communities"
  mode: "Interpersonal information gap + formal email (Sie-Form)"
  note: "The extension reads two apartment ads with German number formats (1.276 €, 58 m²) and ends with a formal email to a landlord, practicing register (AP skill 2.A)."

builder:
  - title: "Mein Zuhause (My home)"
    rows:
      - ["Ich wohne in einem Haus / in einer Wohnung.", "I live in a house / an apartment."]
      - ["In meinem Haus / In meiner Wohnung gibt es ... Zimmer.", "In my house / apartment there are ... rooms."]
      - ["das Wohnzimmer / die Küche / das Schlafzimmer / das Badezimmer / das Esszimmer", "living room / kitchen / bedroom / bathroom / dining room"]
      - ["der Garten / die Garage / der Keller", "yard, garden / garage / basement"]
      - ["Mein Lieblingszimmer ist ...", "My favorite room is ..."]
      - ["im Wohnzimmer / in der Küche / im Schlafzimmer", "in the living room / in the kitchen / in the bedroom"]
  - title: "Möbel und Präpositionen (Furniture and prepositions)"
    rows:
      - ["das Bett, der Schreibtisch, der Stuhl, der Schrank", "bed, desk, chair, closet"]
      - ["das Regal, die Lampe, der Teppich, das Fenster, die Tür", "shelf, lamp, rug, window, door"]
      - ["auf dem Tisch / unter dem Bett", "on the table / under the bed"]
      - ["neben dem Fenster / über dem Schreibtisch", "next to the window / above the desk"]
      - ["hinter dem Sofa / vor der Tür / im Schrank", "behind the sofa / in front of the door / in the closet"]
      - ["links / rechts / in der Mitte / hinten / vorne", "left / right / in the middle / at the back / at the front"]

