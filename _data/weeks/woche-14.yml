week: 14
date: 2027-01-24
date_label: "Sonntag, 24. Januar 2027"
theme: "Körper & Gesundheit"
cando:
  a1: "name body parts and say what hurts"
  b1b2: "describe symptoms to a doctor and pass on advice"
grammar_focus: "müssen (have to) and sollen (should, supposed to) + infinitive at the end. Careful: Du musst nicht = you don't have to, not you must not!"
ap:
  unit: "AP theme: Science and Technology (health) / Contemporary Life"
  mode: "Interpersonal speaking (formal register) + source-based writing"
  note: "The extension asks students to cite both texts by name (Laut Text 1 ...), the source-attribution habit the AP Essay rubric rewards."

builder:
  - title: "Was tut dir weh? (What hurts?)"
    rows:
      - ["Mein Kopf tut weh. / Ich habe Kopfschmerzen.", "My head hurts. / I have a headache."]
      - ["Mein Bauch / Mein Hals / Mein Rücken tut weh.", "My stomach / throat / back hurts."]
      - ["Meine Füße tun weh.", "My feet hurt."]
      - ["Ich habe Fieber / Husten / Schnupfen.", "I have a fever / a cough / a runny nose."]
      - ["Ich bin krank. / Mir ist schlecht.", "I'm sick. / I feel nauseous."]
      - ["der Kopf, der Bauch, der Arm, das Bein, der Fuß, die Hand, das Auge, das Ohr", "head, stomach, arm, leg, foot, hand, eye, ear"]
      - ["Gute Besserung!", "Get well soon!"]
  - title: "Beim Arzt (At the doctor's)"
    rows:
      - ["Was fehlt Ihnen? / Wo tut es weh? / Seit wann?", "What's wrong? / Where does it hurt? / Since when?"]
      - ["Sie müssen im Bett bleiben.", "You have to stay in bed."]
      - ["Sie sollen viel Tee trinken.", "You should drink lots of tea."]
      - ["Sie dürfen keinen Sport machen.", "You may not do any sports."]
      - ["Nehmen Sie diese Tabletten.", "Take these pills."]
      - ["Die Ärztin sagt, ich soll ... [B1/B2]", "The doctor says I'm supposed to ..."]

