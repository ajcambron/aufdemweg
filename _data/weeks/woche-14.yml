extension:
  title: "Später in die Schule?"
  intro: "Lies die zwei Texte und beantworte die Fragen."
  text: |
    Text 1, ein Schlafforscher: Jugendliche brauchen acht bis zehn Stunden Schlaf pro Nacht. In der Pubertät wird man abends später müde, deshalb ist ein Schulbeginn um 7:45 Uhr für viele zu früh. Wer zu wenig schläft, kann sich schlechter konzentrieren und wird öfter krank.

    Text 2, eine Schulleiterin: An unserer Schule beginnt der Unterricht seit zwei Jahren erst um 8:30 Uhr. Die Schülerinnen und Schüler sind im Unterricht wacher. Aber es gibt auch Probleme: Die Schule endet später, und viele haben am Nachmittag weniger Zeit für Sport und Vereine.
  questions:
    - ["Wie viele Stunden Schlaf brauchen Jugendliche?", "Acht bis zehn Stunden."]
    - ["Warum ist 7:45 Uhr für viele zu früh?", "In der Pubertät wird man abends später müde."]
    - ["Was ist an der Schule der Schulleiterin besser?", "Die Schüler sind im Unterricht wacher."]
    - ["Welches Problem gibt es?", "Die Schule endet später, und es bleibt weniger Zeit für Sport und Vereine."]
  task: "Sollte die Schule später beginnen? Schreib einen Absatz (5–6 Sätze). Benutze beide Texte und nenne sie: Laut Text 1 ... / Text 2 zeigt, dass ..."

buffer: "A second round of doctor role plays with symptom cards students invent, or a real Gute-Besserung card for someone who's out sick."

page:
  modules:
    einstieg: "Body-part TPR: Zeig auf ...!"
    input: "Sentence builder + narrow reading (Lina & Tom, Dr. Schulz & Kenan) + Achte auf die Form"
    kernaufgabe: "In der Arztpraxis: patient cards and doctor's advice"
    landeskunde: "Apotheke, Drogerie, Hausmittel"
    energizer: "Der Arzt sagt ... (Simon says)"
    extension: "Später in die Schule? (two sources, one paragraph)"
    buffer: "New symptom cards, or a get-well card"
  einstieg: "Total Physical Response with body parts, recycling Week 10's commands: *Zeig auf deinen Kopf! Zeig auf dein Knie!* Speed up, then mime pain: hold your head and say *Mein Kopf tut weh!* Students copy the gesture and the sentence. Do the same for *Bauch, Hals, Fuß*."
  materials:
    - "Student packet, one per student"
    - "Optional: a toy stethoscope or a white shirt for the doctor role"
  summary: "In der Arztpraxis. Partner A is the patient with a secret symptom card; Partner B is the doctor with an advice list. The doctor asks questions, decides what's wrong and gives three pieces of advice with *müssen*, *sollen* or *dürfen*, and the patient writes them down. Then they switch. Both use *Sie*. B1/B2 doctors explain one piece of advice with *weil*, and patients report it to someone else: *Die Ärztin sagt, ich soll ...*"
  note:
    type: note
    text: "Doctors use *Sie* even with teenage patients, so this is a natural place to practice the formal register. The symptom cards keep the role play impersonal, which matters if a student has a health situation they'd rather not discuss."
  grammar: |
    **müssen and sollen + infinitive.** Two more modal verbs, like *möchten* and *wollen* in Week 11, with the second verb at the end:

    | | müssen (have to) | sollen (should, supposed to) |
    | :--- | :--- | :--- |
    | ich | muss | soll |
    | du | musst | sollst |
    | er / sie | muss | soll |
    | wir / sie / Sie | müssen | sollen |

    > Sie **müssen** im Bett **bleiben**. Der Arzt sagt, ich **soll** viel Tee **trinken**.

    *Sollen* often passes on someone else's instruction ("the doctor says I'm supposed to ..."), which is why the B1/B2 report-back uses it.

    **What hurts:** *Mein Kopf **tut** weh* (one thing), *Meine Füße **tun** weh* (more than one). Or *Ich habe Kopfschmerzen / Bauchschmerzen / Halsschmerzen*.
  achtung: "**What students will do:** read ***Du musst nicht*** as \"you must not.\" It means \"you don't have to\"; \"must not\" is *Du darfst nicht*. That flips the meaning, so it's what the Achte-auf-die-Form items test. The other common slip is *„Mein Kopf ist weh“* or *„Ich habe Kopf weh“*. Restate it: *„Ah, dein Kopf tut weh!“*"
  b2: "**If a B2 asks:** *wehtun* is separable (*Es tut weh*). *Mir ist schlecht* uses the dative, like *Mir ist kalt* from Week 5. *Du solltest* (you ought to) is the Konjunktiv II of *sollen*, the polite way to give advice. Rules for school sick notes vary by German state; Kenan describes one school."
  vocab_extra:
    - ["die Apotheke", "pharmacy"]
    - ["der Arzt / die Ärztin", "doctor (m / f)"]
    - ["die Praxis", "doctor's office"]
    - ["die Erkältung", "cold"]
    - ["das Attest", "doctor's note"]
    - ["das Hausmittel", "home remedy"]
