reading:
  a1:
    texts:
      - ["Lina", "Ich heiße Lina. Heute bin ich krank. Ich habe Fieber und mein Hals tut weh. Ich muss im Bett bleiben. Meine Mutter macht mir einen Tee mit Honig. Ich muss heute nicht in die Schule gehen, aber ich bin trotzdem nicht froh!"]
      - ["Tom", "Ich heiße Tom. Gestern habe ich Basketball gespielt, und jetzt tut mein Fuß weh. Die Ärztin sagt, ich soll den Fuß hochlegen. Ich darf zwei Wochen keinen Sport machen. Das ist doof!"]
    questions:
      - ["What's wrong with Lina?", "She has a fever and a sore throat."]
      - ["What does Lina's mother make for her?", "Tea with honey"]
      - ["What hurts on Tom?", "His foot"]
      - ["How long can't Tom do sports?", "Two weeks"]
  b1:
    texts:
      - ["Dr. Schulz", "Ich bin Kinderärztin in Leipzig. Im Winter kommen jeden Tag viele Kinder und Jugendliche mit Erkältungen in meine Praxis. Meistens brauchen sie keine Medikamente, sondern Ruhe, viel Tee und Geduld. Antibiotika helfen bei einer Erkältung nicht, weil sie meistens von Viren kommt. Trotzdem wollen viele Eltern ein Rezept. Dann muss ich lange erklären."]
      - ["Kenan", "Letzten Monat war ich eine Woche krank. An meiner Schule braucht man ab dem dritten Tag ein Attest vom Arzt, sonst fehlt man unentschuldigt. Das ist manchmal stressig, weil man krank zum Arzt gehen muss. Meine Oma schwört übrigens auf Hausmittel: Hühnersuppe, Kamillentee und frische Luft."]
    questions:
      - ["Was brauchen Kinder mit einer Erkältung meistens?", "Ruhe, viel Tee und Geduld, keine Medikamente."]
      - ["Warum helfen Antibiotika bei einer Erkältung nicht?", "Weil eine Erkältung meistens von Viren kommt."]
      - ["Was braucht Kenan an seiner Schule ab dem dritten Tag?", "Ein Attest vom Arzt."]
      - ["Welche Hausmittel empfiehlt Kenans Oma?", "Hühnersuppe, Kamillentee und frische Luft."]

structured_input:
  ref:
    directions: "Was bedeutet der Satz? (What does it mean?)"
    items:
      - ["Du musst nicht in die Schule gehen.", "You don't have to go to school.", ["You must not go to school.", "You don't have to go to school."]]
      - ["Sie müssen im Bett bleiben.", "You have to stay in bed.", ["You have to stay in bed.", "You may stay in bed."]]
      - ["Der Arzt sagt, ich soll viel trinken.", "The doctor says I should drink a lot.", ["The doctor says I should drink a lot.", "The doctor says I want to drink a lot."]]
      - ["Ich muss heute nicht zum Arzt.", "I don't have to go to the doctor today.", ["I must not go to the doctor today.", "I don't have to go to the doctor today."]]
      - ["Du darfst keinen Sport machen.", "You're not allowed to do sports.", ["You're not allowed to do sports.", "You don't have to do sports."]]
  aff:
    directions: "Was machst du, wenn du krank bist?"
    options: ["Ja", "Nein"]
    items:
      - "Wenn ich krank bin, bleibe ich im Bett."
      - "Wenn ich krank bin, trinke ich viel Tee."
      - "Wenn ich krank bin, gehe ich trotzdem in die Schule."
      - "Wenn ich krank bin, schaue ich den ganzen Tag Filme."
      - "Wenn ich krank bin, gehe ich sofort zum Arzt."

task:
  title: "In der Arztpraxis (doctor role play)"
  format: "Partner role play with an information gap"
  directions: "Partner A is the patient and secretly chooses a Patientenkarte. Partner B is the doctor and uses the Ratschläge list. The doctor asks questions (Was fehlt Ihnen? Wo tut es weh? Seit wann?), decides what's wrong and gives three pieces of advice with müssen, sollen or dürfen. The patient writes the advice on the Notizzettel. Then switch roles with a new card. Doctor and patient both use Sie."
  a1: "Patient: Mein Kopf tut weh. Ich habe Fieber. Doctor: choose three lines from the Ratschläge list."
  b1: "Doctor: ask Seit wann? plus one more follow-up and explain one piece of advice with weil. Patient: afterwards, tell a third student what the doctor said: Die Ärztin sagt, ich soll ..."
  tables:
    - title: "Patientenkarten (patient cards)"
      head: ["Karte", "Symptome", "Seit wann?"]
      rows:
        - ["1", "Kopfschmerzen, Fieber (39 °C), Husten", "seit zwei Tagen"]
        - ["2", "Bauchschmerzen, Mir ist schlecht.", "seit gestern Abend"]
        - ["3", "Der Fuß tut weh (beim Basketball).", "seit heute Morgen"]
        - ["4", "Halsschmerzen, Schnupfen, sehr müde", "seit drei Tagen"]
    - title: "Ratschläge (advice list for the doctor)"
      head: ["Sie müssen ...", "Sie sollen ...", "Sie dürfen ..."]
      rows:
        - ["im Bett bleiben", "viel Tee trinken", "keinen Sport machen"]
        - ["diese Tabletten nehmen", "den Fuß hochlegen", "nicht in die Schule gehen"]
        - ["zum Röntgen gehen", "nur Suppe und Zwieback essen", "keine kalten Getränke trinken"]
        - ["in drei Tagen wiederkommen", "viel schlafen", "keine Süßigkeiten essen"]
    - title: "Notizzettel (patient's notes)"
      head: ["Karte", "Was hat der Arzt / die Ärztin gesagt?"]
      blank: 2

output:
  a1: "Write a note: Ich bin krank. Mein ___ tut weh. Ich habe ___. Ich muss ___. Read it to a partner. They answer Gute Besserung! and give one tip as a command (Trink viel Tee!)."
  b1: "Write an email to a teacher (Sie-Form!) saying you'll miss school: what's wrong, since when, what the doctor said (Die Ärztin sagt, ich soll ...), and when you'll be back. Your partner plays the teacher and writes a two-sentence reply."

landeskunde:
  title: "Apotheke, Drogerie, Hausmittel"
  text: |
    In Germany you can't buy aspirin or cough syrup at the supermarket. Medicine, even the non-prescription kind, is sold in the Apotheke (pharmacy), marked by a big red A, where a pharmacist advises you. Shampoo, toothpaste and vitamins come from a Drogerie such as dm or Rossmann. At night and on Sundays, one Apotheke in each area takes the Notdienst (emergency shift).

    Many Germans reach for Hausmittel (home remedies) before pills: chamomile tea, chicken soup, steam inhalation, a warm compress, and above all fresh air. Opening the windows wide for a few minutes several times a day (Stoßlüften) is considered healthy, even in January.
  warum: "Why might a country keep even simple medicines behind a pharmacist's counter? What does that say about how Germans think about health and expertise?"
  vergleich: "Where does your family buy medicine? Which home remedies does your family use?"

