reading:
  a1:
    texts:
      - ["Jonas", "Ich heiße Jonas. Ich spiele oft Fußball, dreimal pro Woche im Verein. Am Wochenende spiele ich manchmal Videospiele. Ich lese nie. Das finde ich langweilig!"]
      - ["Aylin", "Ich heiße Aylin. Ich zeichne jeden Tag, also immer! Ich gehe auch gern schwimmen, aber nur selten, weil das Schwimmbad weit weg ist. Am Samstag gehe ich oft mit meinen Freundinnen ins Kino."]
    questions:
      - ["How often does Jonas play soccer?", "Three times a week (in a club)"]
      - ["What does Jonas never do?", "Read"]
      - ["How often does Aylin draw?", "Every day (always)"]
      - ["Why does Aylin rarely go swimming?", "The pool is far away."]
  b1:
    texts:
      - ["Marie", "Neben der Schule bin ich in zwei Vereinen: Ich spiele Handball und ich singe im Chor. Das ist manchmal stressig, weil ich dreimal pro Woche Training habe und am Donnerstag Chorprobe. Aber im Verein habe ich meine besten Freundinnen kennengelernt. Am Wochenende habe ich oft Spiele, deshalb schlafe ich fast nie aus."]
      - ["Ben", "Ich bin kein Vereinsmensch. In meiner Freizeit mache ich lieber spontan etwas: Ich fahre Skateboard, filme Videos mit meinem Handy und schneide sie am Computer. Meine Eltern sagen, ich sitze zu viel vor dem Bildschirm. Das stimmt vielleicht, aber beim Filmen bin ich ja draußen!"]
    questions:
      - ["In welchen Vereinen ist Marie?", "Im Handballverein und im Chor."]
      - ["Warum ist Maries Woche manchmal stressig?", "Sie hat dreimal pro Woche Training und am Donnerstag Chorprobe."]
      - ["Was macht Ben in seiner Freizeit?", "Er fährt Skateboard, filmt Videos und schneidet sie am Computer."]
      - ["Was sagen Bens Eltern?", "Er sitzt zu viel vor dem Bildschirm."]

