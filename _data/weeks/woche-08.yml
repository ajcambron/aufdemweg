week: 8
date: 2026-11-15
date_label: "Sonntag, 15. November 2026"
theme: "Freizeit & Hobbys"
cando:
  a1: "talk about my hobbies and say how often I do them"
  b1b2: "make plans with a partner and agree on a time, place and activity"
grammar_focus: "Frequency words after the verb: immer > oft > manchmal > selten > nie. Ich spiele oft Fußball."
ap:
  unit: "AP theme: Families and Communities / Contemporary Life (leisure)"
  mode: "Interpersonal speaking + writing (invitation and reply)"
  note: "Landeskunde climbs from a practice (Vereine) to a perspective (community and volunteering). The extension reads survey data."

builder:
  - title: "Meine Hobbys (My hobbies)"
    rows:
      - ["Ich spiele Fußball / Basketball / Gitarre / Videospiele.", "I play soccer / basketball / guitar / video games."]
      - ["Ich lese / zeichne / koche / tanze gern.", "I like to read / draw / cook / dance."]
      - ["Ich gehe gern schwimmen / ins Kino / shoppen.", "I like to go swimming / to the movies / shopping."]
      - ["Ich mache Sport / Musik / Fotos.", "I do sports / make music / take photos."]
      - ["immer / oft / manchmal / selten / nie", "always / often / sometimes / rarely / never"]
      - ["einmal / zweimal / dreimal pro Woche", "once / twice / three times a week"]
      - ["am Wochenende / nach der Schule", "on the weekend / after school"]
  - title: "Pläne machen (Making plans)"
    rows:
      - ["Hast du am Samstag Zeit?", "Are you free on Saturday?"]
      - ["Wollen wir ins Kino gehen?", "Shall we go to the movies?"]
      - ["Gute Idee! / Super, gern!", "Good idea! / Great, I'd love to!"]
      - ["Leider kann ich nicht. Ich muss ...", "Unfortunately I can't. I have to ..."]
      - ["Wann treffen wir uns? Um drei Uhr?", "When shall we meet? At three?"]
      - ["Wo treffen wir uns? Vor dem Kino.", "Where shall we meet? In front of the movie theater."]

