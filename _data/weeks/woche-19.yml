reading:
  a1:
    texts:
      - ["Emily", "Letzten Sommer bin ich mit meiner Familie nach Deutschland geflogen. Wir sind zwei Wochen geblieben. Zuerst haben wir meine Oma in Stuttgart besucht. Dann sind wir mit dem Zug nach München gefahren. Dort habe ich Brezeln gegessen und viele Fotos gemacht. Es war super!"]
      - ["Noah", "In den Winterferien bin ich mit meinem Vater nach Vermont gefahren. Wir sind sechs Stunden mit dem Auto gefahren. Das war langweilig! Aber dann sind wir drei Tage Ski gefahren. Am letzten Tag bin ich hingefallen, aber nur ein bisschen."]
    questions:
      - ["How did Emily get to Germany?", "By plane"]
      - ["Who did Emily visit in Stuttgart?", "Her grandma"]
      - ["How long was the car ride to Vermont?", "Six hours"]
      - ["What happened on Noah's last day?", "He fell (but only a little)."]
  b1:
    texts:
      - ["Leonie", "Nach dem Abitur bin ich mit meiner besten Freundin drei Wochen mit einem Interrail-Pass durch Europa gereist. Wir sind von Berlin über Prag und Wien bis nach Venedig gefahren. Wir haben in Jugendherbergen geschlafen und fast nur Brot und Käse gegessen, weil alles so teuer war. In Wien haben wir unseren Zug verpasst und mussten eine Nacht am Bahnhof bleiben. Trotzdem war es die beste Reise meines Lebens."]
      - ["Herr Schmitt", "Ich bin Lehrer und fahre jedes Jahr mit meiner Klasse auf Klassenfahrt. Letztes Jahr sind wir nach Hamburg gefahren, natürlich mit dem Zug. Wir haben eine Hafenrundfahrt gemacht, das Miniatur Wunderland besucht und abends in der Jugendherberge Karten gespielt. Die Schüler haben wenig geschlafen, und ich auch nicht!"]
    questions:
      - ["Wohin sind Leonie und ihre Freundin gefahren?", "Von Berlin über Prag und Wien bis nach Venedig."]
      - ["Warum haben sie fast nur Brot und Käse gegessen?", "Weil alles so teuer war."]
      - ["Was ist in Wien passiert?", "Sie haben ihren Zug verpasst und mussten eine Nacht am Bahnhof bleiben."]
      - ["Was hat die Klasse in Hamburg gemacht?", "Eine Hafenrundfahrt, das Miniatur Wunderland besucht und in der Jugendherberge Karten gespielt."]

