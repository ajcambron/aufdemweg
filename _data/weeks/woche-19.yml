extension:
  title: "Fliegen oder Zug fahren?"
  intro: "Lies den Text und die Tabelle (gerundete Beispielwerte). Dann beantworte die Fragen."
  text: "Von Berlin nach München kann man fliegen, mit dem Zug fahren oder mit dem Auto fahren. Das Flugzeug ist in der Luft am schnellsten, aber man muss zum Flughafen fahren und früh da sein. Der ICE fährt von Stadtmitte zu Stadtmitte und braucht etwa vier Stunden. Für das Klima ist der Zug viel besser: Er produziert pro Person nur einen kleinen Teil der Emissionen eines Flugs. Viele junge Leute sagen deshalb: Inlandsflüge sollte man verbieten. Andere finden: Jeder soll selbst entscheiden."
  table:
    head: ["Berlin → München", "Reisezeit (Tür zu Tür, ca.)", "CO2 pro Person (ca.)"]
    rows:
      - ["Flugzeug", "3,5 Stunden", "120 kg"]
      - ["Zug (ICE)", "4,5 Stunden", "10 kg"]
      - ["Auto (1 Person)", "7 Stunden", "90 kg"]
  questions:
    - ["Was ist der Vorteil vom Flugzeug?", "Es ist in der Luft am schnellsten (Tür zu Tür ca. 3,5 Stunden)."]
    - ["Wie lange braucht der ICE von Berlin nach München?", "Etwa vier Stunden (Tür zu Tür ca. 4,5 Stunden)."]
    - ["Welches Verkehrsmittel ist am besten für das Klima?", "Der Zug (ca. 10 kg CO2 pro Person)."]
    - ["Was fordern viele junge Leute?", "Inlandsflüge zu verbieten."]
  task: "Sollte man Inlandsflüge verbieten? Schreib 5–6 Sätze. Benutze eine Zahl aus der Tabelle und den Text (Laut Text ...)."

