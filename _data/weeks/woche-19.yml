week: 19
date: 2027-02-28
date_label: "Sonntag, 28. Februar 2027"
theme: "Reisen & Verkehrsmittel"
cando:
  a1: "say where I went, how I traveled and what I did"
  b1b2: "tell the story of a past trip in order and with details"
grammar_focus: "Perfekt: haben or sein + participle at the end (Ich habe Pizza gegessen. Ich bin nach Berlin gefahren.). Movement from A to B and bleiben take sein."
ap:
  unit: "AP theme: Global Contexts (travel, climate) / Contemporary Life"
  mode: "Interpersonal storytelling + source-based argument"
  note: "Telling events in order with cohesive devices (zuerst, dann, danach, am Ende) is AP skill 2.D (organization); the extension adds a short data-plus-text argument."

builder:
  - title: "Meine Reise (My trip)"
    rows:
      - ["Ich bin nach Berlin / nach Florida / ans Meer gefahren.", "I went to Berlin / to Florida / to the ocean."]
      - ["Ich bin mit dem Zug / mit dem Auto gefahren. Ich bin geflogen.", "I went by train / by car. I flew."]
      - ["Ich bin eine Woche geblieben.", "I stayed one week."]
      - ["Ich habe bei meiner Tante / im Hotel / im Zelt geschlafen.", "I slept at my aunt's / in a hotel / in a tent."]
      - ["Ich habe ein Museum besucht und viele Fotos gemacht.", "I visited a museum and took lots of photos."]
      - ["Ich habe ... gegessen / gesehen / gekauft.", "I ate / saw / bought ..."]
      - ["Es war super / langweilig / anstrengend.", "It was great / boring / exhausting."]
  - title: "Verkehrsmittel und Zeitwörter (Transportation and time words)"
    rows:
      - ["der Zug, das Flugzeug, das Auto, der Bus, das Schiff, das Fahrrad", "train, plane, car, bus, ship, bike"]
      - ["letzten Sommer / letztes Jahr / in den Ferien", "last summer / last year / during vacation"]
      - ["zuerst ... dann ... danach ... am Ende ...", "first ... then ... after that ... in the end ..."]
      - ["Wohin bist du gefahren? Was hast du gemacht?", "Where did you go? What did you do?"]
      - ["haben: gemacht, gespielt, gekauft, besucht, gegessen, gesehen", "have: done, played, bought, visited, eaten, seen"]
      - ["sein: gefahren, geflogen, gegangen, geblieben", "be: gone (traveled), flown, gone (walked), stayed"]

