page:
  modules:
    einstieg: "Trip photos: Bin ich mit dem Zug oder mit dem Auto gefahren?"
    input: "Sentence builder + narrow reading (Emily & Noah, Leonie & Herr Schmitt) + Achte auf die Form"
    kernaufgabe: "Zwei Wahrheiten, eine Lüge: travel edition"
    landeskunde: "Unterwegs mit der Bahn"
    energizer: "Kofferpacken (packing relay)"
    extension: "Fliegen oder Zug fahren? (data + short argument)"
    buffer: "Class travel map, or another round of the Kernaufgabe"
  einstieg: "Show 4–5 photos from a trip (your own, if you're willing, or stock photos). Narrate in short Perfekt sentences: *Ich bin nach ... gefahren. Ich habe das hier gesehen. Das habe ich gegessen!* Ask either/or questions: *Bin ich mit dem Zug oder mit dem Auto gefahren?* Students answer with one word."
  materials:
    - "Student packet, one per student"
    - "4–5 trip photos for the Einstieg"
  summary: "Zwei Wahrheiten, eine Lüge. Each student writes three Perfekt sentences about a trip, two true and one invented, and interviews a partner about their trip. Then, in groups of four, everyone reads their sentences while the others ask follow-up questions and guess the lie. A1/A2 build sentences from the Sentence Builder; B1/B2 add details to hide the lie and ask follow-ups in the Perfekt."
  note:
    type: note
    text: "Not every student has traveled far. A day trip, a visit to a relative's town or an invented trip all work. Say so when you introduce the task so nobody feels put on the spot."
  grammar: |
    **Perfekt: haben or sein + participle at the end.** It's the everyday way to talk about the past in conversation:

    > Ich **habe** Pizza **gegessen**. Wir **sind** nach Berlin **gefahren**.

    **Which helper?** Most verbs use *haben*. Verbs of moving from A to B (*fahren, fliegen, gehen, reisen, kommen*) and *bleiben* use *sein*.

    **The participle:**

    | Type | Pattern | Examples |
    | :--- | :--- | :--- |
    | Regular | ge- + stem + **-t** | machen → **gemacht**, spielen → **gespielt**, kaufen → **gekauft** |
    | Irregular | ge- + (changed) stem + **-en** | essen → **gegessen**, sehen → **gesehen**, fahren → **gefahren**, fliegen → **geflogen** |
    | No ge- | verbs starting with *be-, ver-*, or ending in *-ieren* | besuchen → **besucht**, verpassen → **verpasst**, fotografieren → **fotografiert** |

    Treat irregular participles as vocabulary; the Sentence Builder has the ones this week needs.
  achtung: "**What students will do:** use *haben* with movement verbs: *„Ich habe nach Berlin gefahren.“* Restate it (*„Ah, du bist nach Berlin gefahren!“*) and keep the story going. The Achte-auf-die-Form items contain no time words like *gestern* or *letzten Sommer*, so students must notice *habe / bin* + participle to know it already happened. That's the form-meaning link this week builds."
  b2: "**If a B2 asks:** *sein* and *haben* usually appear in the simple past even in conversation (*Es war super. Ich hatte keine Zeit.*). Written stories use the Präteritum, like the St. Martin legend in Week 9. The CO2 figures in the extension are rounded example values, not official numbers."
  vocab_extra:
    - ["die Jugendherberge", "youth hostel"]
    - ["die Klassenfahrt", "class trip"]
    - ["verpassen", "to miss (a train)"]
    - ["der Flughafen", "airport"]
    - ["der Inlandsflug", "domestic flight"]
    - ["mitnehmen", "to take along"]
