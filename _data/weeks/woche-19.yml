task:
  title: "Zwei Wahrheiten, eine Lüge (two truths and a lie: travel edition)"
  format: "Partner interview, then groups of four"
  directions: "Think of a trip: a vacation, a day trip, a visit to relatives. Write three Perfekt sentences about it: two true, one invented. Then interview your partner about their trip with the questions below and take notes. Finally, in groups of four, everyone reads their three sentences; the others each ask one follow-up question and guess which sentence is the lie."
  a1: "Build your sentences from the Sentence Builder: Ich bin nach ... gefahren. Ich habe ... gegessen."
  b1: "Make your lie hard to spot by adding a detail to every sentence (wann, mit wem, warum). Ask your follow-up questions in the Perfekt: Was hast du dort gegessen?"
  tables:
    - title: "Interview: die Reise von meinem Partner / meiner Partnerin"
      head: ["Frage", "Antwort"]
      rows:
        - ["Wohin bist du gefahren?", ""]
        - ["Mit wem bist du gefahren?", ""]
        - ["Womit bist du gefahren?", ""]
        - ["Wo hast du geschlafen?", ""]
        - ["Was hast du gemacht / gesehen / gegessen?", ""]
        - ["Wie war es?", ""]
    - title: "Meine drei Sätze (2 wahr, 1 gelogen)"
      head: ["#", "Satz"]
      rows:
        - ["1", ""]
        - ["2", ""]
        - ["3", ""]
    - title: "Wir raten (our guesses)"
      head: ["Name", "Die Lüge ist Satz ..."]
      blank: 3

output:
  a1: "Write a postcard about a trip, real or imagined, with four Perfekt sentences: where you went, how, what you did, and how it was. Read it to a partner. They ask one question: Hast du auch ... ?"
  b1: "Write a short travel-blog post (6–8 sentences) telling a trip in order with zuerst, dann, danach and am Ende. Include one thing that went wrong. Your partner reads it and comments with one question and one tip for next time."

landeskunde:
  title: "Unterwegs mit der Bahn"
  text: |
    Germans travel a lot: by law, full-time workers get at least 20 vacation days a year, and 25–30 is common. For trips inside Germany and across Europe, many people take the train. The national railway, Deutsche Bahn, runs fast ICE trains between big cities, and a monthly Deutschlandticket covers every local and regional bus, streetcar and train in the whole country. Young Europeans often travel through many countries on one Interrail pass and sleep in youth hostels (Jugendherbergen); the world's first permanent youth hostel opened in Germany in 1912.

    The trains aren't perfect. Delays are a running joke, and the Bahn's punctuality is a national complaint. But for many Germans, the train is the normal, and greener, way to get somewhere.
  warum: "Germany built the first youth hostel and gives young people cheap ways to travel on their own. Why might a society want its teenagers to travel independently?"
  vergleich: "How do families in the US usually travel on vacation? What would change if trains were as common here as in Germany?"

