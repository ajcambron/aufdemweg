week: 3
date: 2026-10-11
date_label: "Sonntag, 11. Oktober 2026"
theme: "Familie"
cando:
  a1: "name my family members and give their ages"
  b1b2: "describe relationships with family members and give reasons"
grammar_focus: "Possessives: mein / meine; masculine nouns as object take meinen (Ich finde meinen Bruder lustig). Same pattern for dein, sein, ihr."
ap:
  unit: "AP theme: Families and Communities"
  mode: "Interpersonal listening task + 40-second cultural comparison"
  note: "AP Unit 1 is Families and Communities. The extension's spoken comparison of family life is a direct rehearsal of the AP Project Q&A's cultural-comparison move."

builder:
  - title: "Meine Familie (My family)"
    rows:
      - ["Es gibt ... Personen in meiner Familie.", "There are ... people in my family."]
      - ["meine Mutter / mein Vater / meine Eltern", "my mother / my father / my parents"]
      - ["meine Schwester / mein Bruder / meine Geschwister", "my sister / my brother / my siblings"]
      - ["meine Oma (Großmutter) / mein Opa (Großvater)", "my grandma / my grandpa"]
      - ["meine Tante / mein Onkel · meine Kusine / mein Cousin", "my aunt / my uncle · my cousin (f / m)"]
      - ["Sie / Er ist ... Jahre alt.", "She / He is ... years old."]
      - ["Ich verstehe mich (nicht so) gut mit meinem Bruder / meiner Schwester ... [B1/B2]", "I get along (not so) well with my brother / sister ..."]
      - ["..., weil er / sie lustig / nett / nervig ist.", "..., because he / she is funny / nice / annoying."]
  - title: "mein, meine, meinen"
    rows:
      - ["Das ist mein Bruder / mein Kind / meine Schwester / meine Eltern.", "This is my brother / my child / my sister / my parents."]
      - ["Ich habe einen Bruder und eine Schwester.", "I have a brother and a sister."]
      - ["Ich finde meinen Bruder lustig. (der-word as object → meinen)", "I find my brother funny."]
      - ["Ich finde meine Schwester nett. (die-word: no change)", "I find my sister nice."]
      - ["dein / deine / deinen · sein (his) · ihr (her)", "your (same pattern) · his · her"]
      - ["mit meinem Bruder / mit meiner Schwester [B1/B2]", "with my brother / with my sister"]

