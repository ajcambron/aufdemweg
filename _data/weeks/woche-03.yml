task:
  title: "Familienbaum (draw the family tree you hear)"
  format: "Partner information gap, listening"
  directions: "Partner A describes their family (real or invented; a celebrity family works too) out loud in German, one person at a time. Partner B draws and labels a family tree on blank paper based only on what they hear. Don't show your paper! When you're done, compare the drawing with the real family and fix any mistakes. Then switch roles."
  a1: "Names and ages only: Meine Mutter heißt Lisa. Sie ist 42 Jahre alt."
  b1: "Add one relationship comment per person: Ich verstehe mich gut / nicht so gut mit ..., weil ..."
  tables:
    - title: "Notizen (notes while you listen)"
      head: ["Person", "Name", "Alter", "Kommentar (B1/B2)"]
      blank: 6

output:
  a1: "Write four sentences about your family (real or invented): Es gibt ___ Personen in meiner Familie. Mein / Meine ___ heißt ___. Er / Sie ist ___ Jahre alt. Read them to a partner, who asks one question: Wie alt ist dein / deine ...?"
  b1: "Write a short paragraph (5–6 sentences) about how you get along with your family, with at least two weil-clauses. Your partner reads it and asks one follow-up question about one person."

landeskunde:
  title: "Geschwister, Stiefgeschwister, Patchwork-Familie"
  text: |
    German has an everyday word English lacks: Geschwister means "brothers and sisters" all together. (English has "siblings," but almost nobody says it at dinner.) Blended families have their own vocabulary too: Stiefmutter / Stiefvater (stepmother / stepfather), Halbbruder / Halbschwester (half-brother / half-sister), and Patchwork-Familie, a casual modern term for a blended family, borrowed straight from the English word "patchwork."

    German families have also become smaller: one or two children is typical, and many grandparents live far away. But the weekend still matters. Sunday afternoon Kaffee und Kuchen with relatives (Week 7) is a standard family ritual.
  warum: "When a language makes a casual, positive word like Patchwork-Familie common, what does that say about how society sees blended families?"
  vergleich: "Which words does English use for blended families? Are they as everyday as Patchwork-Familie, and do they sound as neutral?"

exit:
  a1: "Ich kann meine Familienmitglieder nennen und ihr Alter sagen."
  b1: "Ich kann Beziehungen in meiner Familie beschreiben und begründen."

energizer:
  title: "Wer bin ich? (family guessing game)"
  text: "Tape a family-word card (Mutter, Bruder, Opa, Kusine ...) to each student's back without them seeing it. Students circulate asking yes/no questions in German (Bin ich männlich? Bin ich älter als du? Bin ich deine Mutter?) until they guess their card."

extension:
  title: "Familie heute in Deutschland"
  intro: "Lies den Text und beantworte die Fragen."
  text: "Die Familie sieht in Deutschland heute anders aus als vor fünfzig Jahren. Viele Familien sind kleiner: Ein Kind oder zwei Kinder sind heute normal. Auch Patchwork-Familien sind keine Seltenheit mehr. Trotzdem bleibt die Familie für die meisten Deutschen sehr wichtig: Viele Familien treffen sich zum Kaffee am Sonntag oder verbringen die Feiertage zusammen."
  questions:
    - ["Wie hat sich die deutsche Familie verändert?", "Viele Familien sind kleiner, und Patchwork-Familien sind häufiger."]
    - ["Was ist eine Patchwork-Familie?", "Eine Familie mit Stiefeltern oder Halb- und Stiefgeschwistern."]
    - ["Was machen viele deutsche Familien am Sonntag?", "Sie treffen sich zum Kaffee."]
    - ["Ist Familie für dich auch wichtig? Warum (nicht)?", "Open answer."]
  task: "Kulturvergleich, 40 Sekunden, mündlich: Wie sieht Familie in deiner Kultur oder in deiner Familie aus? Vergleiche mit dem Text über Deutschland. Benutze auch, aber und im Gegensatz zu."

buffer: "A gallery walk of the finished family trees, or a family-photo show-and-tell (real or invented family) with Das ist mein / meine ..."

page:
  modules:
    einstieg: "The instructor's family chart: Wer ist das?"
    input: "Sentence builder + narrow reading (Noah & Zoe, Finn & Ava) + Achte auf die Form"
    kernaufgabe: "Familienbaum: draw the family tree you hear"
    landeskunde: "Geschwister, Stiefgeschwister, Patchwork-Familie"
    energizer: "Wer bin ich? (family guessing game)"
    extension: "Familie heute in Deutschland + 40-second cultural comparison"
    buffer: "Gallery walk, or a family-photo show-and-tell"
  einstieg: "Draw your own family tree on the board (real or invented) and walk through it slowly: *Das ist meine Mutter. Sie heißt ... Sie ist ... Jahre alt.* Then ask either/or questions: *Ist das mein Bruder oder mein Vater?* Students answer with one word. This is the input the readings and the task build on."
  materials:
    - "Student packet, one per student"
    - "Blank paper for the family-tree drawing, one sheet per student"
  summary: "Familienbaum. Partner A describes their family out loud, one person at a time. Partner B draws and labels a family tree from what they hear, without looking at A's paper. They compare, fix mistakes, then switch. A1/A2 give names and ages; B1/B2 add one relationship comment per person (*Ich verstehe mich gut mit meiner Schwester, weil sie lustig ist*)."
  note:
    type: note
    text: "Students may describe an **invented or celebrity family** instead of their own. Say this out loud when you introduce the task. Some students won't want to map their real family for a partner, and the language practice is identical either way."
  grammar: |
    **Possessives: *mein, meine, meinen*.** Which form depends on the noun's gender and its job in the sentence.

    | | der-words (masculine) | das-words (neuter) | die-words (feminine, plural) |
    | :--- | :--- | :--- | :--- |
    | Subject: *Das ist ...* | **mein** Vater | **mein** Kind | **meine** Mutter, **meine** Eltern |
    | Object: *Ich habe / finde ...* | **meinen** Vater | **mein** Kind | **meine** Mutter, **meine** Eltern |

    The only form that changes is the masculine one: *mein* becomes *meinen* when the person is the object of the verb. *Mein Bruder ist 12. Ich finde **meinen** Bruder nervig.* The same goes for *dein, sein, ihr*.

    B1/B2 also meet **mit + dative** as a fixed phrase: *Ich verstehe mich gut mit **meinem** Bruder / mit **meiner** Schwester.* Teach it as a chunk; the dative comes later (Week 13).
  achtung: "**What students will do:** say *„Ich habe mein Bruder.“* At A1 let it go; the meaning is clear and the ending comes with more input. The Achte-auf-die-Form items show why the ending matters: in *„Meinen Bruder findet mein Vater lustig“*, only *meinen* tells you that Dad is the one doing the finding. Also watch for overuse right after the lesson: *„meinen Schwester“*. Only der-words change."
  b2: "**If a B2 asks:** in *Es gibt vier Personen: meine Mutter, meinen Vater ...* the list is the object of *es gibt*, so *meinen* is correct there. *Mit* always takes the dative (*mit meinem, mit meiner, mit meinen Eltern*)."
  vocab_extra:
    - ["die Stiefmutter / der Stiefvater", "stepmother / stepfather"]
    - ["der Halbbruder / die Halbschwester", "half-brother / half-sister"]
    - ["die Patchwork-Familie", "blended family"]
    - ["streiten", "to argue"]
