reading:
  a1:
    texts:
      - ["Noah", "Ich heiße Noah. Es gibt vier Personen in meiner Familie: meine Mutter, meinen Vater, meine Schwester und mich. Meine Schwester heißt Ella. Sie ist zehn Jahre alt. Mein Vater heißt Mark."]
      - ["Zoe", "Ich heiße Zoe. In meiner Familie gibt es drei Personen: meine Mutter, meinen Bruder und mich. Mein Bruder heißt Sam. Er ist acht Jahre alt. Ich habe auch eine Oma und einen Opa in Florida."]
    questions:
      - ["How many people are in Noah's family?", "Four"]
      - ["How old is Ella?", "Ten"]
      - ["What is Zoe's brother's name?", "Sam"]
      - ["Where do Zoe's grandparents live?", "In Florida"]
  b1:
    texts:
      - ["Finn", "Ich heiße Finn. Meine Familie besteht aus fünf Personen: meinen Eltern, meinen zwei Schwestern und mir. Ich verstehe mich sehr gut mit meiner älteren Schwester, weil sie mir bei den Hausaufgaben hilft und weil wir dieselben Hobbys haben. Mit meiner kleinen Schwester streite ich manchmal, aber sie ist trotzdem lustig."]
      - ["Ava", "Ich heiße Ava. Ich habe keine Geschwister, aber viele Cousinen und Cousins! Meine Tante und mein Onkel wohnen nur zehn Minuten von uns entfernt, deshalb sehe ich meine Kusine Mia fast jedes Wochenende. Ich verstehe mich super mit ihr, weil sie wie eine Schwester für mich ist."]
    questions:
      - ["Warum versteht sich Finn gut mit seiner älteren Schwester?", "Weil sie ihm bei den Hausaufgaben hilft und weil sie dieselben Hobbys haben."]
      - ["Wie viele Personen sind in Finns Familie?", "Fünf."]
      - ["Warum sieht Ava ihre Kusine so oft?", "Weil ihre Tante und ihr Onkel nur zehn Minuten entfernt wohnen."]
      - ["Wie beschreibt Ava ihre Beziehung zu Mia?", "Sie versteht sich super mit ihr; Mia ist wie eine Schwester für sie."]

structured_input:
  ref:
    directions: "Lies genau: mein oder meinen? Wer macht was? (Who does what?)"
    items:
      - ["Mein Bruder findet meinen Vater lustig.", "Bruder → Vater", ["Bruder → Vater", "Vater → Bruder"]]
      - ["Meinen Bruder findet mein Vater lustig.", "Vater → Bruder", ["Bruder → Vater", "Vater → Bruder"]]
      - ["Meinen Opa ruft meine Kusine jeden Sonntag an.", "Kusine → Opa", ["Opa → Kusine", "Kusine → Opa"]]
      - ["Mein Onkel besucht meinen Cousin.", "Onkel → Cousin", ["Onkel → Cousin", "Cousin → Onkel"]]
      - ["Meinen Onkel besucht mein Cousin.", "Cousin → Onkel", ["Onkel → Cousin", "Cousin → Onkel"]]
  aff:
    directions: "Wie ist es in deiner Familie?"
    options: ["Stimmt", "Stimmt nicht"]
    items:
      - "Ich verstehe mich gut mit meinen Eltern."
