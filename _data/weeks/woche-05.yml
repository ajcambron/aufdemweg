reading:
  a1:
    texts:
      - ["Ethan", "Es ist Herbst. Es ist kühl und windig. Die Blätter sind bunt: rot, orange und gelb. Ich trage einen Pullover. Meine Lieblingsjahreszeit ist der Herbst."]
      - ["Lily", "Heute regnet es. Es ist kalt und grau. Im Herbst esse ich gern Kürbissuppe. Ich mag den Herbst, aber der Sommer ist meine Lieblingsjahreszeit."]
    questions:
      - ["What's the weather like for Ethan?", "Cool and windy"]
      - ["What does Ethan wear?", "A sweater"]
      - ["What does Lily like to eat in the fall?", "Pumpkin soup"]
      - ["What is Lily's favorite season?", "Summer"]
  b1:
    texts:
      - ["Marlene", "Meine Lieblingsjahreszeit ist der Herbst, weil das Wetter mild ist und die Blätter so schön bunt sind. Am ersten Sonntag im Oktober feiern wir in Deutschland das Erntedankfest: Man dankt für die Ernte des Jahres, für Getreide, Obst und Gemüse. In manchen Dörfern gibt es sogar eine Erntekrone aus Getreide, die geschmückt und durch das Dorf getragen wird."]
      - ["Jayden", "Wenn es im Herbst kalt und regnerisch wird, bleibe ich am liebsten zu Hause und trinke heißen Kakao. Ich finde es interessant, dass die Deutschen ihr Erntedankfest schon Anfang Oktober feiern, während wir Thanksgiving erst Ende November feiern. Beide Feste drehen sich aber um dasselbe: Dankbarkeit für die Ernte und die Familie."]
    questions:
      - ["Wann feiert man in Deutschland Erntedank?", "Am ersten Sonntag im Oktober."]
      - ["Was ist eine Erntekrone?", "Eine geschmückte Krone aus Getreide, die durch das Dorf getragen wird."]
      - ["Was ist laut Jayden der Unterschied zwischen Erntedank und Thanksgiving?", "Erntedank ist Anfang Oktober, Thanksgiving erst Ende November."]
      - ["Was haben beide Feste gemeinsam?", "Dankbarkeit für die Ernte und die Familie."]

