builder:
  - title: "Herbstwetter & Erntedank (Fall weather & harvest festival)"
    rows:
      - ["Es ist kalt / kühl / mild / windig / neblig / sonnig / regnerisch / wolkig.", "It's cold / cool / mild / windy / foggy / sunny / rainy / cloudy."]
      - ["Es regnet. / Die Blätter fallen. / Die Blätter sind bunt.", "It's raining. / The leaves are falling. / The leaves are colorful."]
      - ["der Frühling / der Sommer / der Herbst / der Winter", "spring / summer / fall / winter"]
      - ["im Herbst ...", "in the fall ..."]
      - ["die Ernte / ernten / das Erntedankfest", "the harvest / to harvest / the harvest festival"]
      - ["Wenn es kalt ist, trage ich einen Pullover. [B1/B2]", "When it's cold, I wear a sweater."]
      - ["Meine Lieblingsjahreszeit ist ..., weil ... [B1/B2]", "My favorite season is ..., because ..."]
  - title: "Wetter-Wörter (Weather words)"
    rows:
      - ["Wie ist das Wetter?", "What's the weather like?"]
      - ["Es sind 15 Grad.", "It's 15 degrees (Celsius)."]
      - ["Mir ist kalt. / Mir ist warm.", "I feel cold. / I feel warm."]
      - ["der Regen / der Wind / der Nebel / die Sonne", "rain / wind / fog / sun"]
      - ["der Kürbis / der Apfel / die Kürbissuppe", "pumpkin / apple / pumpkin soup"]
      - ["die Erntekrone", "harvest crown"]

