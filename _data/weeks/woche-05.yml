landeskunde:
  title: "Erntedankfest: das Erntefest in Deutschland"
  text: |
    Erntedankfest usually falls on the first Sunday in October, about seven weeks before American Thanksgiving. It grew out of church services thanking God for the year's crops. Churches are decorated with fruit, vegetables, grain and bread, and many villages still build an Erntekrone (harvest crown) woven from grain and carry it through town in a procession. Afterward, the food is often donated.

    Unlike Thanksgiving, Erntedank isn't built around a big family meal. It's more of a church and village tradition, a public "thank you" rather than a private dinner. Keep this comparison in mind: Week 9 comes back to it, right before American Thanksgiving.
  warum: "Erntedank is mostly a church and village festival; Thanksgiving is mostly a family meal. What does each say about who people thank, and with whom they celebrate?"
  vergleich: "What does your family do in the fall? Which matters most in your traditions: community, faith or the family meal?"

exit:
  a1: "Ich kann das Wetter beschreiben und die Jahreszeiten nennen."
  b1: "Ich kann Erntedank erklären und mit Thanksgiving vergleichen."

energizer:
  title: "Wetter-Pantomime"
  text: "Act out a weather condition or a season without speaking: shivering for kalt, fanning yourself for heiß, rain fingers for Es regnet. Classmates guess and call out the German phrase. Whoever guesses first acts next."

extension:
  title: "Erntedank und Thanksgiving: ein Vergleich"
  intro: "Lies den Text. Dann beantworte die Fragen und schreib einen Vergleich."
  text: |
    Erntedank: am ersten Sonntag im Oktober. In der Kirche liegen Obst, Gemüse und Brot vor dem Altar. In manchen Dörfern trägt man eine Erntekrone durch die Straßen. Oft spendet man die Lebensmittel danach an Menschen, die wenig haben.

    Thanksgiving: am vierten Donnerstag im November. Die Familie kommt zusammen und isst Truthahn, Kartoffelbrei und Kürbiskuchen. Viele sagen vor dem Essen, wofür sie dankbar sind. Am Nachmittag schauen viele Football.
  questions:
    - ["Wann feiert man Erntedank, und wann feiert man Thanksgiving?", "Erntedank am ersten Sonntag im Oktober, Thanksgiving am vierten Donnerstag im November."]
    - ["Wo feiert man Erntedank vor allem? Und Thanksgiving?", "Erntedank vor allem in der Kirche und im Dorf, Thanksgiving vor allem zu Hause mit der Familie."]
    - ["Was passiert mit den Lebensmitteln an Erntedank?", "Man spendet sie oft an Menschen, die wenig haben."]
    - ["Welches Fest gefällt dir besser? Warum?", "Open answer."]
  task: "Schreib einen Vergleich (6–8 Sätze). Benutze mindestens drei dieser Wörter: beide, während, aber, im Gegensatz zu, auch. Beispiel: Während man an Erntedank in die Kirche geht, isst man an Thanksgiving zu Hause."

buffer: "A Kürbis / Apfel vocabulary mini-lesson with real pumpkins and apples if available, or extra survey rounds with new classmates."

page:
  modules:
    einstieg: "Weather window check + fall photos"
    input: "Sentence builder + narrow reading (Ethan & Lily, Marlene & Jayden) + Achte auf die Form"
    kernaufgabe: "Erntedank-Umfrage: the harvest survey"
    landeskunde: "Erntedankfest: Germany's harvest festival"
    energizer: "Wetter-Pantomime"
    extension: "Erntedank und Thanksgiving: a written comparison"
    buffer: "Pumpkin and apple realia, or more survey rounds"
  einstieg: "Look out the window: *Wie ist das Wetter heute? Ist es kalt oder warm? Regnet es?* Then show three photos (fall leaves, a snowy street, a beach) and ask *Welche Jahreszeit ist das?* Students answer with one word. Mime *Mir ist kalt* with a shiver; they'll meet it in the Achte-auf-die-Form items."
  materials:
    - "Student packet, one per student (the tally sheet is in it)"
    - "Three season photos for the Einstieg"
    - "Pumpkin or apple realia for the buffer (optional)"
  summary: "Erntedank-Umfrage. Students circulate and ask at least six classmates two questions: favorite season, and what they like to eat in the fall. They keep tally marks, then the class totals the results and announces the winners. B1/B2 ask *Warum?* and note one reason per answer."
  note:
    type: note
    text: "Week 9 (Dankbarkeit & Traditionen) builds on this week's Erntedank material. Keep the survey results if you can; they make a good Week 9 warm-up."
  grammar: |
    **Weather uses *es*.** Two patterns:

    - *Es ist* + adjective: *Es ist kalt / kühl / windig / sonnig / neblig.*
    - *Es* + a weather verb: *Es **regnet**. Es **schneit**.*

    **Seasons are all masculine** and take *im* for "in": *im Herbst, im Winter, im Frühling, im Sommer.*

    **B1/B2: *wenn* + verb to the end.** Same word order as *weil* from Week 1: *Wenn es kalt **ist**, ...* When the *wenn*-clause comes first, the next clause starts with its verb: *Wenn es kalt ist, **trage** ich einen Pullover.* You get verb, comma, verb.
  achtung: "**What students will do:** mix the two patterns into *„Es ist regnen.“* Answer with the verb: *„Ja, es regnet!“* The other classic: *„Ich bin kalt“* means \"I'm a cold person.\" To say you feel cold, it's ***Mir ist kalt.*** That one changes meaning, so it's in the Achte-auf-die-Form items, along with *wenn* meaning \"whenever.\""
  b2: "**If a B2 asks:** *wenn* means both \"when\" and \"whenever\" (present and repeated events); for a single event in the past, German uses *als* (*Als ich klein war ...*). *Mir ist kalt* uses the dative, like *Mir gefällt* in Week 25."
  vocab_extra:
    - ["die Jahreszeit", "season"]
    - ["das Getreide", "grain"]
    - ["spenden", "to donate"]
    - ["die Kirche", "church"]
