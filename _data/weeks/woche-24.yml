reading:
  a1:
    texts:
      - ["Nina", "Ich heiße Nina und ich bin sechzehn. Ich möchte Tierärztin werden. Ich arbeite gern mit Tieren, und ich bin gut in Biologie. Ich habe zwei Katzen und einen Hund. Nach der Schule werde ich Tiermedizin studieren."]
      - ["Malik", "Ich heiße Malik. Mein Vater ist Koch, und ich koche auch sehr gern. Ich möchte nicht studieren. Ich möchte eine Ausbildung als Koch machen und später ein eigenes Restaurant haben. Mein Lieblingsessen ist natürlich Papas Lasagne!"]
    questions:
      - ["What does Nina want to become?", "A veterinarian"]
      - ["Why does that job fit her?", "She likes working with animals and is good at biology."]
      - ["What does Malik's father do?", "He's a cook."]
      - ["What does Malik want to do after school?", "An apprenticeship as a cook, and later open his own restaurant"]
  b1:
    texts:
      - ["Herr Wolf", "Ich bilde bei einer Autofirma in Ingolstadt junge Leute zu Mechatronikern aus. Die Ausbildung dauert dreieinhalb Jahre. Die Azubis sind drei bis vier Tage pro Woche im Betrieb und ein bis zwei Tage in der Berufsschule. Sie verdienen schon während der Ausbildung Geld, im ersten Jahr etwa 1.100 Euro im Monat. Viele bleiben nach der Ausbildung bei uns."]
      - ["Lena", "Ich habe nach dem Abitur zuerst ein Freiwilliges Soziales Jahr in einem Krankenhaus gemacht. Das war die beste Entscheidung: Danach wusste ich genau, dass ich Ärztin werden will. Jetzt studiere ich Medizin in Heidelberg. Das Studium kostet fast nichts, weil es in Deutschland keine hohen Studiengebühren gibt. Aber es ist sehr schwer, einen Studienplatz zu bekommen."]
    questions:
      - ["Wie lange dauert die Ausbildung zum Mechatroniker?", "Dreieinhalb Jahre."]
      - ["Wo lernen die Azubis?", "Drei bis vier Tage pro Woche im Betrieb und ein bis zwei Tage in der Berufsschule."]
      - ["Was hat Lena nach dem Abitur zuerst gemacht?", "Ein Freiwilliges Soziales Jahr in einem Krankenhaus."]
      - ["Warum kostet ihr Studium fast nichts?", "Weil es in Deutschland keine hohen Studiengebühren gibt."]

