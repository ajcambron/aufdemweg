week: 24
date: 2027-04-11
date_label: "Sonntag, 11. April 2027"
theme: "Berufe & Zukunftspläne"
cando:
  a1: "name jobs and say what I'd like to become"
  b1b2: "talk about my plans after school and compare career paths in Germany and the US"
grammar_focus: "Jobs take no article: Ich bin Schüler. Ich möchte Ärztin werden. Female forms add -in (Lehrer → Lehrerin). Future with werden (Week 12): Ich werde studieren."
ap:
  unit: "AP theme: Contemporary Life (education and careers)"
  mode: "Interpersonal interview + formal email (Sie-Form)"
  note: "Landeskunde climbs from a practice (the Ausbildung) to a perspective (practical skills earn respect), with a direct comparison to US career and technical education."

builder:
  - title: "Berufe (Jobs)"
    rows:
      - ["der Arzt / die Ärztin", "doctor (m / f)"]
      - ["der Lehrer / die Lehrerin", "teacher"]
      - ["der Ingenieur / die Ingenieurin", "engineer"]
      - ["der Koch / die Köchin", "cook, chef"]
      - ["der Krankenpfleger / die Krankenpflegerin", "nurse"]
      - ["der Mechatroniker / die Mechatronikerin", "mechatronics technician"]
      - ["der Grafikdesigner / die Grafikdesignerin", "graphic designer"]
  - title: "Meine Zukunft (My future)"
    rows:
      - ["Ich bin Schüler / Schülerin.", "I'm a student (m / f)."]
      - ["Ich möchte Ärztin / Koch werden.", "I'd like to become a doctor / a cook."]
      - ["Ich arbeite gern mit Menschen / mit Tieren / mit Computern.", "I like working with people / animals / computers."]
      - ["Nach der Schule werde ich studieren / eine Ausbildung machen.", "After school I'll go to college / do an apprenticeship."]
      - ["Ich bin kreativ / praktisch / geduldig / gut in Mathe.", "I'm creative / practical / patient / good at math."]
      - ["Für mich ist wichtig, dass ... [B1/B2]", "For me it's important that ..."]

