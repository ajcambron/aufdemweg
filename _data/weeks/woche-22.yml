week: 22
date: 2027-03-21
date_label: "Sonntag, 21. März 2027"
theme: "Ostern"
cando:
  a1: "say where something is hidden and describe Easter traditions"
  b1b2: "express wishes and hypothetical plans with the Konjunktiv II"
grammar_focus: "A1/A2: Wo ist das Ei? + dative (unter dem Stuhl, hinter der Tür, im Regal). B1/B2: wishes with Konjunktiv II (Ich hätte gern ... Ich würde gern ... Wenn ich Zeit hätte, würde ich ...)."
ap:
  unit: "AP theme: Families and Communities (celebrations) / Language and Culture"
  mode: "Interpersonal task + presentational writing (wishes)"
  note: "The Landeskunde links a German product (the Osterhase) to an American practice, a real cross-cultural connection students can use in an AP cultural comparison."

builder:
  - title: "Ostern (Easter)"
    rows:
      - ["der Osterhase / das Osterei / das Osternest", "Easter bunny / Easter egg / Easter basket"]
      - ["Wir bemalen Eier. Wir suchen Eier.", "We paint eggs. We look for eggs."]
      - ["Der Osterhase versteckt die Eier.", "The Easter bunny hides the eggs."]
      - ["das Osterfeuer / der Osterbrunnen", "Easter bonfire / decorated Easter fountain"]
      - ["Karfreitag, Ostersonntag, Ostermontag", "Good Friday, Easter Sunday, Easter Monday"]
      - ["Frohe Ostern!", "Happy Easter!"]
  - title: "Wo ist das Ei? + Wünsche (Where is the egg? + Wishes)"
    rows:
      - ["Das Ei ist unter dem Stuhl / hinter der Tür / neben dem Fenster.", "The egg is under the chair / behind the door / next to the window."]
      - ["Das Ei liegt im Regal / auf dem Tisch / zwischen den Büchern.", "The egg is on the shelf / on the table / between the books."]
      - ["Warm! Kalt! Heiß!", "Warm! Cold! Hot! (closer / farther / very close)"]
      - ["Ich hätte gern ... [B1/B2]", "I would like (to have) ..."]
      - ["Ich würde gern ... [B1/B2]", "I would like to ..."]
      - ["Wenn ich Zeit hätte, würde ich ... [B1/B2]", "If I had time, I would ..."]

