reading:
  a1:
    texts:
      - ["Lotta", "Ich heiße Lotta. An Ostern bemalen wir am Samstag Eier. Am Sonntagmorgen versteckt der Osterhase die Eier im Garten. Meine kleine Schwester und ich suchen sie. Letztes Jahr war ein Ei im Blumentopf und ein Ei unter der Bank! Dann frühstücken wir alle zusammen."]
      - ["Jakob", "Ich heiße Jakob und ich wohne in Schleswig-Holstein, im Norden. Bei uns gibt es am Ostersamstag ein großes Osterfeuer. Das ganze Dorf kommt zusammen. Wir essen Würstchen und schauen ins Feuer. Das Feuer sagt: Der Winter ist vorbei, der Frühling kommt!"]
    questions:
      - ["When does Lotta's family paint eggs?", "On Saturday"]
      - ["Where were two of the eggs last year?", "In a flower pot and under the bench"]
      - ["What happens in Jakob's village on Easter Saturday?", "There's a big Easter bonfire, and the whole village comes."]
      - ["What does the fire mean?", "Winter is over and spring is coming."]
  b1:
    texts:
      - ["Frau Heller", "In meinem Dorf in der Fränkischen Schweiz schmücken wir vor Ostern den Brunnen mit Tausenden bunten Eiern und grünen Zweigen. Das ist eine alte Tradition: Wasser war hier oben früher sehr kostbar. Heute kommen viele Touristen mit dem Bus, um die Osterbrunnen zu sehen. Ich würde mir wünschen, dass sie ein bisschen länger bleiben und nicht nur Fotos machen."]
      - ["Laura", "In Zürich gibt es am Ostermontag einen lustigen Brauch: das Zwänzgerle. Kinder halten ein gekochtes, bemaltes Ei in der Hand, und Erwachsene versuchen, eine Münze so zu werfen, dass sie im Ei stecken bleibt. Klappt es, bekommt der Erwachsene das Ei. Wenn nicht, darf das Kind die Münze behalten. Als Kind habe ich so viel Geld verdient!"]
    questions:
      - ["Womit schmückt man die Brunnen in der Fränkischen Schweiz?", "Mit bunten Eiern und grünen Zweigen."]
      - ["Warum gibt es diese Tradition?", "Weil Wasser dort früher sehr kostbar war."]
      - ["Was wünscht sich Frau Heller von den Touristen?", "Dass sie länger bleiben und nicht nur Fotos machen."]
      - ["Wer bekommt beim Zwänzgerle das Ei?", "Der Erwachsene, wenn die Münze im Ei stecken bleibt."]

