task:
  title: "Ostereiersuche mit Hinweisen (egg hunt with clues)"
  format: "Pairs: hide, write clues, swap"
  directions: "Each pair gets three paper eggs. Hide them in the room and write one clue per egg with a preposition: Das Ei ist unter dem Stuhl neben der Tür. Swap clue sheets with another pair, find their eggs and record where each one was. Stuck? Ask Ist es warm oder kalt? The pair who hid the eggs answers Warm! / Kalt! / Heiß!"
  a1: "Use the preposition bank: one preposition per clue."
  b1: "Stack two prepositions per clue (Das Ei ist hinter dem Buch im Regal neben der Tür.) and give warm/cold hints as full sentences: Du bist ganz nah! Du bist zu weit links!"
  tables:
    - title: "Präpositionen-Bank (Wo? → dative)"
      head: ["Präposition", "der / das-Wort", "die-Wort"]
      rows:
        - ["in", "im Regal", "in der Tasche"]
        - ["auf", "auf dem Tisch", "auf der Fensterbank"]
        - ["unter", "unter dem Stuhl", "unter der Bank"]
        - ["hinter", "hinter dem Vorhang", "hinter der Tür"]
        - ["neben", "neben dem Fenster", "neben der Tafel"]
        - ["zwischen", "zwischen den Büchern (plural)", ""]
    - title: "Unsere Hinweise (our clues)"
      head: ["Ei", "Hinweis"]
      rows:
        - ["1", ""]
        - ["2", ""]
        - ["3", ""]
    - title: "Gefunden! (found it)"
      head: ["Ei", "Wo war es?", "Gefunden?"]
      blank: 3

output:
  a1: "Write about Easter in your family, or another spring holiday you celebrate: An Ostern ___ wir ___. Wir essen ___. Ich finde das Fest ___. Read it to a partner. They say one thing that's the same or different in their family."
  b1: "Write your Osterwünsche (5–6 sentences) with the Konjunktiv II: Wenn ich in den Ferien Zeit hätte, würde ich ... Ich hätte gern ... Ich würde gern einmal ... Your partner picks your most interesting wish and asks one question about it (Warum würdest du ...?)."

landeskunde:
  title: "Ostern in den deutschsprachigen Ländern"
  text: |
    Easter Monday (Ostermontag) is a day off in Germany, Austria and Switzerland, and Good Friday (Karfreitag) is a holiday across Germany too. Customs vary by region. In the north, villages light big Osterfeuer (bonfires) on Saturday night to send off winter. In Franconia, people decorate village fountains with thousands of painted eggs (Osterbrunnen). Families hang painted eggs on branches or small trees (Ostereierbaum). In Austria and Bavaria, people tap hard-boiled eggs against each other (Eierpecken), and the one whose egg doesn't crack wins.

    And the Easter Bunny itself is a German invention. The Osterhase appears in German writing in the 1600s and came to America with German immigrants, especially to Pennsylvania.
  warum: "Many Easter customs (fire, eggs, rabbits, decorated water) celebrate the end of winter. Why might spring matter so much in a place with long, dark winters?"
  vergleich: "The Easter Bunny came to the US with German immigrants. Which other American customs might have German roots? (Hint: think about Christmas.)"

exit:
  a1: "Ich kann sagen, wo etwas ist, und Ostertraditionen beschreiben."
  b1: "Ich kann Wünsche mit dem Konjunktiv II ausdrücken."

energizer:
  title: "Eierlauf (egg-and-spoon race)"
  text: "Teams race carrying a hard-boiled, plastic or paper egg on a spoon. Cheer in German: Los! Schneller! Vorsicht! Langsam! At the finish line, each runner says one preposition sentence before the next one starts: Das Ei ist auf dem Löffel!"

extension:
