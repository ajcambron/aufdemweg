buffer: "Egg decorating with German color words (Ich male das Ei rot und gelb.), or a second egg hunt with harder two-preposition clues."

page:
  modules:
    einstieg: "One hidden egg: warm / kalt clues"
    input: "Sentence builder + narrow reading (Lotta & Jakob, Frau Heller & Laura) + Achte auf die Form"
    kernaufgabe: "Ostereiersuche mit Hinweisen: hide, write clues, swap"
    landeskunde: "Ostern in den deutschsprachigen Ländern"
    energizer: "Eierlauf (egg-and-spoon race)"
    extension: "Wünsche und Träume (Konjunktiv II)"
    buffer: "Egg decorating, or a harder egg hunt"
  einstieg: "Before class, hide one paper egg in the room. Start with *Der Osterhase war hier! Das Ei ist hier im Zimmer.* Give clues one at a time, getting more specific: *Es ist in der Nähe vom Fenster ... Es ist unter etwas ... Es ist unter dem Stuhl!* Students call out *Warm! Kalt!* as you go until someone finds it."
  materials:
    - "Student packet, one per student"
    - "Paper eggs, three per pair (cut-outs or colored paper)"
    - "Optional: spoons and plastic or hard-boiled eggs for the race"
  summary: "Ostereiersuche mit Hinweisen. Pairs hide three paper eggs in the room and write one clue per egg with a preposition (*Das Ei ist unter dem Stuhl neben der Tür*). They swap clue sheets with another pair, find those eggs and record where each one was. A1/A2 use one preposition per clue from the bank; B1/B2 stack two prepositions and give warm/cold hints in full sentences."
  note:
    type: note
    text: "Easter Sunday is March 28, a no-school week, so the Easter class comes a week early. Not every family celebrates Easter: the output task allows any spring holiday, and the Landeskunde treats Easter as a cultural custom."
  grammar: |
    **A1/A2: Wo ist das Ei? (Week 4 revisited).** When the question is *Wo?* (where is it?), place prepositions take the dative:

    | | der / das-words | die-words | plural |
    | :--- | :--- | :--- | :--- |
    | Normal | der Stuhl, das Regal | die Tür | die Bücher |
    | Wo? | unter **dem** Stuhl, **im** Regal | hinter **der** Tür | zwischen **den** Büchern |

    **B1/B2: wishes with Konjunktiv II.** Three forms do almost all the work:

    | Form | Meaning | Example |
    | :--- | :--- | :--- |
    | ich **hätte** gern | I would like (to have) | Ich hätte gern einen Hund. |
    | ich **würde** gern + infinitive | I would like to | Ich würde gern nach Wien fahren. |
    | ich **wäre** | I would be | Ich wäre gern Pilotin. |

    **If-sentences:** *Wenn ich Zeit **hätte**, **würde** ich mehr lesen.* The *wenn*-clause sends its verb to the end, and the main clause starts with *würde* (Week 5's verb-comma-verb pattern).
  achtung: "**What students will do:** A1/A2 will use the dictionary article (*„unter der Stuhl“*). In a hunt, the egg still gets found, so restate it and move on. B1/B2 will build *würde* sentences but forget to put the infinitive at the end (*„Ich würde gern fahren nach Wien“*), or say *würde haben* instead of *hätte*. The Achte-auf-die-Form items check the bigger point: telling a wish from a fact."
  b2: "**If a B2 asks:** *Ich möchte* is itself a Konjunktiv II form (of *mögen*), which is why it sounds polite. *Könnte* (could) and *sollte* (should) are the same mood. *Würde* + infinitive can stand in for almost any Konjunktiv II verb, but *hätte* and *wäre* are preferred for *haben* and *sein*."
  vocab_extra:
    - ["verstecken", "to hide"]
    - ["der Brauch", "custom, tradition"]
    - ["der Wunsch", "wish"]
    - ["Eierpecken", "egg tapping (game)"]
    - ["das Osterfeuer", "Easter bonfire"]
    - ["kostbar", "precious"]
