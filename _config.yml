# Site settings
title: Auf dem Weg
email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  Auf dem Weg is a collection of German language teaching resources.
baseurl: ""
url: "https://aufdemweg.cambron.cc"
github_username: ajcambron

# Build settings
theme: just-the-docs
plugins:
  - jekyll-feed
  - just-the-docs

# Callouts
callouts:
  warning:
    title: Achtung
    color: red
  highlight:
    title: Highlight
    color: yellow
  discussion:
    title: Diskussion
    color: blue
  reflection:
    title: Reflexion
    color: purple
  good:
    title: Gut gemacht
    color: green
  vocab:
    title: Wortschatz
    color: blue
  grammar:
    title: Grammatik
    color: purple
  culture:
    title: Landeskunde
    color: green
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow

favicon_ico: "/assets/images/favicon.ico"

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
  focus_shortcut_key: 'k'

mermaid:
  version: "9.1.3"

# Aux links for the upper right navigation
aux_links:
  "cambron.cc":
    - "//cambron.cc"
aux_links_new_tab: false

heading_anchors: true

exclude:
  - README.md
  - wrangler.jsonc
  - CLAUDE.md
  - cloudflare.yml
  - worksheet-sources/
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
